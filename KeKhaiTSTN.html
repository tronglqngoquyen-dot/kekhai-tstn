  if (!v) return '';
  const s = strip(v);
  let m = s.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})/);
  if (!m) m = s.match(/ngay\s*(\d{1,2})\s*thang\s*(\d{1,2})\s*nam\s*(\d{4})/);
  if (m) return `${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  m = s.match(/\b(19|20)\d{2}\b/); return m ? `${m[0]}-01-01` : '';
}

// ---------------------------------------------------------------- NHÃN TRƯỜNG
// Mỗi nhãn: khoá dữ liệu + biểu thức (trên chuỗi đã bỏ dấu)
const L = (k, re) => ({ k, re: new RegExp(re, 'g') });
const PERSON_LABELS = [
  L('hoTen', 'ho va ten'), L('ngaySinh', 'ngay,? thang,? nam sinh'), L('queQuan', 'que quan'),
  L('noiThuongTru', 'noi thuong tru|noi dang ky thuong tru'), L('noiOHienNay', 'noi o hien nay|cho o hien nay'),
  L('ngheNghiep', 'chuc vu\\/chuc danh\\/nghe nghiep,? cong viec dang lam|nghe nghiep'),
  L('chucVu', 'chuc vu\\/chuc danh cong tac|chuc vu\\/chuc danh|chuc vu'),
  L('heSoPhuCap', 'he so phu cap chuc vu(?: \\(neu co\\))?'),
  L('noiLamViec', 'co quan, don vi cong tac, noi lam viec|noi lam viec'),
  L('coQuan', 'co quan\\/don vi cong tac|co quan, don vi cong tac'),
  L('soDinhDanh', 'so the can cuoc\\/so cccd\\/so dinh danh ca nhan|so dinh danh ca nhan\\/so the can cuoc|so can cuoc cong dan hoac (?:giay )?chung minh nhan dan|so can cuoc cong dan|so cccd|so dinh danh ca nhan|so the can cuoc|so cmnd'),
  L('ngayCap', 'ngay cap'), L('noiCap', 'noi cap'), L('soDienThoai', 'so dien thoai')
];
const ASSET_LABELS = [
  L('loaiDat', 'loai dat'), L('loaiNha', 'loai nha'), L('ten', 'ten cong trinh|ten co phieu|ten trai phieu|ten giay to co gia|ten tai san'),
  L('loaiCongTrinh', 'loai cong trinh'), L('capCongTrinh', 'cap cong trinh'),
  L('diaChi', 'dia chi'), L('dienTich', 'dien tich su dung|dien tich'),
  L('giaTri', 'tong gia tri|gia tri'), L('gcn', 'giay chung nhan quyen su dung|giay chung nhan quyen so huu|giay chung nhan'),
  L('thongTinKhac', 'thong tin khac(?: \\(neu co\\))?'), L('nguon', 'nguon hinh thanh'), L('tinhTrang', 'tinh trang quan ly, su dung(?:, so huu)?|tinh trang quan ly|tinh trang su dung'),
  L('ghiChu', 'ghi chu'), L('loaiCay', 'loai cay'), L('loaiRung', 'loai rung'), L('tenGoi', 'ten goi'), L('donVi', 'don vi(?! cong tac)(?!, to chuc)'),
  L('soLuong', 'so luong, don vi tinh|so luong, gia tri|so luong'), L('soDangKy', 'so dang ky'), L('namSoHuu', 'nam bat dau so huu'),
  L('hinhThuc', 'hinh thuc, loai von gop|hinh thuc gop von'), L('minhChung', 'tai lieu minh chung(?: \\(neu co\\))?'),
  L('loai', 'loai tai san'), L('chuTK', 'ten chu tai khoan'), L('chuNo', 'ben cho vay'), L('noiDung', 'so luong, chung loai'), L('soTK', 'so tai khoan thanh toan|so tai khoan\\/so so tiet kiem|so tai khoan|so so tiet kiem'),
  L('nganHang', 'ten ngan hang, chi nhanh ngan hang, to chuc noi mo tai khoan|ten ngan hang'),
  L('toChuc', 'tai don vi, to chuc'), L('soDu', 'so du tai thoi diem ke khai|so tien'),
];
// Tách một dòng thành các cặp nhãn: giá trị (dòng có thể chứa nhiều nhãn)
function splitLabels(line, labels) {
  const sl = strip(line); const hits = [];
  labels.forEach(({ k, re }) => { re.lastIndex = 0; let m; while ((m = re.exec(sl))) { const before = sl[m.index - 1]; if (m.index > 0 && /[a-z0-9]/.test(before)) continue; const pre = sl.slice(0, m.index); if ((pre.match(/\(/g) || []).length > (pre.match(/\)/g) || []).length) continue; hits.push({ k, s: m.index, e: m.index + m[0].length }); } });
  hits.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const kept = []; let end = -1; hits.forEach(h => { if (h.s >= end) { kept.push(h); end = h.e; } });
  // chỉ nhận nhãn có dấu ":" ngay sau (hoặc chú thích số); riêng "ngày cấp", "nơi cấp" chấp nhận không có dấu hai chấm
  const NOCOLON = new Set(['ngayCap', 'noiCap']);
  let ok = kept.filter(h => /^\s*(\(\d+\)|\d+)?\s*[:：]/.test(sl.slice(h.e, h.e + 8)) || (NOCOLON.has(h.k) && /^\s+\S/.test(sl.slice(h.e, h.e + 3))));
  // Nhãn dạng văn bản tự do: phần còn lại của dòng thuộc về nhãn này (tránh tách nhầm "Địa chỉ:" nằm trong "Thông tin khác")
  const FREE = new Set(['thongTinKhac', 'ghiChu', 'nguon', 'tinhTrang', 'minhChung']);
  const fi = ok.findIndex(h => FREE.has(h.k)); if (fi >= 0) ok = ok.slice(0, fi + 1);
  const out = {};
  ok.forEach((h, i) => { const raw = line.slice(h.e, i + 1 < ok.length ? ok[i + 1].s : line.length); let v = cleanVal(raw.replace(/^\s*(\(\d+\)|\d+)?\s*[:：]/, ''));
    if (FREE.has(h.k) && i === ok.length - 1) { const full = norm(raw.replace(/^\s*(\(\d+\)|\d+)?\s*[:：]/, '')).replace(/[.…]{3,}/g, ' ').trim(); if (/\.$/.test(full) && v && !/\.$/.test(v)) v += '.'; }
    if (!(h.k in out) || !out[h.k]) out[h.k] = v; });
  return out;
}

// ---------------------------------------------------------------- PHÂN TÍCH
function parseDeclText(rawLines) {
  const lines = rawLines.map(x => norm(String(x).replace(/\n/g, ' '))).filter(x => x && !/^[-_—=.…\s|]+$/.test(x));
  const d = K.newDecl({ phuongThuc: 'hang_nam' });
  const rep = { mau: '', nhan: [], boQua: [], canhBao: [] };
  const all = strip(lines.join('\n'));
  rep.mau = /quyen su dung thuc te doi voi dat|(^|[^\d])50 trieu dong/.test(all) ? 'NĐ 130/2020/NĐ-CP' : (/150 trieu dong|tai san so|nghi dinh so 164/.test(all) ? 'NĐ 164/2026/NĐ-CP' : 'không rõ');

  // --- Tiêu đề, phương thức, ngày
  const titleIdx = lines.findIndex(x => /ban ke khai tai san/.test(strip(x)));
  if (titleIdx > 0) {
    const rawTitle = rawLines.findIndex(x => /ban ke khai tai san/.test(strip(x)));
    const head = rawLines.slice(0, rawTitle > 0 ? rawTitle : titleIdx).flatMap(x => String(x).split(/ \| |\n/)).map(norm)
      .filter(x => x && !/cong hoa xa hoi|doc lap - tu do|dang cong san viet nam|^so:|ngay .* thang|^[-_—=.…\s]+$/.test(strip(x)));
    const org = head.filter(x => x === x.toUpperCase() && /[A-ZĐ]/.test(x) && x.length > 3);
    if (org.length) d.tenCoQuanDauTrang = [...new Set(org)].slice(0, 3).join('\n');
  }
  const titleZone = strip(lines.slice(Math.max(0, titleIdx), titleIdx + 3).join(' '));
  const pts = [['lan_dau', /lan dau/], ['hang_nam', /hang nam|hàng năm/], ['bo_sung', /bo sung/], ['can_bo', /phuc vu cong tac can bo/]].filter(([, re]) => re.test(titleZone));
  if (pts.length === 1) d.phuongThuc = pts[0][0]; else rep.canhBao.push('Không xác định chắc phương thức kê khai trong tiêu đề — mặc định "Kê khai hằng năm", hãy kiểm tra lại.');
  const ny = titleZone.match(/nam (20\d{2})/);
  const dateLine = lines.slice(titleIdx, titleIdx + 4).find(x => /ngay/.test(strip(x)) && /\d/.test(x));
  if (dateLine) { d.ngayChot = parseDate(dateLine); }

  // ngày ký ở cuối bản
  { const sig = lines.slice(-25).reverse().find(x => /,\s*ngay\s*\d{1,2}\s*thang/.test(strip(x))); if (sig) { const parts = sig.split(' | '); const tail = parts[parts.length - 1]; const m = tail.match(/^\s*([^,|]{2,40}),\s*ng[aà]y/i); if (m && !/^\.+$/.test(m[1].trim())) d.diaDanh = m[1].trim(); } }
  for (let i = lines.length - 1; i > lines.length - 25 && i >= 0; i--) { const s = strip(lines[i]); if (/ngay\s*\d{1,2}\s*thang\s*\d{1,2}\s*nam\s*\d{4}/.test(s)) { const all2 = [...s.matchAll(/ngay\s*(\d{1,2})\s*thang\s*(\d{1,2})\s*nam\s*(\d{4})/g)]; const m = all2[all2.length - 1]; d.ngayKeKhai = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; break; } }
  if (!d.ngayChot) d.ngayChot = d.ngayKeKhai;
  if (rep.mau === 'NĐ 130/2020/NĐ-CP' && d.ngayChot && d.ngayKeKhai && d.ngayChot !== d.ngayKeKhai) {
    rep.canhBao.push(`Ngày ghi ở tiêu đề (${K.fmtDate(d.ngayChot)}) khác ngày ký ở cuối bản (${K.fmtDate(d.ngayKeKhai)}). Ứng dụng lấy ngày ở tiêu đề làm ngày kê khai lần trước để tính kỳ thu nhập năm nay — nếu bản đã nộp ghi ngày khác, sửa ở trang "Kỳ kê khai".`);
    d.ngayKeKhai = d.ngayChot;
  }
  d.nam = Number((d.ngayChot || d.ngayKeKhai || '').slice(0, 4)) || (ny ? Number(ny[1]) : new Date().getFullYear() - 1);

  // --- Duyệt từng dòng theo trạng thái
  let part = 0, sub = '', group = null, cur = null, person = null, moneyTotal = 0, incomeDone = false;
  const pushItem = gk => { cur = K.newItem(gk); cur._imported = true; d.ts[gk].push(cur); return cur; };
  const ensure = gk => (cur && cur._g === gk) ? cur : Object.assign(pushItem(gk), { _g: gk });
  const setItem = (gk, obj) => {
    const g = K.GROUP[gk]; const it = ensure(gk);
    Object.entries(obj).forEach(([k, v]) => {
      if (isNone(v) && k !== 'giaTri') return;
      if (k === 'giaTri') { if (/khong xac dinh/.test(strip(v))) { it.giaTri_unk = true; it.giaTri_unkReason = cleanVal(v.replace(/kh[oô]ng x[aá]c [dđ][iị]nh[^()]*/i, '')).replace(/^\(|\)$/g, '') || 'Theo bản kê khai cũ'; } else { const n = parseMoney(v.replace(/\([^)]*\)/g, '')) || parseMoney(v); if (n) it.giaTri = String(n); fxFromText(it, v); const pm = v.match(/\(([^)]+)\)/); if (pm && /mua|chuyen nhuong|tang|thua ke|xay|cho\b|nhan/.test(strip(pm[1])) && g.fields.some(f => f.k === 'nguon')) it.nguon = it.nguon || (pm[1].charAt(0).toUpperCase() + pm[1].slice(1)); } return; }
      if (k === 'dienTich') { it.dienTich = parseArea(v); return; }
      if (k === 'soDu') { const n = parseMoney(v); if (n) it.giaTri = String(n); return; }
      if (k === 'namSoHuu') { it.thongTinKhac = [it.thongTinKhac, 'Năm bắt đầu sở hữu: ' + v].filter(Boolean).join('; '); return; }
      if (k === 'loaiCongTrinh' || k === 'capCongTrinh') { it.thongTinKhac = [it.thongTinKhac, (k === 'loaiCongTrinh' ? 'Loại công trình: ' : 'Cấp công trình: ') + v].filter(Boolean).join('; '); return; }
      if (k === 'loaiNha') { const s = strip(v); it.loaiNha = /can ho/.test(s) ? 'Căn hộ' : /biet thu/.test(s) ? 'Biệt thự' : 'Nhà ở riêng lẻ'; return; }
      if (k === 'ten' && gk === 'tsKhac') { it.loai = v; return; }
      if (k === 'thongTinKhac' && !g.fields.some(f => f.k === 'thongTinKhac')) { it.ghiChu = [it.ghiChu, v].filter(Boolean).join('; '); return; }
      if (g.fields.some(f => f.k === k)) it[k] = it[k] ? it[k] + '; ' + v : v;
      else if (g.fields.some(f => f.k === 'ghiChu')) it.ghiChu = [it.ghiChu, v].filter(Boolean).join('; ');
      else if (g.fields.some(f => f.k === 'thongTinKhac')) it.thongTinKhac = [it.thongTinKhac, v].filter(Boolean).join('; ');
    });
    // diaChi: tách địa chỉ cũ trong ngoặc nếu có
    if (it.diaChi && /\(dia chi tren giay chung nhan:/.test(strip(it.diaChi))) { const m = it.diaChi.match(/\((?:[^:]*):\s*([^)]*)\)/); if (m) { it.diaChiCu = m[1]; it.diaChi = it.diaChi.replace(m[0], '').trim(); } }
  };
  function fxFromText(it, v) { const m = strip(v).match(/([\d.,]+)\s*(usd|eur|jpy|cny|krw|aud|gbp|sgd|thb)\b/); if (m) { it.giaTri_cur = m[2].toUpperCase(); it.giaTri_fx = m[1]; const r = strip(v).match(/ty gia\s*([\d.,]+)/); if (r) it.giaTri_rate = r[1]; } }

  const SUBMAP = [
    [/^1\.1\b/, 'datO'], [/^1\.2\b/, 'datKhac'], [/^2\.1\b/, 'nhaO'], [/^2\.2\b/, 'congTrinh'],
    [/^3\.1\b/, 'cayLauNam'], [/^3\.2\b/, 'rung'], [/^3\.3\b/, 'vatKienTruc'],
    [/^4\.\s*vang|^4\s*\.?\s*vang/, 'kimLoaiQuy'], [/^5\.\s*tien|^5\s+tien/, 'tien'],
    [/^6\.1\b/, 'coPhieu'], [/^6\.2\b/, 'traiPhieu'], [/^6\.3\b/, 'vonGop'], [/^6\.4\b/, 'giayToCoGia'], [/^6\.\s*co phieu/, 'ck'],
    [/^7\.1\b/, 'tsDangKy'], [/^7\.2\b/, 'tsKhac'], [/^7\.\s*tai san khac/, 'tsKhacHead'],
    [/^8\.\s*tai san o nuoc ngoai/, 'tsNuocNgoai'], [/^9\.\s*tai khoan o nuoc ngoai/, 'tkNuocNgoai'],
    [/^10\.\s*tong thu nhap/, 'thuNhap'], [/^11\.\s*cac khoan no/, 'no']
  ];
  const ITEM_START = /^(\d+(?:\.\d+){1,3}\.?\s*)?(thua|nha|cong trinh|tai san|khoan no|khoan) thu (nhat|hai|ba|tu|nam|sau|bay|tam|chin|muoi|\d+)/;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i]; const s = strip(line);
    if (/^i\.\s*thong tin chung/.test(s)) { part = 1; sub = ''; continue; }
    if (/^ii\.\s*thong tin mo ta/.test(s)) { part = 2; group = null; cur = null; continue; }
    if (/^iii\.\s*bien dong/.test(s)) { part = 3; continue; }
    if (/^iv\.\s*noi dung thay doi/.test(s)) { part = 4; continue; }
    if (/^nguoi nhan ban ke khai|^nguoi ke khai tai san/.test(s) || /nguoi nhan ban ke khai|nguoi ke khai tai san/.test(s) && /ngay/.test(s)) { part = 9; continue; }
    if (part === 1) {
      if (/^1\.\s*nguoi ke khai/.test(s)) { person = d.nguoi; continue; }
      if (/^2\.\s*(vo|chong)\b/.test(s)) { person = d.voChong; d.coVoChong = true; continue; }
      if (/^3\.\s*con chua thanh nien/.test(s)) { person = null; sub = 'con'; continue; }
      if (sub === 'con' && /con thu (nhat|hai|ba|tu|\d)/.test(s)) { person = K.emptyChild(); d.con.push(person); continue; }
      const kv = splitLabels(line, PERSON_LABELS);
      if (sub === 'con' && !person && kv.hoTen) { person = K.emptyChild(); d.con.push(person); }
      if (!person || !Object.keys(kv).length) { if (line.length > 3 && !/^\d+\.|^khong co$/.test(s)) rep.boQua.push(line); continue; }
      if (sub === 'con' && person && kv.hoTen && person.hoTen) { person = K.emptyChild(); d.con.push(person); }
      // Phòng đề mục viết khác mẫu: đã có tên người kê khai mà gặp thêm "Họ và tên" thì coi là vợ/chồng
      if (person === d.nguoi && kv.hoTen && d.nguoi.hoTen && !isNone(kv.hoTen)) { person = d.voChong; d.coVoChong = true; rep.canhBao.push('Đề mục vợ/chồng không đúng mẫu — đã tự nhận "' + titleName(kv.hoTen) + '" là vợ/chồng, hãy kiểm tra lại.'); }
      Object.entries(kv).forEach(([k, v]) => {
        if (isNone(v)) return;
        if (k === 'ngaySinh' || k === 'ngayCap') v = parseDate(v);
        if (person === d.voChong && k === 'chucVu') k = 'ngheNghiep';
        if (person === d.voChong && k === 'coQuan') k = 'noiLamViec';
        if (person === d.nguoi && k === 'ngheNghiep') k = 'chucVu';
        if (person === d.nguoi && k === 'noiLamViec') k = 'coQuan';
        if (k === 'soDinhDanh') { const m = v.match(/\d{9,12}/); v = m ? m[0] : v; }
        if (k === 'hoTen') v = titleName(v);
        if (k in person) person[k] = v;
      });
      continue;
    }
    if (part === 2) {
      const hit = SUBMAP.find(([re]) => re.test(s));
      if (hit) {
        group = hit[1]; cur = null;
        const tailTxt = cleanVal(line.slice(line.lastIndexOf(':') + 1));
        const hasTail = line.includes(':') && tailTxt && !isNone(tailTxt) && !/^\(?\d+\)?$/.test(tailTxt);
        if (group === 'tien' && hasTail) { moneyTotal = parseMoney(tailTxt); if (moneyTotal && /\(.+\)/.test(tailTxt)) rep._tienMoTa = tailTxt; }
        if (group === 'kimLoaiQuy' && hasTail && !/ten tai san/.test(strip(tailTxt))) { const it = pushItem('kimLoaiQuy'); it.ten = tailTxt.split(/,\s*gi[aá] tr[iị]/i)[0]; const sl2 = tailTxt.match(/(\d+(?:[.,]\d+)?)\s*(chỉ|lượng|gam|gram|kg|cây|g)(?=[\s,;.)]|$)/i); if (sl2) it.soLuong = sl2[0]; const n = parseMoney(tailTxt.replace(sl2 ? sl2[0] : '', '')); if (n) it.giaTri = String(n); cur = null; }
        if (group === 'thuNhap') { const after = line.split(/:\s*/).slice(1).join(':'); const n = parseMoney(after); if (n) { d.thuNhap.ban.luong = String(n); incomeDone = true; } }
        // Nội dung ngay trên dòng tiêu đề nhóm (VD "3.1. Cây lâu năm: - Loại cây: ...")
        const rest = line.replace(/^[\d.\s]+[^:]*:/, '');
        if (K.GROUP[group] && /:/.test(rest)) { const kv = splitLabels(rest, ASSET_LABELS); if (Object.keys(kv).length) setItem(group, kv); }
        if (K.GROUP[group] && isNone(cleanVal(line.split(':').slice(1).join(':')))) { /* "Không có" */ }
        continue;
      }
      if (!group) continue;
      if (group === 'tien') {
        const kv = splitLabels(line, ASSET_LABELS);
        if (/^5\.1|tien mat/.test(s) && !kv.soTK) { const v = parseMoney(line.split(':').slice(1).join(':').split(/tình trạng/i)[0]); if (v) { const it = pushItem('tienMat'); it.giaTri = String(v); const tt = line.match(/Tình trạng[^:]*:\s*(.*)$/i); if (tt) it.tinhTrang = cleanVal(tt[1]); } continue; }
        if (/^5\.2|tien cho vay/.test(s)) { const v = parseMoney(line.split(':').slice(1).join(':').split(/tài liệu/i)[0]); if (v) { const it = pushItem('tienChoVay'); it.giaTri = String(v); const mc = line.match(/minh chứng[^:]*:\s*(.*)$/i); if (mc) it.minhChung = cleanVal(mc[1]); } continue; }
        if (/^5\.3|tien tra truoc/.test(s)) { const v = parseMoney(line.split(':').slice(1).join(':').split(/tài liệu/i)[0]); if (v) { const it = pushItem('tienTraTruoc'); it.giaTri = String(v); } continue; }
        if (kv.soTK || kv.soDu) {
          const gk = /tiet kiem/.test(s) ? 'soTietKiem' : 'taiKhoan'; const it = pushItem(gk);
          if (kv.soTK && !isNone(kv.soTK)) it.soTK = kv.soTK; if (kv.toChuc) it.toChuc = kv.toChuc; if (kv.soDu) it.giaTri = String(parseMoney(kv.soDu)); continue;
        }
        if (/cac loai tien gui khac/.test(s)) { const v = parseMoney(line); if (v) { const it = pushItem('tienGuiKhac'); it.moTa = 'Tiền gửi khác'; it.giaTri = String(v); } continue; }
        const v = parseMoney(line); if (v && !moneyTotal) moneyTotal = v;
        continue;
      }
      if (group === 'thuNhap') {
        const km = s.match(/^\(?tu ngay\s*(\d{1,2}\/\d{1,2}\/\d{4})\s*den ngay\s*(\d{1,2}\/\d{1,2}\/\d{4})/);
        if (km) { const tu = parseDate(km[1]); d._kyTu = tu; continue; }
        if (/^\+\s*thu nhap tu luong/.test(s)) { const n = parseMoney(line.split(':').slice(1).join(':')); if (n) { if (d._tnWho === 'vc') d.thuNhap.voChong.luong = String(n); else d.thuNhap.ban.luong = String(n); incomeDone = true; } continue; }

function structureCheck(rawLines, report) {

    if (idx >= 0) { last = idx; return; }

  });

async function importFile(file) {
  const name = (file.name || '').toLowerCase();
  if (name.endsWith('.docx')) { const lines = await docxToLines(await file.arrayBuffer()); return Object.assign(parseDeclText(lines), { lines }); }
  if (name.endsWith('.txt')) return parseDeclText((await file.text()).split(/\r?\n/));

  if (name.endsWith('.pdf')) throw new Error('Chưa đọc trực tiếp được PDF. Mở PDF, bấm Ctrl+A rồi Ctrl+C, sau đó chọn "Dán nội dung" và Ctrl+V. Bản scan (ảnh chụp) thì cần nhập tay.');

function toast(msg, ms = 2800) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function modal(title, bodyHtml, buttons = [], cls = '') {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal ' + cls;
    m.innerHTML = `<div class="box"><div class="mh"><h2>${title}</h2><button class="btn ghost icon" data-x title="Đóng">${ic('x')}</button></div><div class="mb">${bodyHtml}</div><div class="mf">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
    document.body.appendChild(m);
    const close = v => { m.remove(); res(v); };
    m.addEventListener('click', e => {
      if (e.target.matches('[data-x]') || e.target === m) close(null);
      const b = e.target.closest('[data-i]'); if (b) { const btn = buttons[+b.dataset.i]; const v = btn.value !== undefined ? btn.value : true; if (btn.onClick) { const r = btn.onClick(m); if (r === false) return; close(r === undefined ? v : r); } else close(v); }
    });
    const first = m.querySelector('input,textarea,select'); if (first) setTimeout(() => first.focus(), 50);
    m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { const pri = m.querySelector('.mf .btn.pri'); if (pri) pri.click(); } });
    if (buttons.length === 0) m.querySelector('.mf').remove();
    m._close = close;
  });
}

async function saveBlob(blob, name, handleKey) {
  if (window.showSaveFilePicker) {
    try {
      let h = handleKey && fileHandles[handleKey];
      if (!h) { const ext = name.split('.').pop(); h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext.toUpperCase(), accept: { [blob.type || 'application/octet-stream']: ['.' + ext] } }] }); if (handleKey) fileHandles[handleKey] = h; }
      const w = await h.createWritable(); await w.write(blob); await w.close(); return true;
    } catch (e) { if (e.name === 'AbortError') return false; console.warn(e); }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return true;
}
function pickFiles(accept, multiple = false) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = multiple; i.onchange = () => res([...i.files]); i.click(); });
}
const readText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f); });

async function openTstnText(text, fileName) {
  let pw = null, data = null;
  for (let tries = 0; tries < 3; tries++) {
    try { data = await K.decryptJSON(text, pw); break; }
    catch (e) {
      if (e.needPw || e.badPw) { pw = await askPassword(e.badPw ? 'Sai mật khẩu — thử lại' : 'File được mã hoá', `Nhập mật khẩu để mở <b>${esc(fileName)}</b>.`); if (pw === null) return null; }
      else { toast(e.message); return null; }
    }
  }
  return data ? { data, pw } : null;
}

function fld(path, label, val, o = {}) {
  const t = o.t || 'text'; const h = o.hint ? `<span class="h">${esc(o.hint)}</span>` : '';

  if (t === 'area') return `<label class="${cls}">${esc(label)}${h}<textarea data-b="${path}" rows="${o.rows || 2}">${esc(val)}</textarea></label>`;
  if (t === 'select') return `<label class="${cls}">${esc(label)}${h}<select data-b="${path}">${o.opts.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
  if (t === 'date') return `<label class="${cls}">${esc(label)}${h}<input type="date" data-b="${path}" value="${esc(val)}"></label>`;
  if (t === 'money') return `<label class="${cls}">${esc(label)}${h}<input type="text" inputmode="numeric" data-b="${path}" data-money value="${val ? esc(K.fmtMoney(K.num(val))) : ''}" placeholder="0"><span class="money-read">${val && K.num(val) ? esc(K.docSo(K.num(val))) : ''}</span></label>`;
  if (t === 'num') return `<label class="${cls}">${esc(label)}${h}<input type="text" inputmode="decimal" data-b="${path}" value="${esc(val)}"></label>`;
  return `<label class="${cls}">${esc(label)}${h}<input type="text" data-b="${path}" value="${esc(val)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}></label>`;
}

function pageHead(pid, html) {
  const m = html.match(/^\s*<h1>([\s\S]*?)<\/h1>(?:<p class="sub">([\s\S]*?)<\/p>)?/);
  if (!m) return html;
  const title = m[1].replace(/^(?:[IVX]+\.|\d+\.|[IV]+\.\d+|\d+–\d+\.)\s*/, '');
  const code = CODE[pid];
  const plate = code ? `<div class="plate${code.length > 3 ? ' sm' : ''}">${code}</div>` : `<div class="plate">${pid === 'xuat' ? ic('clip') : pid === 'daumoi' ? ic('building') : ic('calendar')}</div>`;
  return `<div class="phead">${plate}<div><h1>${title}</h1>${m[2] ? `<p>${m[2]}</p>` : ''}</div></div>` + html.slice(m[0].length);
}

function onInput(e) {
  const el = e.target;
  if (el.dataset.dm !== undefined) return dmInput(e);

  const d = curDecl(); if (!d) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.money !== undefined) {
    const n = K.num(v); const read = el.parentElement.querySelector('.money-read'); if (read) read.textContent = n ? K.docSo(n) : '';
    v = n ? String(n) : '';
  }
  setPath(d, el.dataset.b, v);
  if (el.dataset.fx !== undefined) { const box = el.closest('.full'); const path = el.dataset.b.replace(/\.giaTri_(fx|rate)$/, ''); const it = getPath(d, path); const g = K.GROUP[path.split('.')[1]]; const o = box && box.querySelector('[data-fxout]'); if (o) o.textContent = 'Quy đổi: ' + K.fmtVND(K.itemValue(g, it)); }

}
function onChange(e) {
  const el = e.target;
  if (el.id === 'selHS') { const h = db.hoso.find(x => x.id === el.value); db.cur.hosoId = h.id; db.cur.declId = h.decls.length ? h.decls[h.decls.length - 1].id : null; ui.page = 'ky'; persist(); render(); return; }
  if (el.id === 'selKy') { db.cur.declId = el.value; persist(); render(); return; }
  if (el.dataset.s) { db.settings[el.dataset.s] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? +el.value : (isNaN(+el.value) ? el.value : +el.value)); persist(); return; }
  if (el.dataset.dm !== undefined) return dmChange(e);
  if (el.dataset.b === 'quocHieu') { curDecl().quocHieu = el.value.startsWith('Cơ quan của Đảng') ? 'dang' : 'nha_nuoc'; touch(); return; }

  else if (el.dataset.b && ['thunhap', 'biendong', 'tien', 'ck'].includes(ui.page) && !el.closest('.item-b textarea')) { clearTimeout(window._rrT); window._rrT = setTimeout(() => { if (document.activeElement && document.activeElement.matches('input,textarea,select') && document.activeElement !== el) { const p = document.activeElement.dataset.b; const y = window.scrollY; render(); window.scrollTo(0, y); if (p) { const n = document.querySelector(`[data-b="${p}"]`); if (n) n.focus(); } } else { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 180); }
  if (el.dataset.b && el.closest('.item')) { /* cập nhật tiêu đề mục */ const it = el.closest('.item'); const d = curDecl(); const m = el.dataset.b.match(/^ts\.(\w+)\.#(\w+)/); if (m) { const g = K.GROUP[m[1]]; const idx = d.ts[m[1]].findIndex(x => x.id === m[2]); const obj = d.ts[m[1]][idx]; $('.item-h .t', it).textContent = itemTitle(g, obj, idx); const vv = $('.item-h .v', it); if (vv) vv.textContent = obj.giaTri_unk ? 'Không xác định' : K.fmtVND(K.itemValue(g, obj)); } }
}
async function onClick(e) {
  const el = e.target.closest('[data-act],[data-mode]'); if (!el) return;
  if (el.dataset.mode && !el.dataset.act) { ui.mode = el.dataset.mode; renderShell(); return; }
  const act = el.dataset.act; const d = curDecl();
  const rr = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  switch (act) {
    case 'mode': ui.mode = el.dataset.mode; renderShell(); break;
    case 'goto': { const nav = el.dataset.nav; const pid = NAV_OF[nav] || nav; if (ui.mode !== 'kekhai') { ui.mode = 'kekhai'; } ui.page = pid; render(); window.scrollTo(0, 0); if (nav !== pid) { const g = document.getElementById('g-' + nav); if (g) g.scrollIntoView({ behavior: 'smooth' }); } break; }
    case 'add': { const it = K.newItem(el.dataset.g); d.ts[el.dataset.g].push(it); ui.openItems[it.id] = true; touch(); rr(); break; }
    case 'dup': { e.stopPropagation(); const arr = d.ts[el.dataset.g]; const src = arr.find(x => x.id === el.dataset.id); const it = Object.assign(K.clone(src), { id: K.uid() }); arr.splice(arr.indexOf(src) + 1, 0, it); ui.openItems[it.id] = true; touch(); rr(); break; }
    case 'del': { e.stopPropagation(); if (!await confirmBox('Xoá tài sản', 'Xoá mục này khỏi bản kê khai? Nếu tài sản đã bán/tặng cho trong kỳ, sau khi xoá hãy ghi nguyên nhân giảm ở Mục III.', 'Xoá', true)) return; d.ts[el.dataset.g] = d.ts[el.dataset.g].filter(x => x.id !== el.dataset.id); touch(); rr(); break; }
    case 'toggle': { if (e.target.closest('button')) return; ui.openItems[el.dataset.id] = !ui.openItems[el.dataset.id]; rr(); break; }
    case 'addCon': d.con.push(K.emptyChild()); touch(); rr(); break;
    case 'delCon': if (await confirmBox('Xoá', 'Xoá thông tin người con này?', 'Xoá', true)) { d.con = d.con.filter(x => x.id !== el.dataset.id); touch(); rr(); } break;
    case 'fillSalary': { const per = K.incomePeriod(d, curPrev()); if (!per || !per.tu || !per.den) { toast('Chưa đủ ngày để xác định kỳ thu nhập'); return; } const who = el.dataset.who; const r = K.calcSalary(who === 'ban' ? d.thuNhap.calc : d.thuNhap.calcVoChong, per.tu, per.den, db.settings.lcs); if (!r.total) { toast('Nhập hệ số lương trước'); return; } d.thuNhap[who].luong = String(r.total); touch(); rr(); toast('Đã điền ' + K.fmtVND(r.total) + ' — hãy đối chiếu với thực nhận'); break; }
    case 'suggestBD': K.applyBienDongSuggest(d, curPrev()); touch(); rr(); toast('Đã cập nhật gợi ý biến động'); break;
    case 'addBD': d.bienDong[el.dataset.kind].push({ id: K.uid(), auto: false, moTa: '', giaTri: '', giaiTrinh: '', minhChung: '' }); touch(); rr(); break;
    case 'delBD': d.bienDong[el.dataset.kind] = d.bienDong[el.dataset.kind].filter(x => x.id !== el.dataset.id); touch(); rr(); break;
    case 'newHS': return newHoSoFlow(!!el.dataset.ho);
    case 'newKy': return newKyFlow();
    case 'hsMenu': return hsMenu();
    case 'preview': return previewDecl(d);
    case 'docx': return exportDocx(d);
    case 'print': return printDecl(d);
    case 'sendFile': return sendFileFlow();
    case 'json': { const blob = new Blob([JSON.stringify(K.exportStructured(curHoSo(), d, curPrev()), null, 2)], { type: 'application/json' }); saveBlob(blob, `KeKhai_${safeName(d.nguoi.hoTen)}_${d.nam}.json`); break; }
    case 'saveAll': return backupAll();
    case 'install': return installApp();
    case 'instGuide': return installGuide();
    case 'moveData': return moveDataOut();
    case 'openFile': return openFileFlow();
    case 'importOld': return importOldFlow();
    case 'pasteOld': return pasteOldFlow();
    case 'settings': return settingsModal();
    case 'about': return aboutModal();
    default: if (act.startsWith('dm')) return dmClick(e, el, act);
  }
}

function exportOpts(d) { return { fontSize: +db.settings.fontSize || 14, footer: '', title: 'Bản kê khai tài sản, thu nhập — ' + (d.nguoi.hoTen || ''), creator: d.nguoi.hoTen }; }
function declBlocks(d) { return K.buildDeclDoc(d, prevOf(curHoSo(), d), { keKhaiDuoiNguong: db.settings.keKhaiDuoiNguong }); }
async function exportDocx(d, blocks, name) {
  const R = K.review(d, curPrev(), { lcs: db.settings.lcs }); const nErr = R.filter(x => x.level === 'loi').length;
  if (nErr && !blocks) { const ok = await confirmBox('Còn lỗi chưa sửa', `Bản kê khai còn <b>${nErr} lỗi</b>. Vẫn xuất file Word để xem/chỉnh tiếp?`, 'Vẫn xuất'); if (!ok) return; }
  const bytes = K.buildDocx(blocks || declBlocks(d), exportOpts(d));
  await saveBlob(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }), name || `BanKeKhai_${safeName(d.nguoi.hoTen)}_${d.nam}.docx`);

async function sendFileFlow() {
  const h = curHoSo(); const d = curDecl();
  const pw = await askPassword('Lưu file gửi đầu mối', 'File .tstn chứa toàn bộ hồ sơ của bạn (kể cả các kỳ trước để đầu mối đối chiếu biến động). Đặt mật khẩu để mã hoá; chỉ báo mật khẩu cho người tiếp nhận <b>qua kênh riêng</b> (gọi điện, gặp trực tiếp). Để trống nếu không mã hoá (không khuyến nghị).', true);
  if (pw === null) return;

  await saveBlob(new Blob([text], { type: 'application/json' }), `KeKhai_${safeName(d.nguoi.hoTen)}_${d.nam}.tstn`);

async function backupAll() {
  if (!db.hoso.length && !db.dauMoi.items.length) { toast('Chưa có dữ liệu để sao lưu'); return; }
  const pw = await askPassword('Sao lưu toàn bộ dữ liệu', 'Lưu tất cả hồ sơ và dữ liệu đầu mối trên máy này ra một file .tstn. Nên đặt mật khẩu (tối thiểu 6 ký tự) và cất file ở nơi an toàn (USB, Drive cá nhân). Ghi nhớ mật khẩu — mất mật khẩu sẽ không mở được file.', true);
  if (pw === null) return;
  const text = await K.encryptJSON({ type: 'backup', at: new Date().toISOString(), db }, pw);
  const ok = await saveBlob(new Blob([text], { type: 'application/json' }), `SaoLuu_KeKhaiTSTN_${K.todayISO()}.tstn`, 'backup');
  if (ok) { db.settings.lastBackup = new Date().toISOString(); persist(); toast('Đã sao lưu'); }
}
async function mergeDB(src) {
  const empty = !db.hoso.length && !db.dauMoi.items.length;
  if (empty && src.dauMoi && src.dauMoi.meta) db.dauMoi.meta = Object.assign({}, db.dauMoi.meta, src.dauMoi.meta);
  if (empty && src.settings) db.settings = Object.assign({}, db.settings, src.settings, { lastBackup: db.settings.lastBackup });
  (src.hoso || []).forEach(h => { db.hoso = db.hoso.filter(x => x.id !== h.id); db.hoso.push(h); });
  if (src.dauMoi && src.dauMoi.items) src.dauMoi.items.forEach(it => { db.dauMoi.items = db.dauMoi.items.filter(x => x.id !== it.id); db.dauMoi.items.push(it); });
  fixDB(); if (!curDecl() && db.hoso.length) db.cur = { hosoId: db.hoso[0].id, declId: db.hoso[0].decls.slice(-1)[0]?.id };
  await persist(); renderShell();
}
async function openFileFlow() {
  const [f] = await pickFiles('.tstn,.json,.docx'); if (!f) return;
  if (/\.docx$/i.test(f.name)) return importOldFlow(f);
  const r = await openTstnText(await readText(f), f.name); if (!r) return;
  const data = r.data;
  if (data.type === 'backup') {
    const ok = await confirmBox('Khôi phục bản sao lưu', `File sao lưu ngày ${new Date(data.at).toLocaleString('vi-VN')} có ${data.db.hoso.length} hồ sơ. <b>Gộp</b> vào dữ liệu hiện có (hồ sơ trùng sẽ được thay bằng bản trong file)?`, 'Gộp dữ liệu');
    if (!ok) return;
    await mergeDB(data.db); toast('Đã khôi phục'); return;
  }
  const hoso = data.type === 'hoso' ? data.hoso : (data.decls ? data : null);
  if (!hoso) { toast('File không chứa hồ sơ kê khai'); return; }
  if (ui.mode === 'daumoi') { dmAddFromData(data, f.name); return; }
  const exist = db.hoso.find(x => x.id === hoso.id);
  if (exist && !await confirmBox('Hồ sơ đã có trên máy', `Hồ sơ "${esc(hoso.label)}" đã có. Thay bằng dữ liệu trong file (có thể kèm góp ý của đầu mối)?`, 'Thay thế')) return;
  db.hoso = db.hoso.filter(x => x.id !== hoso.id); db.hoso.push(hoso); fixDB();
  const h = db.hoso.find(x => x.id === hoso.id);
  db.cur = { hosoId: h.id, declId: data.sentDeclId && h.decls.some(x => x.id === data.sentDeclId) ? data.sentDeclId : h.decls.slice(-1)[0].id };
  ui.mode = 'kekhai'; const hasCmt = (curDecl().review.comments || []).length; ui.page = hasCmt ? 'xuat' : 'ky';
  await persist(); renderShell(); toast(hasCmt ? 'Đã mở hồ sơ — có góp ý từ đầu mối' : 'Đã mở hồ sơ');
}
function checkBackupReminder() {
  if (!db.hoso.length) return;
  const last = db.settings.lastBackup ? new Date(db.settings.lastBackup) : null;
  if (!last || (Date.now() - last) > 14 * 86400000) setTimeout(() => { setSaved((last ? 'Lần sao lưu cuối: ' + last.toLocaleDateString('vi-VN') : 'Chưa sao lưu ra file') + ' — nên Sao lưu'); }, 1500);
}

async function reviewImport(res, srcName) {

  const r = await modal('Kết quả nhận diện bản kê khai cũ', `

    <table class="t"><tr><th style="width:42%">Nội dung</th><th>Đã nhận diện</th></tr>${report.nhan.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</table>
    ${report.canhBao.length ? `<div class="note warn" style="margin-top:14px">${report.canhBao.map(x => '• ' + esc(x)).join('<br>')}</div>` : ''}

const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const hkey = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return 'k' + (h >>> 0).toString(36); };
function dmItem(id) { return db.dauMoi.items.find(x => x.id === id); }
function dmDecl(it) { if (!it.hoso) return null; return it.hoso.decls.find(x => x.id === it.declId) || it.hoso.decls.slice(-1)[0]; }
function dmPrev(it) { const d = dmDecl(it); return d ? prevOf(it.hoso, d) : null; }
function dmRefresh(it) {
  const d = dmDecl(it); if (!d) return;
  Object.assign(it, { hoTen: d.nguoi.hoTen, chucVu: d.nguoi.chucVu, phuongThuc: K.PHUONG_THUC_TEN[d.phuongThuc], ngayChot: K.fmtDate(d.ngayChot) });
  const content = K.review(d, dmPrev(it), { lcs: db.settings.lcs }).map(f => Object.assign(f, { kind: 'noidung' }));
  it.findings = [...(it.structure || []), ...content].map(f => Object.assign(f, { key: hkey(f.sec + '|' + f.msg) }));
  it.sel = it.sel || {}; it.fixEdit = it.fixEdit || {}; it.manual = it.manual || [];
  it.findings.forEach(f => { if (!(f.key in it.sel)) it.sel[f.key] = f.level !== 'goi_y'; });
}
function dmChosen(it) {
  const pick = (it.findings || []).filter(f => it.sel[f.key]).map(f => ({ level: f.level, sec: f.sec, msg: f.msg, fix: it.fixEdit[f.key] ?? f.fix }));
  return [...pick, ...(it.manual || []).filter(x => x.msg || x.fix).map(x => ({ level: 'loi', sec: x.sec || 'Khác', msg: x.msg, fix: x.fix }))];
}
async function dmAddFromData(data, fileName) {
  const hoso = data.type === 'hoso' ? data.hoso : data;
  hoso.decls = hoso.decls.map(K.normalizeDecl);
  const declId = data.sentDeclId || hoso.decls.slice(-1)[0].id;
  let it = db.dauMoi.items.find(x => x.hoso && x.hoso.id === hoso.id && x.declId === declId);
  if (it) { if (!await confirmBox('Đã có hồ sơ này', `Đã tiếp nhận hồ sơ của ${esc(hoso.label)} trước đó. Cập nhật bằng file mới?`, 'Cập nhật')) return; it.hoso = hoso; it.findings = null; }
  else { it = { id: K.uid(), source: 'file', fileName, hoso, declId, ngayNhan: K.todayISO(), soBo: db.dauMoi.meta.soBo, status: 'Đã nhận', gopY: '', ghiChu: '', mau: 'NĐ 164/2026/NĐ-CP', structure: [] }; db.dauMoi.items.push(it); }
  dmRefresh(it); return it;
}
async function dmAddDocx(file) {
  const res = await window.KKImport.importFile(file);
  const decl = K.normalizeDecl(res.decl);
  const structure = window.KKImport.structureCheck(res.lines, res.report);
  const exist = db.dauMoi.items.find(x => x.hoso && decl.nguoi.soDinhDanh && dmDecl(x) && dmDecl(x).nguoi.soDinhDanh === decl.nguoi.soDinhDanh && dmDecl(x).nam === decl.nam);
  let it = exist;
  if (exist && await confirmBox('Đã tiếp nhận bản của người này', `Đã có bản kê khai năm ${decl.nam} của ${esc(exist.hoTen)}. Thay bằng file mới <b>${esc(file.name)}</b> (bản đã chỉnh sửa)?`, 'Thay bằng bản mới')) {
    const prev = dmPrev(exist); exist.hoso.decls = prev ? [prev, decl] : [decl]; if (prev) { decl.prevId = prev.id; dmMatchIds(decl, prev); }
    Object.assign(exist, { fileName: file.name, declId: decl.id, structure, mau: res.report.mau, findings: null, sel: {}, fixEdit: {}, lanNop: (exist.lanNop || 1) + 1, status: 'Đã nhận' });
  } else {
    const hoso = K.newHoSo(decl.nguoi.hoTen || file.name); hoso.decls.push(decl);
    it = { id: K.uid(), source: 'docx', fileName: file.name, hoso, declId: decl.id, ngayNhan: K.todayISO(), soBo: db.dauMoi.meta.soBo, status: 'Đã nhận', gopY: '', ghiChu: '', structure, mau: res.report.mau, canhBaoNhap: res.report.canhBao, lanNop: 1 };
    db.dauMoi.items.push(it);
  }
  dmRefresh(it); return it;
}
// Ghép tài sản của kỳ này với kỳ trước (hai file độc lập) để so biến động
function dmMatchIds(cur, prev) {
  const keyOf = (gk, x) => [gk, x.diaChi, x.ten, x.soTK, x.soDangKy, x.loaiDat, x.gcn].map(v => String(v || '').toLowerCase().replace(/\s+/g, ' ').trim()).join('|');
  K.GROUPS.forEach(g => {
    const pm = {}; (prev.ts[g.key] || []).forEach(x => { const k = keyOf(g.key, x); (pm[k] = pm[k] || []).push(x); });
    (cur.ts[g.key] || []).forEach(x => { const k = keyOf(g.key, x); const c = pm[k]; if (c && c.length) x.id = c.shift().id; });
  });
}
async function dmIngest(files) {
  const bad = []; let n = 0, last = null;
  for (const f of files) {
    const nm = f.name.toLowerCase();
    try {
      if (nm.endsWith('.docx')) { last = await dmAddDocx(f); n++; }
      else if (nm.endsWith('.tstn') || nm.endsWith('.json')) {
        const r = await openTstnText(await readText(f), f.name); if (!r) continue;
        if (r.data.type === 'backup') { bad.push(f.name + ' (file sao lưu — mở bằng nút Mở)'); continue; }
        const it = await dmAddFromData(r.data, f.name); if (it) { dmPw[it.id] = r.pw; last = it; n++; }
      } else bad.push(f.name + (nm.endsWith('.doc') ? ' (Word 97–2003: đề nghị người nộp lưu lại thành .docx)' : nm.endsWith('.pdf') ? ' (PDF: đề nghị nộp file Word .docx)' : ' (định dạng không hỗ trợ)'));
    } catch (e) { bad.push(f.name + ' (' + e.message + ')'); }
  }
  await persist(); ui.dmView = null; renderDauMoiSide(); renderDauMoi();
  if (bad.length) modal('Một số file chưa tiếp nhận được', `<ul class="small">${bad.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`, [{ label: 'Đóng', cls: 'pri' }], 'sm');
  else if (n) toast(`Đã tiếp nhận ${n} hồ sơ — bấm "Thẩm định" để xem kết quả`);
  return last;
}

async function checkUpdate() {
  if (!navigator.onLine || !K.APP.updateUrl || location.protocol === 'http:' && /localhost|127\./.test(location.host)) return;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(K.APP.updateUrl + '?t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' }); if (!r.ok) return;
    const v = await r.json(); const newer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) > (y[i] || 0)) return true; if ((x[i] || 0) < (y[i] || 0)) return false; } return false; };
    if (v.version && newer(v.version, K.APP.version)) {
      const isPWA = location.protocol.startsWith('http');
      $('#updBanner').innerHTML = `<div class="banner">🔔 Có phiên bản mới <b>${esc(v.version)}</b>${v.notes ? ': ' + esc(v.notes) : ''}. ${isPWA ? '<button class="btn sm pri" onclick="caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))).finally(()=>location.reload())">Tải lại để cập nhật</button>' : `<a class="btn sm pri" href="${esc(v.download || K.APP.homeUrl)}" target="_blank" rel="noopener">Tải bản mới</a> <span class="small mut">Dữ liệu của bạn được giữ nguyên.</span>`}</div>`;
    }
  } catch { /* offline */ }
}

async function installGuide(tab) {
  tab = tab || platform();
  const offline = !location.protocol.startsWith('http');
  const body = () => {
    const g = GUIDE[tab];
    return `${offline ? `<div class="note warn">Bạn đang mở bản file HTML trên máy. File này không cài được như ứng dụng. Để cài đặt, hãy mở trang <a href="${esc(K.APP.homeUrl)}" target="_blank" rel="noopener"><b>${esc(K.APP.homeUrl.replace(/^https:\/\//, '').replace(/\/$/, ''))}</b></a> bằng Chrome hoặc Edge rồi làm theo các bước dưới đây. Dữ liệu trong file HTML mang sang được bằng nút Sao lưu → Mở.</div>` : ''}
    <div class="gtabs">${Object.entries(GUIDE).map(([k, v]) => `<button class="${k === tab ? 'on' : ''}" data-gt="${k}">${ic(v.icon)}${v.name}</button>`).join('')}</div>
    <ol class="gsteps">${g.steps.map(([t, d, f], i) => `<li><div class="gfig">${f}</div><div class="gtx"><span class="gn">Bước ${i + 1}</span><b>${t}</b><p>${d}</p></div></li>`).join('')}</ol>
    <p class="small mut gnote">${ic('info')}<span>${g.note}</span></p>`;
  };
  const btns = [{ label: 'Đóng', value: null }];
  if (instPrompt) btns.push({ label: ic('install') + 'Cài đặt ngay', cls: 'pri', value: 'go' });
  else if (offline) btns.push({ label: 'Mở trang cài đặt', cls: 'pri', value: 'open' });
  const p = modal('Cài đặt ứng dụng vào máy', `<div id="gbody">${body()}</div>`, btns, 'lg guide');
  const m = document.querySelector('.modal.guide:last-of-type');
  if (m) m.addEventListener('click', e => { const b = e.target.closest('[data-gt]'); if (b) { tab = b.dataset.gt; $('#gbody', m).innerHTML = body(); } });
  const r = await p;
  if (r === 'go') installApp();
  if (r === 'open') window.open(K.APP.homeUrl, '_blank', 'noopener');
}

// ------------------------------------------------------------------ CHUYỂN ĐỊA CHỈ
// Trang ở địa chỉ cũ gửi dữ liệu sang địa chỉ mới qua postMessage (kiểm tra nguồn gốc hai chiều).
const ORIGIN_OF = u => { try { return new URL(u).origin; } catch { return ''; } };
function movedBanner() {
  if (!K.APP.movedTo) return;
  const host = K.APP.movedTo.replace(/^https:\/\//, '').replace(/\/$/, '');
  $('#updBanner').innerHTML = `<div class="banner moved">${ic('info')}<span>Ứng dụng đã chuyển sang địa chỉ mới <b>${esc(host)}</b>. ${db.hoso.length || db.dauMoi.items.length ? 'Bấm nút bên cạnh để mang toàn bộ dữ liệu trên máy này sang địa chỉ mới.' : ''}</span>
    ${db.hoso.length || db.dauMoi.items.length ? `<button class="btn sm pri" data-act="moveData">Chuyển dữ liệu sang địa chỉ mới</button>` : `<a class="btn sm pri" href="${esc(K.APP.movedTo)}">Mở địa chỉ mới</a>`}</div>`;
}
function moveDataOut() {
  const target = ORIGIN_OF(K.APP.movedTo);
  const w = window.open(K.APP.movedTo + '#nhan-du-lieu', '_blank');
  if (!w) { toast('Trình duyệt chặn cửa sổ mới — hãy cho phép cửa sổ bật lên rồi bấm lại'); return; }
  const onMsg = e => {
    if (e.origin !== target || e.source !== w || !e.data || e.data.kk !== 'ready') return;
    w.postMessage({ kk: 'db', db: JSON.parse(JSON.stringify(db)) }, target);
  };
  const onDone = e => { if (e.origin === target && e.source === w && e.data && e.data.kk === 'done') { toast('Đã chuyển dữ liệu. Từ nay hãy dùng địa chỉ mới.'); window.removeEventListener('message', onMsg); window.removeEventListener('message', onDone); } };
  window.addEventListener('message', onMsg); window.addEventListener('message', onDone);
}
function receiveDataIn() {
  if (location.hash !== '#nhan-du-lieu' || !window.opener || !K.APP.oldOrigins) return;
  const allowed = K.APP.oldOrigins;
  history.replaceState(null, '', location.pathname);
  window.addEventListener('message', async e => {
    if (!allowed.includes(e.origin) || e.source !== window.opener || !e.data || e.data.kk !== 'db') return;
    const src = e.data.db || {}; const n = (src.hoso || []).length, m = ((src.dauMoi || {}).items || []).length;
    const ok = await confirmBox('Nhận dữ liệu từ địa chỉ cũ', `Nhận <b>${n}</b> hồ sơ kê khai${m ? ` và <b>${m}</b> hồ sơ đầu mối` : ''} từ địa chỉ cũ của ứng dụng? Hồ sơ trùng sẽ được thay bằng bản chuyển sang.`, 'Nhận dữ liệu');
    if (!ok) return;
    await mergeDB(src); toast(`Đã nhận ${n} hồ sơ từ địa chỉ cũ`);
    try { e.source.postMessage({ kk: 'done' }, e.origin); } catch { /* bỏ qua */ }
  });
  allowed.forEach(o => { try { window.opener.postMessage({ kk: 'ready' }, o); } catch { /* bỏ qua */ } });
}

// ------------------------------------------------------------------ BOOT
async function boot() {
  const st = loadDB();
  if (st === 'locked') {
    document.body.innerHTML = `<div class="welcome"><div class="card"><h2>🔒 ${esc(K.APP.name)}</h2><p>Dữ liệu trên máy này đã được mã hoá. Nhập mật khẩu để mở.</p><input type="password" id="unl" placeholder="Mật khẩu"><div class="row" style="margin-top:10px"><button class="btn pri" id="unlBtn">Mở khoá</button></div><p class="small mut" style="margin-top:12px">${esc(K.APP.copyright)}</p></div></div>`;
    const go = async () => { try { db = await K.decryptJSON(localStorage.getItem(DB_ENC_KEY), $('#unl').value); sessionPw = $('#unl').value; fixDB(); start(); } catch { toast('Sai mật khẩu'); } };
    $('#unlBtn').onclick = go; $('#unl').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#unl').focus();
    return;
  }
  start();
}
function start() {
  if (!db.cur.hosoId && db.hoso.length) db.cur = { hosoId: db.hoso[0].id, declId: db.hoso[0].decls.slice(-1)[0]?.id };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (!K.cryptoOK()) setTimeout(() => toast('Trình duyệt không hỗ trợ mã hoá — nên dùng Chrome/Edge bản mới'), 1000);
  renderShell(); setSaved(db.hoso.length ? 'Dữ liệu đã lưu trên máy' : ''); checkBackupReminder();
  refreshInstallUI(); movedBanner(); receiveDataIn();
  if (!K.APP.movedTo) setTimeout(checkUpdate, 2500);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.KKUI = { get db() { return db; }, render, persist };
document.addEventListener('DOMContentLoaded', boot);
})();
