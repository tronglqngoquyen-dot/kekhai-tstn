:root{
  --ink:#16233F; --ink-2:#1F3157; --ink-3:#2A3F6B; --ink-line:#33497A; --ink-mute:#9AA8C4;
  --seal:#A8201A; --seal-2:#8A1A15; --seal-soft:#FBEDEC;
  --brass:#B8923A; --brass-soft:#F6EFDD;
  --desk:#ECEFF3; --paper:#FFFFFF; --line:#D8DEE7; --line-2:#E8ECF1;
  --text:#1E2633; --mute:#5B6576; --faint:#8A93A3;
  --ok:#2C7A55; --ok-soft:#E6F3EC; --warn:#A86A12; --warn-soft:#FBF1DF; --info:#2B5A9B; --info-soft:#E8EFF9;
  --r:8px; --r-sm:6px;
  --f:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14.5px/1.55 var(--f);color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ── Thanh trên ───────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:56px;padding:0 18px 0 16px;background:var(--ink);color:#fff;border-bottom:3px solid var(--seal)}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
.seal{width:34px;height:34px;border-radius:50%;background:var(--seal);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 0 4px var(--seal),inset 0 0 0 5px rgba(255,255,255,.35)}
.seal svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;font-size:11.5px;color:var(--ink-mute);font-weight:400}
.seg{display:flex;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:9px;padding:3px;margin-left:18px}
.seg button{border:0;background:transparent;color:var(--ink-mute);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:500;display:flex;gap:7px;align-items:center}
.seg button.on{background:#fff;color:var(--ink)}
.seg button:not(.on):hover{color:#fff}
.top .sp{flex:1}
.saved{font-size:12.5px;color:var(--ink-mute);white-space:nowrap;display:flex;gap:6px;align-items:center}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:#5DBB8A}
.saved.busy::before{background:var(--brass)}
.saved.bad::before{background:#E5675F}
.tb{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;color:#DCE3F0;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;font-size:13.5px}
.tb:hover{background:var(--ink-2);border-color:var(--ink-line);color:#fff}

/* ── Khung ─────────────────────────────────────────────── */
.wrap{display:grid;grid-template-columns:288px 1fr;min-height:calc(100vh - 56px)}
.side{background:var(--ink-2);color:#DCE3F0;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:16px 14px 24px}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:var(--ink-line);border-radius:4px}
.dossier{background:var(--ink);border:1px solid var(--ink-line);border-radius:10px;padding:12px}
.dossier label{display:block;font-size:12px;color:var(--ink-mute);margin:0 0 4px}
.dossier select{width:100%;background:var(--ink-2);color:#fff;border:1px solid var(--ink-line);border-radius:7px;padding:7px 9px;margin-bottom:9px}
.dossier .acts{display:flex;gap:6px}
.dossier .acts button{flex:1;display:flex;justify-content:center;align-items:center;gap:5px;background:transparent;border:1px solid var(--ink-line);color:#DCE3F0;border-radius:7px;padding:6px 4px;cursor:pointer;font-size:12.5px}
.dossier .acts button:hover{background:var(--ink-3);color:#fff}
.prog{margin-top:12px}
.prog .bar{height:5px;background:var(--ink-3);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .4s}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-mute);margin-top:6px}
.prog .lbl b{color:#fff;font-weight:600}
.side h4{margin:18px 8px 6px;font-size:12px;font-weight:600;color:var(--ink-mute);letter-spacing:.01em}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps a{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;color:#DCE3F0;text-decoration:none;cursor:pointer;font-size:13.6px;position:relative}
.steps a:hover{background:var(--ink-3);color:#fff}
.steps a.on{background:#fff;color:var(--ink);font-weight:600}
.steps .dot{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;border:1.5px solid var(--ink-line);color:var(--ink-mute);background:var(--ink-2)}
.steps a.on .dot{border-color:var(--ink);color:var(--ink);background:#fff}
.steps .dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .dot.err{background:var(--seal);border-color:var(--seal);color:#fff}
.steps .dot.warn{background:var(--brass);border-color:var(--brass);color:#fff}
.steps .t{flex:1;line-height:1.3}
.steps .n{font-size:11.5px;font-weight:700;color:#F2B7B3}
.steps a.on .n{color:var(--seal)}
.side .back{margin-top:14px}

.main{padding:26px 34px 90px;max-width:1100px;width:100%}

/* ── Đầu trang nội dung: "biển mã" mục của mẫu ───────────── */
.phead{display:flex;gap:18px;align-items:flex-start;margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.plate{flex:none;min-width:72px;height:72px;padding:0 10px;border:2px solid var(--seal);border-radius:10px;display:grid;place-items:center;color:var(--seal);font-weight:700;font-size:26px;letter-spacing:-.02em;background:var(--paper);position:relative}
.plate::after{content:"";position:absolute;inset:3px;border:1px solid rgba(168,32,26,.28);border-radius:7px}
.plate svg{width:30px;height:30px;stroke:var(--seal);fill:none;stroke-width:1.8}
.plate.sm{font-size:20px}
.phead h1{margin:2px 0 4px;font-size:25px;line-height:1.2;font-weight:700;letter-spacing:-.015em;color:var(--ink)}
.phead p{margin:0;color:var(--mute);max-width:72ch}
h2{font-size:17px;margin:0;font-weight:600;color:var(--ink)}
h3{font-size:15.5px;margin:0;font-weight:600;color:var(--ink)}

/* ── Tờ (sheet) ───────────────────────────────────────── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 16px}
.card-h{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
.card-h .ttl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--brass);color:#7C5F1C;background:var(--brass-soft);border-radius:5px;font-size:12px;font-weight:700}
.parent{font-size:12.5px;color:var(--faint)}
.desc{color:var(--mute);font-size:13.3px;margin:-4px 0 12px;max-width:80ch}
.sum{font-size:13px;color:var(--mute);white-space:nowrap}.sum b{color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#344054;font-weight:500}
label.f .h{font-weight:400;color:var(--faint);font-size:12px;line-height:1.4}
input[type=text],input[type=date],input[type=password],input[type=number],select,textarea{border:1px solid #C9D1DC;border-radius:var(--r-sm);padding:8px 10px;background:#fff;width:100%;font-weight:400;font-size:14px;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#AEB8C6}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(42,63,107,.14)}
input:disabled{background:#F4F6F9;color:var(--faint)}
.money-read{font-size:12px;color:var(--ok);min-height:16px;font-style:italic}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #C9D1DC;background:#fff;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13.8px;color:var(--text);text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{background:#F5F7FA;border-color:#AEB8C6}
.btn.pri{background:var(--seal);border-color:var(--seal);color:#fff}.btn.pri:hover{background:var(--seal-2);border-color:var(--seal-2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}.btn.ink:hover{background:var(--ink-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:#F0F2F6}
.btn.sm{padding:4px 9px;font-size:12.8px;gap:5px}
.btn.dang{color:var(--seal)}.btn.dang:hover{background:var(--seal-soft);border-color:#EBC2BF}
.btn.icon{padding:5px;width:30px;height:30px;justify-content:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Mục tài sản */
.item{border:1px solid var(--line-2);border-radius:7px;margin:8px 0;background:#FBFCFD;border-left:3px solid var(--line)}
.item.open{border-left-color:var(--brass);background:#fff;border-color:var(--line)}
.item-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;cursor:pointer}
.item-h .car{color:var(--faint);transition:transform .15s;display:inline-flex}
.item.open .item-h .car{transform:rotate(90deg)}
.item-h .t{flex:1;font-weight:600;font-size:14px}
.item-h .v{color:var(--ink);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.item-b{padding:4px 14px 14px;display:none}.item.open .item-b{display:block}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--faint);padding:10px 2px 4px;font-size:13.5px}

/* Ghi chú */
.note{border-radius:7px;padding:11px 14px;margin:0 0 16px;font-size:13.6px;border:1px solid transparent}
.note.row{display:flex}
.note.info{background:var(--info-soft);color:#1E3F6E;border-color:#D3E0F3}
.note.warn{background:var(--warn-soft);color:#6B4207;border-color:#F0DDB6}
.note.ok{background:var(--ok-soft);color:#1B4D35;border-color:#CBE5D6}
.note.err{background:var(--seal-soft);color:#6E1510;border-color:#F0CBC8}
.note .grow{flex:1}

/* Kết quả rà soát */
.find{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;align-items:flex-start}
.find:last-child{border-bottom:0}
.find:hover{background:#FAFBFC}
.find .lv{flex:none;font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 8px;margin-top:1px;min-width:72px;text-align:center}
.lv.loi{background:var(--seal-soft);color:var(--seal)}.lv.canh_bao{background:var(--warn-soft);color:var(--warn)}.lv.goi_y{background:var(--info-soft);color:var(--info)}
.find .s{font-weight:600;font-size:13px;color:var(--ink)}.find .m{font-size:13.6px;color:#2D3646}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:12.5px;color:var(--mute)}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi.err b{color:var(--seal)}.kpi.warn b{color:var(--warn)}.kpi.info b{color:var(--info)}.kpi.okk b{color:var(--ok)}

table.t .badge,.badge{min-width:22px;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;display:inline-grid;place-items:center;font-weight:700}
.b-err{background:var(--seal-soft);color:var(--seal)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-ok{background:var(--ok-soft);color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:13.6px}
table.t th,table.t td{border-bottom:1px solid var(--line-2);padding:8px 9px;text-align:left;vertical-align:top}
table.t th{background:#F6F8FA;font-weight:600;font-size:12.6px;color:#3A4558;border-bottom-color:var(--line)}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.tot td{background:#FAF6EA;font-weight:600}

/* Chọn phương thức */
.pt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pt label{border:1.5px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;font-size:13px;background:#fff;color:var(--mute);line-height:1.45}
.pt label:hover{border-color:#AEB8C6}
.pt label.on{border-color:var(--seal);background:var(--seal-soft);color:#5E1A16}
.pt input{display:none}.pt b{display:block;font-size:14.5px;margin-bottom:3px;color:var(--ink)}
.pt label.on b{color:var(--seal)}
.chk{display:flex;gap:9px;align-items:center;font-size:13.8px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--seal)}

/* Hộp thoại */
.modal{position:fixed;inset:0;background:rgba(14,22,40,.55);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal .box{background:#fff;border-radius:12px;max-width:940px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(10,16,30,.35);animation:rise .18s}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal .mb{padding:18px 20px;overflow:auto}.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#FAFBFC;border-radius:0 0 12px 12px}
.modal.sm .box{max-width:480px}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(8px);opacity:.6}}

/* Bản xem trước */
.doc{font-family:"Times New Roman",Times,serif;color:#000;background:#fff;line-height:1.3}
.doc p{margin:0}.doc table{border-collapse:collapse}.doc table.bd td{border:1px solid #000;padding:3px 5px}.doc table.nb td{vertical-align:top}
.doc .hr{border-top:1px solid #000;margin:2px auto 0}
.paper{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 28px rgba(20,30,50,.12);padding:2cm 2cm 2cm 3cm;max-width:21cm;margin:0 auto}

.foot{color:var(--faint);font-size:12px;text-align:center;padding:28px 0 6px}
.banner{background:var(--brass-soft);border-bottom:1px solid #E6D3A4;padding:9px 18px;font-size:13.6px;display:flex;gap:10px;align-items:center;color:#5C4613}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;z-index:200;box-shadow:0 10px 26px rgba(10,16,30,.3);font-size:14px;animation:rise .2s;max-width:90vw}
.stat-ok{color:var(--ok);font-weight:600}.stat-err{color:var(--seal);font-weight:600}
.mut{color:var(--mute)}.small{font-size:12.6px}
.stepper{display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
details summary{cursor:pointer;color:var(--ink-3);font-weight:500}

/* ── Màn hình chào ───────────────────────────────────── */
.welcome{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;max-width:1060px;margin:28px auto 0}
.welcome h1{font-size:34px;line-height:1.18;letter-spacing:-.025em;margin:0 0 14px;color:var(--ink);font-weight:700;max-width:18ch}
.welcome .lead{font-size:15.5px;color:var(--mute);margin:0 0 24px;max-width:56ch;line-height:1.6}
.starts{display:grid;gap:10px;margin-bottom:18px}
.start{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s}
.start:hover{border-color:var(--ink-3)}
.start .ic{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex:none;background:#EEF2F8;color:var(--ink-3)}
.start .ic svg{width:20px;height:20px}
.start.main{background:var(--ink);border-color:var(--ink);color:#fff}
.start.main .ic{background:var(--seal);color:#fff}
.start.main small{color:var(--ink-mute)}
.start b{display:block;font-size:15px;font-weight:600}
.start small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
.start .go{margin-left:auto;color:var(--faint)}
.minor{display:flex;gap:18px;flex-wrap:wrap;font-size:13.6px}
.minor a{display:flex;gap:6px;align-items:center;color:var(--ink-3);cursor:pointer;text-decoration:none;font-weight:500}
.minor a:hover{color:var(--seal)}
.privacy{margin-top:22px;font-size:13px;color:var(--mute);display:flex;gap:9px;align-items:flex-start;max-width:56ch}
/* Tờ giấy minh hoạ */
.sheet-art{position:relative;background:#fff;border-radius:6px;padding:30px 30px 26px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px rgba(22,35,63,.16);transform:rotate(1.2deg);font-family:"Times New Roman",serif;color:#1d1d1d}
.sheet-art::before{content:"";position:absolute;inset:0;border-radius:6px;background:#fff;box-shadow:0 10px 28px rgba(22,35,63,.10);transform:rotate(-3.2deg) translate(-8px,6px);z-index:-1}
.sheet-art .hd{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;text-align:center;line-height:1.35}
.sheet-art .hd span{display:block}
.sheet-art .u{width:56%;margin:3px auto 0;border-top:1px solid #222}
.sheet-art h5{font-size:13px;text-align:center;margin:18px 0 2px;letter-spacing:.01em}
.sheet-art .s{font-size:10px;text-align:center;font-style:italic;margin-bottom:14px}
.sheet-art .ln{height:6px;background:#E9ECF1;border-radius:3px;margin:8px 0}
.sheet-art .ln.b{background:#C9CFD9;width:44%;height:7px;margin-top:14px}
.stamp{position:absolute;right:22px;bottom:30px;width:104px;height:104px;border:3px solid var(--seal);border-radius:50%;display:grid;place-items:center;color:var(--seal);transform:rotate(-14deg);font-family:var(--f);text-align:center;font-weight:700;font-size:11px;line-height:1.25;opacity:.88;box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 5.5px var(--seal)}
.stamp svg{width:22px;height:22px;stroke:var(--seal);stroke-width:2.4;fill:none;display:block;margin:0 auto 2px}

@media (max-width:980px){.welcome{grid-template-columns:1fr}.sheet-art{display:none}}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto}.grid,.grid.g3,.pt,.kpis{grid-template-columns:1fr}.seg{display:none}.main{padding:18px 16px 70px}.tb span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .paper{box-shadow:none;padding:0;max-width:none}
  @page{size:A4;margin:2cm 2cm 2cm 3cm}
}
#printArea{display:none}
/* ---- cài đặt ứng dụng */
.tb.inst{background:var(--brass);color:#1B1406;font-weight:600;border-color:#D4AF5A;margin-right:6px}
.tb.inst:hover{background:#C9A24A;color:#1B1406;border-color:#E2C27A}
.instcard{margin-top:22px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--paper);border:1px solid #E2CF9F;border-left:5px solid var(--brass);border-radius:var(--r);padding:16px 18px;box-shadow:0 6px 18px rgba(22,35,63,.07);max-width:760px}
.instcard .ii{width:48px;height:48px;border-radius:12px;background:var(--brass-soft);display:grid;place-items:center;color:#7A5A12}
.instcard .ii svg.i{width:26px;height:26px}
.instcard .it b{display:block;font-size:16px;color:var(--ink)}
.instcard .it span{display:block;font-size:13.2px;color:var(--mute);margin-top:2px}
.instcard .ib{display:flex;flex-direction:column;align-items:center;gap:6px}
.instcard .ib a{font-size:12.8px;cursor:pointer}
.btn.big{padding:11px 18px;font-size:15px}
@media (max-width:720px){.instcard{grid-template-columns:auto 1fr}.instcard .ib{grid-column:1/-1;flex-direction:row;justify-content:space-between}.tb.inst span{display:none}}
.modal.lg .box{max-width:1000px}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.gtabs button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13.5px}
.gtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gsteps li{border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:#fff;display:flex;flex-direction:column}
.gfig{background:#F4F6F9;border-bottom:1px solid var(--line-2);padding:10px}
.gfig svg{display:block;width:100%;height:auto;font-family:var(--f)}
.gtx{padding:12px 14px 14px}
.gtx .gn{display:inline-block;font-size:11.5px;font-weight:600;color:var(--seal);background:var(--seal-soft);border-radius:4px;padding:1px 7px;margin-bottom:6px}
.gtx b{display:block;color:var(--ink);font-size:14.2px;line-height:1.4}
.gtx p{margin:5px 0 0;font-size:13px;color:var(--mute)}
.gnote{display:flex;gap:8px;align-items:flex-start;margin-top:14px}
@media (max-width:820px){.gsteps{grid-template-columns:1fr}.gfig svg{max-width:340px;margin:0 auto}}
.banner.moved{background:var(--info-soft);border-color:#C7D8F0;color:#173A6B}
.banner.moved span{flex:1}
@media print{.instcard,.tb.inst{display:none!important}}
.gfig svg.ph{max-height:200px;width:auto;margin:0 auto}
.gfig{display:flex;align-items:center;justify-content:center;min-height:190px}

</style>

const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toUpperCase();
// Đọc số kiểu Việt Nam: "1.234.567" (dấu chấm phân nghìn), "4,98" hoặc "4.98" (thập phân)
const num = v => {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/\s/g, '').replace(/[^\d\-.,]/g, '');
  if (!s) return 0;
  const hasDot = s.includes('.'), hasCom = s.includes(',');
  if (hasDot && hasCom) { s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (hasCom) { s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.'); }
  else if (hasDot) { if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); }
  const n = Number(s); return isFinite(n) ? n : 0;
};
const fmtMoney = n => { n = Math.round(Number(n) || 0); return n.toLocaleString('vi-VN').replace(/,/g, '.') ; };
const fmtVND = n => fmtMoney(n) + ' đồng';
const pad = n => String(n).padStart(2, '0');
const fmtDate = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); if (isNaN(d)) return s; return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const clone = o => JSON.parse(JSON.stringify(o));
const blank = v => v === undefined || v === null || String(v).trim() === '';

// Đọc số thành chữ (tiếng Việt) — hỗ trợ người dùng kiểm tra số tiền
function docSo(n) {
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return 'không đồng';
  const cs = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const doc3 = (x, full) => {
    const tr = Math.floor(x / 100), ch = Math.floor((x % 100) / 10), dv = x % 10; let s = [];
    if (full || tr) s.push(cs[tr] + ' trăm');
    if (ch === 0 && dv) { if (full || tr) s.push('lẻ'); }
    else if (ch === 1) s.push('mười');
    else if (ch > 1) s.push(cs[ch] + ' mươi');
    if (dv) { if (dv === 1 && ch > 1) s.push('mốt'); else if (dv === 5 && ch > 0) s.push('lăm'); else if (dv === 4 && ch > 1) s.push('tư'); else s.push(cs[dv]); }
    return s.join(' ');
  };
  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const parts = []; let i = 0;
  while (n > 0) { parts.push(n % 1000); n = Math.floor(n / 1000); i++; }
  let out = [];
  for (let j = parts.length - 1; j >= 0; j--) {
    if (parts[j] === 0) continue;
    out.push(doc3(parts[j], j < parts.length - 1) + units[j]);
  }
  let s = out.join(' ').replace(/\s+/g, ' ').trim();
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

  g.fields.forEach(f => { it[f.k] = f.t === 'select' ? (f.k === 'dungTen' ? 'Người kê khai' : f.opts[0]) : ''; if (f.t === 'fx') { it[f.k + '_cur'] = 'VND'; it[f.k + '_fx'] = ''; it[f.k + '_rate'] = ''; } if (f.unknown) { it[f.k + '_unk'] = false; it[f.k + '_unkReason'] = ''; } });
  return it;
}

// Giá trị VND của trường tiền trong một mục
function itemValue(g, it) {
  if (g.novalue) return 0;
  const f = g.fields.find(x => x.k === 'giaTri');
  if (!f) return 0;
  if (f.t === 'fx' && it.giaTri_cur && it.giaTri_cur !== 'VND') {
    const v = num(it.giaTri_fx) * num(it.giaTri_rate);
    return v || num(it.giaTri);
  }
  if (it.giaTri_unk) return 0;
  return num(it.giaTri);
}

function groupTotal(decl, keys) { return keys.reduce((s, k) => s + (decl.ts[k] || []).reduce((a, it) => a + itemValue(GROUP[k], it), 0), 0); }
const MONEY_KEYS = ['tienMat', 'tienChoVay', 'tienTraTruoc', 'taiKhoan', 'soTietKiem', 'tienGuiKhac'];
const SEC_KEYS = ['coPhieu', 'traiPhieu', 'vonGop', 'giayToCoGia'];

function incomeTotals(decl) {
  const t = decl.thuNhap;
  const ban = num(t.ban.luong) + num(t.ban.khac);
  const vc = decl.coVoChong ? num(t.voChong.luong) + num(t.voChong.khac) : 0;
  const con = num(t.con), chung = num(t.chung);
  return { ban, vc, con, chung, tong: ban + vc + con + chung };
}

function netWorth(decl) {
  let assets = 0, liab = 0;
  GROUPS.forEach(g => (decl.ts[g.key] || []).forEach(it => { const v = itemValue(g, it); if (g.liability) liab += v; else assets += v; }));
  return { assets, liab, net: assets - liab };
}

// Trợ lý tính thu nhập từ lương theo giai đoạn lương cơ sở
// ---------------------------------------------------------------------
function monthsBetween(tu, den) {
  // số tháng (có lẻ theo ngày) giữa 2 ngày, tính cả ngày đầu và ngày cuối
  const a = new Date(tu + 'T00:00:00'), b = new Date(den + 'T00:00:00');
  if (isNaN(a) || isNaN(b) || b < a) return 0;
  let m = 0, cur = new Date(a);
  while (cur <= b) {
    const y = cur.getFullYear(), mo = cur.getMonth();
    const dim = new Date(y, mo + 1, 0).getDate();
    const endOfMonth = new Date(y, mo, dim);
    const last = endOfMonth < b ? endOfMonth : b;
    const days = Math.round((last - cur) / 86400000) + 1;
    m += days / dim;
    cur = new Date(y, mo + 1, 1);
  }
  return m;
}
function calcSalary(c, tu, den, lcsTable) {
  lcsTable = lcsTable || LUONG_CO_SO_MAC_DINH;
  const base = num(c.heSoLuong) + num(c.heSoPCCV) + num(c.heSoTNVK);
  const pct = (num(c.pctUuDai) + num(c.pctThamNien)) / 100;
  const hs = base * (1 + pct) + num(c.heSoKhuVuc) + num(c.heSoKhac);
  const rows = []; let total = 0;
  if (!tu || !den || hs <= 0) return { rows, total: num(c.thuong), hs };
  lcsTable.forEach(p => {
    const s = tu > p.tu ? tu : p.tu, e = den < p.den ? den : p.den;
    if (s > e) return;
    const m = monthsBetween(s, e);
    const monthly = hs * p.muc + num(c.khoanThangKhac);
    const amount = Math.round(monthly * m);
    rows.push({ tu: s, den: e, muc: p.muc, cancu: p.cancu, thang: m, monthly: Math.round(monthly), amount });
    total += amount;
  });
  total += num(c.thuong);
  return { rows, total, hs };
}

function incomePeriod(decl, prevDecl) {
  if (decl.phuongThuc === 'lan_dau') return null;
  const prev = prevDecl ? (prevDecl.ngayKeKhai || prevDecl.ngayChot) : decl.ngayKeKhaiTruoc;
  const tu = prev ? addDays(prev, 1) : '';
  const den = decl.ngayKeKhai || decl.ngayChot || '';
  return { tu, den, prev };
}

// So sánh với kỳ liền trước → gợi ý Mục III (biến động)

function describeItem(g, it) {
  const main = it.diaChi || it.ten || it.tenGoi || it.loai || it.loaiCay || it.loaiRung || it.loaiDat || it.soTK || it.hinhThuc || it.moTa || it.chuNo || it.benVay || it.noiDung || '';
  return `${g.title}${main ? ': ' + main : ''}`;
}
function compareDecls(cur, prev) {
  const tang = [], giam = [];
  if (!prev) return { tang, giam };
  const push = (arr, key, moTa, giaTri) => arr.push({ key, moTa, giaTri: Math.abs(Math.round(giaTri)) });
  // Nhóm tính theo từng mục (BĐS, kim loại quý, tài sản khác, nợ, nước ngoài)
  GROUPS.forEach(g => {
    if (MONEY_KEYS.includes(g.key) || SEC_KEYS.includes(g.key)) return;
    const pm = Object.fromEntries((prev.ts[g.key] || []).map(it => [it.id, it]));
    const cm = Object.fromEntries((cur.ts[g.key] || []).map(it => [it.id, it]));
    Object.values(cm).forEach(it => {
      const v = itemValue(g, it), p = pm[it.id];
      if (!p) push(g.liability ? giam : tang, g.key + ':' + it.id, (g.liability ? 'Phát sinh khoản nợ mới — ' : 'Tài sản mới — ') + describeItem(g, it), v);
      else {
        const pv = itemValue(g, p);
        if (v !== pv) push((v > pv) !== !!g.liability ? tang : giam, g.key + ':' + it.id, (g.liability ? 'Thay đổi khoản nợ — ' : 'Thay đổi giá trị — ') + describeItem(g, it) + ` (từ ${fmtMoney(pv)} thành ${fmtMoney(v)})`, v - pv);
      }
    });
    Object.values(pm).forEach(p => {
      if (!cm[p.id]) push(g.liability ? tang : giam, g.key + ':' + p.id, (g.liability ? 'Đã trả hết khoản nợ — ' : 'Không còn tài sản — ') + describeItem(g, p), itemValue(g, p));
    });
  });
  // Tiền và giấy tờ có giá: so tổng nhóm
  [[MONEY_KEYS, 'Tiền (tiền mặt, cho vay, trả trước, tiền gửi)', 'tien'], [SEC_KEYS, 'Cổ phiếu, trái phiếu, vốn góp, giấy tờ có giá', 'ck']].forEach(([keys, name, key]) => {
    const a = groupTotal(cur, keys), b = groupTotal(prev, keys);
    if (a !== b) push(a > b ? tang : giam, key, `${name}: từ ${fmtMoney(b)} thành ${fmtMoney(a)} đồng`, a - b);
  });
  return { tang, giam };
}

function applyBienDongSuggest(decl, prev) {
  const { tang, giam } = compareDecls(decl, prev);
  const merge = (oldArr, sug) => {
    const keep = oldArr.filter(x => !x.auto);
    const byKey = Object.fromEntries(oldArr.filter(x => x.auto).map(x => [x.key, x]));
    return [...sug.map(s => ({ id: (byKey[s.key] || {}).id || uid(), auto: true, key: s.key, moTa: s.moTa, giaTri: s.giaTri, giaiTrinh: (byKey[s.key] || {}).giaiTrinh || '', minhChung: (byKey[s.key] || {}).minhChung || '' })), ...keep];
  };
  decl.bienDong.tang = merge(decl.bienDong.tang, tang);
  decl.bienDong.giam = merge(decl.bienDong.giam, giam);
  return decl;
}

// Tạo kỳ mới từ kỳ trước — giữ nguyên id tài sản để so sánh biến động
function rollForward(prev, opts = {}) {
  const d = clone(prev);
  d.id = uid(); d.createdAt = d.updatedAt = new Date().toISOString();
  d.phuongThuc = opts.phuongThuc || 'hang_nam';
  d.nam = opts.nam || (Number(prev.nam) + 1);
  d.ngayChot = opts.ngayChot || ''; d.ngayKeKhai = '';
  d.ngayKeKhaiTruoc = prev.ngayKeKhai || prev.ngayChot || '';
  d.prevId = prev.id; delete d.imported; d.visited = {};
  d.thuNhap.ban.luong = d.thuNhap.ban.khac = d.thuNhap.voChong.luong = d.thuNhap.voChong.khac = d.thuNhap.con = d.thuNhap.chung = '';
  d.thuNhap.ban.khacGhiChu = d.thuNhap.voChong.khacGhiChu = d.thuNhap.conGhiChu = d.thuNhap.chungGhiChu = '';
  d.thuNhap.calc.thuong = ''; if (d.thuNhap.calcVoChong) d.thuNhap.calcVoChong.thuong = '';
  d.bienDong = { tang: [], giam: [] };
  d.thayDoi = { thongTinChung: '', taiSan: '' };
  d.review = { status: 'nhap', comments: [] };
  d.chiTieuUocTinh = '';
  return d;
}

// Đảm bảo dữ liệu cũ/nhập từ file có đủ trường
function normalizeDecl(d) {
  const base = newDecl();
  const out = Object.assign(base, d);
  out.nguoi = Object.assign(emptyPerson(), d.nguoi || {});
  out.voChong = Object.assign(emptySpouse(), d.voChong || {});
  out.con = (d.con || []).map(c => Object.assign(emptyChild(), c));
  out.ts = out.ts || {}; GROUPS.forEach(g => { out.ts[g.key] = (out.ts[g.key] || []).map(it => Object.assign(newItem(g.key), it)); });
  out.thuNhap = Object.assign(newDecl().thuNhap, d.thuNhap || {});
  out.thuNhap.calc = Object.assign(emptyIncomeCalc(), out.thuNhap.calc || {});
  out.thuNhap.calcVoChong = Object.assign(emptyIncomeCalc(), out.thuNhap.calcVoChong || {});
  out.bienDong = Object.assign({ tang: [], giam: [] }, d.bienDong || {});
  out.thayDoi = Object.assign({ thongTinChung: '', taiSan: '' }, d.thayDoi || {});
  out.review = Object.assign({ status: 'nhap', comments: [] }, d.review || {});
  return out;
}

const OLD_ADMIN = /\b(huyện|quận|thị xã)\b/i;
function ageAt(birthISO, atISO) {
  if (!birthISO || !atISO) return null;
  const b = new Date(birthISO + 'T00:00:00'), a = new Date(atISO + 'T00:00:00');
  let age = a.getFullYear() - b.getFullYear();
  if (a.getMonth() < b.getMonth() || (a.getMonth() === b.getMonth() && a.getDate() < b.getDate())) age--;
  return age;
}

function suggestFix(f) {
  if (f.fix) return f.fix;
  for (const [re, v] of FIXES) { const m = f.msg.match(re); if (m) return typeof v === 'function' ? v(m) : v; }
  return 'Rà soát, chỉnh sửa theo hướng dẫn tại chú thích tương ứng của mẫu bản kê khai.';
}

function review(decl, prev, opts = {}) {
  const R = []; const add = (level, sec, msg, nav) => R.push({ level, sec, msg, nav: nav || sec });
  const lanDau = decl.phuongThuc === 'lan_dau';
  const at = decl.ngayChot || decl.ngayKeKhai || todayISO();

  // --- Thông tin kỳ kê khai
  if (blank(decl.ngayChot)) add('loi', 'Kỳ kê khai', 'Chưa ghi ngày chốt thông tin, dữ liệu về tài sản, thu nhập (chú thích 2 của mẫu).', 'ky');
  if (decl.ngayKeKhai && decl.ngayChot && decl.ngayKeKhai < decl.ngayChot) add('loi', 'Kỳ kê khai', 'Ngày hoàn thành kê khai đang sớm hơn ngày chốt thông tin.', 'ky');
  if (blank(decl.tenCoQuanDauTrang)) add('canh_bao', 'Kỳ kê khai', 'Chưa ghi tên cơ quan, đơn vị ở góc trên bên trái bản kê khai.', 'ky');
  if (decl.phuongThuc === 'hang_nam' && decl.ngayKeKhai) {
    const y = Number(decl.ngayKeKhai.slice(0, 4)), md = decl.ngayKeKhai.slice(5);
    if (md > '12-31' || y !== Number(decl.nam)) add('canh_bao', 'Kỳ kê khai', `Kê khai hằng năm phải hoàn thành trước ngày 31/12 của năm ${decl.nam}; kiểm tra lại năm kê khai/ngày hoàn thành.`, 'ky');
  }
  if (opts.hanNop && decl.ngayKeKhai && decl.ngayKeKhai > opts.hanNop) add('canh_bao', 'Kỳ kê khai', `Ngày hoàn thành (${fmtDate(decl.ngayKeKhai)}) muộn hơn hạn nộp đã cài đặt (${fmtDate(opts.hanNop)}).`, 'ky');

  // --- I.1 Người kê khai
  const p = decl.nguoi;
  [['hoTen', 'Họ và tên'], ['ngaySinh', 'Ngày, tháng, năm sinh'], ['chucVu', 'Chức vụ/chức danh'], ['coQuan', 'Cơ quan, đơn vị công tác'], ['soDinhDanh', 'Số thẻ căn cước/CCCD/Số định danh cá nhân'], ['noiThuongTru', 'Nơi thường trú'], ['noiOHienNay', 'Nơi ở hiện nay'], ['queQuan', 'Quê quán']].forEach(([k, l]) => {
    if (blank(p[k])) add('loi', 'I.1 Người kê khai', `Chưa ghi "${l}".`, 'nguoi');
  });
  const checkId = (v, who, nav) => {
    if (blank(v)) return;
    const s = String(v).replace(/\s/g, '');
    if (!/^\d{12}$/.test(s)) add('canh_bao', who, `Số định danh/căn cước "${v}" không phải 12 chữ số — kiểm tra lại (CMND 9 số cũ không còn dùng).`, nav);
  };
  checkId(p.soDinhDanh, 'I.1 Người kê khai', 'nguoi');
  if (!blank(p.soDinhDanh) && (blank(p.ngayCap) || blank(p.noiCap))) add('loi', 'I.1 Người kê khai', 'Thiếu ngày cấp hoặc nơi cấp thẻ căn cước/CCCD (chú thích 3).', 'nguoi');
  if (p.heSoPhuCap === '' && /trưởng|phó|giám đốc|hiệu trưởng|chủ tịch|bí thư/i.test(p.chucVu || '')) add('canh_bao', 'I.1 Người kê khai', 'Có chức vụ lãnh đạo nhưng chưa ghi hệ số phụ cấp chức vụ.', 'nguoi');
  [['noiThuongTru', 'Nơi thường trú'], ['noiOHienNay', 'Nơi ở hiện nay']].forEach(([k, l]) => { if (OLD_ADMIN.test(p[k] || '')) add('canh_bao', 'I.1 Người kê khai', `${l} còn ghi cấp huyện/quận/thị xã — từ 01/7/2025 đã bỏ cấp huyện, nên ghi theo đơn vị hành chính mới (xã/phường/đặc khu, tỉnh/thành phố).`, 'nguoi'); });

  // --- I.2 Vợ/chồng
  if (decl.coVoChong) {
    const v = decl.voChong;
    [['hoTen', 'Họ và tên'], ['ngaySinh', 'Ngày sinh'], ['ngheNghiep', 'Chức vụ/nghề nghiệp, công việc đang làm'], ['noiLamViec', 'Cơ quan, đơn vị công tác, nơi làm việc'], ['soDinhDanh', 'Số định danh/căn cước'], ['noiThuongTru', 'Nơi thường trú']].forEach(([k, l]) => { if (blank(v[k])) add('loi', 'I.2 Vợ/chồng', `Chưa ghi "${l}" của vợ/chồng.`, 'vochong'); });
    checkId(v.soDinhDanh, 'I.2 Vợ/chồng', 'vochong');
    if (!blank(v.soDinhDanh) && (blank(v.ngayCap) || blank(v.noiCap))) add('loi', 'I.2 Vợ/chồng', 'Thiếu ngày cấp hoặc nơi cấp căn cước của vợ/chồng.', 'vochong');
  }
  // --- I.3 Con chưa thành niên
  decl.con.forEach((c, i) => {
    const who = `I.3 Con thứ ${ordName(i)}`;
    if (blank(c.hoTen)) add('loi', who, 'Chưa ghi họ tên con.', 'con');
    if (blank(c.soDinhDanh)) add('loi', who, 'Chưa ghi số định danh cá nhân của con (trẻ em đã được cấp số định danh từ khi đăng ký khai sinh).', 'con');
    const age = ageAt(c.ngaySinh, at);
    if (age !== null && age >= 18) add('canh_bao', who, `${c.hoTen || 'Người con'} đã đủ ${age} tuổi tại ngày chốt — không còn là con chưa thành niên, không kê khai tại mục này (ghi vào Mục IV nếu có thay đổi so với kỳ trước).`, 'con');
    if (blank(c.ngaySinh)) add('goi_y', who, 'Nên ghi ngày sinh để ứng dụng kiểm tra tuổi chưa thành niên.', 'con');
  });

  // --- II. Tài sản
  GROUPS.forEach(g => {
    const items = decl.ts[g.key] || [];
    const secName = `II.${g.sec} ${g.title}`;
    items.forEach((it, i) => {
      const who = `${secName} — ${g.item} thứ ${ordName(i)}`;
      const v = itemValue(g, it);
      const gf = g.fields.find(f => f.k === 'giaTri');
      if (gf && !g.novalue) {
        if (it.giaTri_unk) { if (blank(it.giaTri_unkReason)) add('loi', who, 'Đã chọn "không xác định được giá trị" nhưng chưa ghi rõ lý do (chú thích 10).', g.key); }
        else if (v <= 0) add('loi', who, 'Chưa ghi giá trị. Nếu không xác định được, đánh dấu "Không xác định được giá trị" và ghi lý do.', g.key);
        if (gf.t === 'fx' && it.giaTri_cur && it.giaTri_cur !== 'VND' && (num(it.giaTri_fx) <= 0 || num(it.giaTri_rate) <= 0)) add('loi', who, `Tài sản bằng ${it.giaTri_cur}: phải ghi số lượng ngoại tệ và tỷ giá liên ngân hàng tại thời điểm sở hữu để quy đổi ra đồng.`, g.key);
      }
      if (g.fields.some(f => f.k === 'diaChi')) {
        if (blank(it.diaChi)) add('loi', who, 'Chưa ghi địa chỉ.', g.key);
        else if (OLD_ADMIN.test(it.diaChi)) add('canh_bao', who, 'Địa chỉ còn cấp huyện/quận/thị xã — ghi theo đơn vị hành chính sau sáp nhập; địa chỉ cũ trên Giấy chứng nhận ghi ở ô "Địa chỉ cũ".', g.key);
      }
      if (g.fields.some(f => f.k === 'dienTich') && num(it.dienTich) <= 0) add('loi', who, 'Chưa ghi diện tích (m²).', g.key);
      if (g.fields.some(f => f.k === 'gcn') && blank(it.gcn)) add('loi', who, 'Chưa ghi Giấy chứng nhận. Nếu chưa có thì ghi "chưa được cấp Giấy chứng nhận".', g.key);
      if (g.fields.some(f => f.k === 'nguon') && blank(it.nguon)) add('loi', who, 'Chưa ghi nguồn hình thành tài sản (chú thích 12).', g.key);
      if (g.fields.some(f => f.k === 'tinhTrang') && blank(it.tinhTrang) && g.fields.some(f => f.k === 'nguon')) add('canh_bao', who, 'Chưa ghi tình trạng quản lý, sử dụng, sở hữu.', g.key);
      if (/Đứng tên hộ|Người khác đứng tên hộ/.test(it.dungTen || '') && !/\d{9,12}/.test((it.tinhTrang || '') + (it.ghiChu || ''))) add('loi', who, 'Tài sản nhờ người khác đứng tên/đứng tên hộ: phải ghi rõ họ tên và số định danh/căn cước của người đó trong "Tình trạng".', g.key);
      if (g.threshold === 'perType' && !it.giaTri_unk && v > 0 && v < NGUONG) add('goi_y', who, `Giá trị ${fmtMoney(v)} đồng dưới ngưỡng 150 triệu — không bắt buộc kê khai (trừ khi gộp cùng loại/cùng bộ vượt ngưỡng).`, g.key);
      if (g.threshold === 'perItem' && v > 0 && v < NGUONG) add('goi_y', who, `Khoản nợ ${fmtMoney(v)} đồng dưới 150 triệu — không bắt buộc kê khai.`, g.key);
      if (g.key === 'tkNuocNgoai' && (blank(it.soTK) || blank(it.nganHang))) add('loi', who, 'Thiếu số tài khoản hoặc tên ngân hàng/tổ chức nơi mở tài khoản.', g.key);
      if (g.key === 'tsNuocNgoai' && blank(it.quocGia)) add('loi', who, 'Phải nêu rõ tài sản đang ở nước nào (chú thích 31).', g.key);
      if (['taiKhoan', 'soTietKiem'].includes(g.key) && (blank(it.soTK) || blank(it.toChuc))) add('loi', who, 'Thiếu số tài khoản/số sổ hoặc tên tổ chức nhận tiền gửi.', g.key);
    });
  });
  // Ngưỡng theo nhóm
  const tien = groupTotal(decl, MONEY_KEYS);
  if (tien > 0 && tien < NGUONG) add('goi_y', 'II.5 Tiền', `Tổng tiền ${fmtMoney(tien)} đồng dưới ngưỡng 150 triệu — không bắt buộc kê khai; khi xuất, mục 5 sẽ ghi "Không có" trừ khi bật "Vẫn kê khai dù dưới ngưỡng".`, 'tienMat');
  const ck = groupTotal(decl, SEC_KEYS);
  if (ck > 0 && ck < NGUONG) add('goi_y', 'II.6 Cổ phiếu, trái phiếu...', `Tổng giá trị ${fmtMoney(ck)} đồng dưới ngưỡng 150 triệu — không bắt buộc kê khai.`, 'coPhieu');
  // Kim loại quý: gộp theo loại (tên) vượt ngưỡng
  const klq = {}; (decl.ts.kimLoaiQuy || []).forEach(it => { const k = (it.ten || '').trim().toLowerCase().split(/\s+/)[0] || '?'; klq[k] = (klq[k] || 0) + itemValue(GROUP.kimLoaiQuy, it); });
  Object.entries(klq).forEach(([k, v]) => { if (v >= NGUONG && (decl.ts.kimLoaiQuy.filter(it => ((it.ten || '').trim().toLowerCase().split(/\s+/)[0] || '?') === k).length > 1)) add('goi_y', 'II.4 Kim loại quý, đá quý', `Các tài sản loại "${k}" cộng lại ${fmtMoney(v)} đồng (≥150 triệu) — phải kê khai đầy đủ tất cả.`, 'kimLoaiQuy'); });
  // Tiền: phân biệt tiền sở hữu thực tế
  (decl.ts.tienMat || []).forEach((it, i) => { if (itemValue(GROUP.tienMat, it) >= NGUONG && blank(it.tinhTrang)) add('canh_bao', 'II.5.1 Tiền mặt', 'Nên ghi rõ số tiền thuộc sở hữu thực tế và các khoản giữ hộ, vay mượn (chú thích 21).', 'tienMat'); });
  if (!decl.coVoChong && GROUPS.some(g => (decl.ts[g.key] || []).some(it => /Vợ\/chồng|Chung vợ chồng/.test(it.dungTen || '')))) add('loi', 'I.2 Vợ/chồng', 'Có tài sản ghi thuộc vợ/chồng nhưng chưa khai thông tin vợ/chồng.', 'vochong');
  if (!decl.con.length && GROUPS.some(g => (decl.ts[g.key] || []).some(it => /Con chưa thành niên/.test(it.dungTen || '')))) add('loi', 'I.3 Con chưa thành niên', 'Có tài sản ghi thuộc con chưa thành niên nhưng chưa khai thông tin con.', 'con');

  // --- 10. Thu nhập
  const inc = incomeTotals(decl);
  if (!lanDau) {
    const per = incomePeriod(decl, prev);
    if ((!per || !per.tu) && decl.imported) add('canh_bao', 'II.10 Tổng thu nhập', 'Chưa đối chiếu được kỳ tính thu nhập vì chưa có bản kê khai năm trước (thu nhập tính từ ngày kế tiếp sau ngày kê khai lần trước — chú thích 33).', 'thunhap');
    else if (!per || !per.tu) add('loi', 'II.10 Tổng thu nhập', 'Chưa xác định được kỳ tính thu nhập: cần ngày kê khai của lần liền trước (thu nhập tính từ ngày kế tiếp sau ngày kê khai lần trước đến ngày kê khai lần này — chú thích 33).', 'thunhap');
    if (inc.ban <= 0) add('loi', 'II.10 Tổng thu nhập', 'Chưa kê khai thu nhập của người kê khai giữa hai lần kê khai.', 'thunhap');
    if (decl.coVoChong && inc.vc <= 0) add('canh_bao', 'II.10 Tổng thu nhập', 'Chưa kê khai thu nhập của vợ/chồng (nếu không có thu nhập, ghi 0 và ghi chú "Không có thu nhập" ở mục nguồn khác).', 'thunhap');
    if (per && per.tu && per.den) {
      const est = calcSalary(decl.thuNhap.calc, per.tu, per.den, opts.lcs);
      if (est.total > 0 && num(decl.thuNhap.ban.luong) > 0) {
        const r = num(decl.thuNhap.ban.luong) / est.total;
        if (r < 0.8 || r > 1.3) add('canh_bao', 'II.10 Tổng thu nhập', `Thu nhập từ lương, phụ cấp đã ghi (${fmtMoney(decl.thuNhap.ban.luong)}) chênh nhiều so với ước tính theo hệ số (${fmtMoney(est.total)}). Kiểm tra lại các khoản phụ cấp, thưởng hoặc khấu trừ.`, 'thunhap');
      }
    }
  }
  // --- III. Biến động
  if (!lanDau) {
    if (!prev && !decl.ngayKeKhaiTruoc) add('canh_bao', 'III. Biến động', 'Không có dữ liệu kỳ trước trong ứng dụng: phải tự đối chiếu với bản kê khai liền trước để kê khai đầy đủ tài sản tăng/giảm.', 'biendong');
    if (prev) {
      const sug = compareDecls(decl, prev);
      const has = new Set([...decl.bienDong.tang, ...decl.bienDong.giam].map(x => x.key));
      const miss = [...sug.tang, ...sug.giam].filter(s => !has.has(s.key));
      const manualN = [...decl.bienDong.tang, ...decl.bienDong.giam].filter(x => !x.key).length;
      if (miss.length && manualN === 0) add('loi', 'III. Biến động', `Có ${miss.length} biến động so với kỳ trước chưa đưa vào Mục III: ${miss.slice(0, 4).map(x => x.moTa).join('; ')}${miss.length > 4 ? '…' : ''}.`, 'biendong');
      else if (miss.length > manualN) add('canh_bao', 'III. Biến động', `So với kỳ trước có ${miss.length} biến động, Mục III mới kê khai ${manualN} nội dung — có thể còn thiếu: ${miss.slice(0, 4).map(x => x.moTa).join('; ')}${miss.length > 4 ? '…' : ''}.`, 'biendong');
    }
    decl.bienDong.tang.forEach((x, i) => { if (blank(x.giaiTrinh)) add('loi', 'III.1 Tài sản, thu nhập tăng', `Mục tăng thứ ${ordName(i)} (${x.moTa}) chưa giải trình nguồn gốc tài sản tăng thêm.`, 'biendong'); });
    decl.bienDong.giam.forEach((x, i) => { if (blank(x.giaiTrinh)) add('loi', 'III.2 Tài sản, thu nhập giảm', `Mục giảm thứ ${ordName(i)} (${x.moTa}) chưa ghi nguyên nhân giảm.`, 'biendong'); });
    // Đối soát dòng tiền
    if (prev) {
      const a = netWorth(decl).net, b = netWorth(prev).net, delta = a - b;
      const chi = num(decl.chiTieuUocTinh);
      const gap = delta - (inc.tong - chi);
      if (delta > 0 && gap > 0) add('canh_bao', 'Đối soát dòng tiền', `Tài sản ròng tăng ${fmtMoney(delta)} đồng, trong khi tổng thu nhập trong kỳ ${fmtMoney(inc.tong)}${chi ? ' trừ chi tiêu ước tính ' + fmtMoney(chi) : ''} — còn chênh ${fmtMoney(gap)} đồng chưa được bù bởi thu nhập. Giải trình rõ nguồn (vay, bán tài sản, được cho/tặng/thừa kế...) để tránh bị đánh giá giải trình không trung thực.`, 'biendong');
      const totalMove = [...decl.bienDong.tang, ...decl.bienDong.giam].reduce((s, x) => s + num(x.giaTri), 0);
      if (Math.abs(delta) >= NGUONG_BO_SUNG || inc.tong >= NGUONG_BO_SUNG) add('goi_y', 'Nghĩa vụ kê khai bổ sung', `Biến động tài sản/thu nhập trong năm từ 1 tỷ đồng trở lên — nếu người kê khai không thuộc diện kê khai hằng năm thì phải kê khai bổ sung (khoản 2 Điều 36 Luật PCTN sửa đổi 2025).`, 'biendong');
      void totalMove;
    }
  }
  // Mục IV
  if (prev && !lanDau) {
    const changedPerson = ['chucVu', 'coQuan', 'noiThuongTru', 'noiOHienNay', 'heSoPhuCap'].filter(k => (decl.nguoi[k] || '') !== (prev.nguoi[k] || ''));
    if ((changedPerson.length || decl.coVoChong !== prev.coVoChong || decl.con.length !== prev.con.length) && blank(decl.thayDoi.thongTinChung)) add('canh_bao', 'IV. Thay đổi thông tin chung', 'Thông tin chung (chức vụ, nơi ở, hôn nhân, con...) có thay đổi so với kỳ trước — nên ghi nội dung thay đổi và lý do vào Mục IV.1.', 'thaydoi');
  }
  R.forEach(f => { f.fix = suggestFix(f); });
  return R;
}

// =====================================================================
// MÔ HÌNH VĂN BẢN (dùng chung cho xem trước HTML và xuất DOCX)
// block: {t:'p', runs:[{x, b, i, u}], align, indent, before, after, keep}
//        {t:'table', rows:[[cell...]], widths:[%], border}
//        {t:'pagebreak'}
// =====================================================================
const P = (text, o = {}) => ({ t: 'p', runs: Array.isArray(text) ? text : [{ x: text, b: o.b, i: o.i }], align: o.align || 'both', indent: o.indent ?? 0, firstLine: o.firstLine ?? 0, before: o.before ?? 2, after: o.after ?? 2, line: o.line, size: o.size });
const R = (x, o = {}) => Object.assign({ x }, o);
const dots = v => blank(v) ? '' : String(v);
const KHONG = 'Không có';
// Đo bề rộng dòng chữ (pt) bằng font Times New Roman thật khi chạy trong trình duyệt; có thể thay bằng setMeasure()
let _measure = null;
function textWidthPt(text, sizePt, bold, italic) {
  if (_measure) return _measure(text, sizePt, bold, italic);
  try {
    if (typeof document !== 'undefined') {
      const c = textWidthPt._c || (textWidthPt._c = document.createElement('canvas').getContext('2d'));
      c.font = `${italic ? 'italic ' : ''}${bold ? 'bold ' : ''}100px "Times New Roman", "Liberation Serif", Tinos, serif`;
      return c.measureText(text).width / 100 * sizePt;
    }
  } catch (e) { /* bỏ qua */ }
  return [...String(text)].reduce((w, ch) => w + (/[A-ZĐÂÊÔƠƯĂÁÀẢÃẠ-Ỹ]/.test(ch) ? 0.68 : ch === ' ' ? 0.25 : /[-–.,:;()\/]/.test(ch) ? 0.3 : 0.47), 0) * sizePt * (bold ? 1.05 : 1);
}
function setMeasure(fn) { _measure = fn; }
function fitHeadSize(lines, cellCm, base = 13) {
  // chỉ thu nhỏ tối đa 1pt; nếu vẫn không vừa thì giữ cỡ gốc để Word tự xuống dòng theo kiểu truyền thống
  const maxW = Math.max(...lines.map((t, i) => textWidthPt(t, 1, i === lines.length - 1)));
  for (let sz = base; sz >= base - 1; sz -= 0.5) if (maxW * sz * (2.54 / 72) <= cellCm - 0.4) return sz;
  return base;
}
const PT2CM = 2.54 / 72;

function buildDeclDoc(decl, prev, settings = {}) {
  const B = []; const lanDau = decl.phuongThuc === 'lan_dau';
  const line = (label, val, ind = 0, o = {}) => B.push(P([R(label + ': '), R(blank(val) ? (o.empty ?? KHONG) : String(val))]));
  // Đầu trang
  const coLines = (decl.tenCoQuanDauTrang || 'TÊN CƠ QUAN, ĐƠN VỊ').toUpperCase().split(/\n/).map(x => x.trim()).filter(Boolean);
  const dang = decl.quocHieu === 'dang';
  const HS = 13; // cỡ chữ khối tên cơ quan, quốc hiệu
  const tight = { before: 0, after: 0, line: 1 };
  const LS = fitHeadSize(coLines, 7.2, HS);
  const leftCell = coLines.map((t, i) => P([R(t, { b: i === coLines.length - 1 })], Object.assign({ align: 'center', size: LS }, tight)));
  const last = coLines[coLines.length - 1] || '';
  leftCell.push({ t: 'hr', w: textWidthPt(last, LS, true) / 3 * PT2CM, size: LS });
  const QH = 'CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM', TN = 'Độc lập - Tự do - Hạnh phúc', DANG = 'ĐẢNG CỘNG SẢN VIỆT NAM';
  const rightCell = dang
    ? [P([R(DANG, { b: true })], Object.assign({ align: 'center', size: HS }, tight)), { t: 'hr', w: textWidthPt(DANG, HS, true) * PT2CM, size: HS }]
    : [P([R(QH, { b: true })], Object.assign({ align: 'center', size: HS }, tight)), P([R(TN, { b: true })], Object.assign({ align: 'center', size: HS }, tight)), { t: 'hr', w: textWidthPt(TN, HS, true) * PT2CM, size: HS }];
  B.push({ t: 'table', border: false, cm: [7.2, 10.4], ind: -0.8, widths: [41, 59], rows: [[leftCell, rightCell]] });
  // Tiêu đề đúng mẫu: "BẢN KÊ KHAI TÀI SẢN, THU NHẬP…(1)" — điền phương thức vào chỗ "…"; dòng "(Ngày … tháng … năm …)(2)" ghi ngày chốt
  const ptTxt = { lan_dau: 'LẦN ĐẦU', hang_nam: 'HẰNG NĂM', bo_sung: 'BỔ SUNG', can_bo: 'PHỤC VỤ CÔNG TÁC CÁN BỘ' }[decl.phuongThuc] || '';
  B.push(P([R('BẢN KÊ KHAI TÀI SẢN, THU NHẬP ' + ptTxt, { b: true })], { align: 'center', before: 24, after: 0, line: 1.15, size: 14 }));
  const dc = decl.ngayChot ? new Date(decl.ngayChot + 'T00:00:00') : null;
  B.push(P([R(dc ? `(Ngày ${pad(dc.getDate())} tháng ${pad(dc.getMonth() + 1)} năm ${dc.getFullYear()})` : '(Ngày....... tháng ...... năm ......)', { b: true })], { align: 'center', before: 0, after: 12, line: 1.15, size: 14 }));
  const bodyStart = B.length;
  const S3 = '   '; // khoảng cách giữa các trường trên cùng một dòng (mẫu dùng dòng chấm)
  const ml = (txt, o = {}) => B.push(Object.assign(P(txt, o), { multi: true })); // dòng nhiều trường: căn trái
  const H = txt => B.push(P(txt)); // đề mục chữ thường như mẫu
  const val = v => blank(v) ? KHONG : String(v);

  // I. THÔNG TIN CHUNG
  B.push(P([R('I. THÔNG TIN CHUNG', { b: true })]));
  H('1. Người kê khai tài sản, thu nhập');
  const p = decl.nguoi;
  ml(`- Họ và tên: ${dots(p.hoTen)}\tNgày, tháng, năm sinh: ${fmtDate(p.ngaySinh)}`);
  line('- Quê quán', p.queQuan); line('- Nơi thường trú', p.noiThuongTru); line('- Nơi ở hiện nay', p.noiOHienNay);
  ml(`- Chức vụ/chức danh: ${dots(p.chucVu)}\tHệ số phụ cấp chức vụ: ${blank(p.heSoPhuCap) ? 'Không' : p.heSoPhuCap}`);
  line('- Cơ quan, đơn vị công tác', p.coQuan);
  ml(`- Số thẻ căn cước/Số CCCD/Số định danh cá nhân: ${dots(p.soDinhDanh)}${S3}ngày cấp: ${fmtDate(p.ngayCap)}${S3}nơi cấp: ${dots(p.noiCap)}`);
  line('- Số điện thoại', p.soDienThoai);

  H('2. Vợ hoặc chồng của người kê khai tài sản, thu nhập');
  if (!decl.coVoChong) B.push(P(KHONG));
  else {
    const v = decl.voChong;
    ml(`- Họ và tên: ${dots(v.hoTen)}\tNgày, tháng, năm sinh: ${fmtDate(v.ngaySinh)}`);
    line('- Quê quán', v.queQuan); line('- Nơi thường trú', v.noiThuongTru); line('- Nơi ở hiện nay', v.noiOHienNay);
    ml(`- Chức vụ/chức danh/nghề nghiệp, công việc đang làm: ${dots(v.ngheNghiep)}${S3}Hệ số phụ cấp chức vụ (nếu có): ${blank(v.heSoPhuCap) ? 'Không' : v.heSoPhuCap}`);
    line('- Cơ quan, đơn vị công tác, nơi làm việc', v.noiLamViec);
    ml(`- Số thẻ căn cước/Số CCCD/Số định danh cá nhân: ${dots(v.soDinhDanh)}${S3}ngày cấp: ${fmtDate(v.ngayCap)}${S3}nơi cấp: ${dots(v.noiCap)}`);
    line('- Số điện thoại', v.soDienThoai);
  }
  H('3. Con chưa thành niên (con đẻ, con nuôi theo quy định của pháp luật)');
  if (!decl.con.length) B.push(P(KHONG));
  decl.con.forEach((c, i) => {
    H(`3.${i + 1}. Con thứ ${ordName(i)}:`);
    ml(`- Họ và tên: ${dots(c.hoTen)}\tNgày, tháng, năm sinh: ${fmtDate(c.ngaySinh)}`);
    line('- Nơi thường trú', c.noiThuongTru); line('- Nơi ở hiện nay', c.noiOHienNay);
    ml(`- Số định danh cá nhân/Số thẻ căn cước: ${dots(c.soDinhDanh)}${S3}ngày cấp: ${fmtDate(c.ngayCap)}${S3}nơi cấp: ${dots(c.noiCap)}`);
  });

  // II. THÔNG TIN MÔ TẢ VỀ TÀI SẢN
  B.push(P([R('II. THÔNG TIN MÔ TẢ VỀ TÀI SẢN', { b: true })]));
  const valStr = (g, it) => {
    if (it.giaTri_unk) return 'Không xác định được giá trị' + (it.giaTri_unkReason ? ' (lý do: ' + it.giaTri_unkReason + ')' : '');
    const f = g.fields.find(x => x.k === 'giaTri');
    if (f && f.t === 'fx' && it.giaTri_cur && it.giaTri_cur !== 'VND') return `${fmtMoney(it.giaTri_fx)} ${it.giaTri_cur} (tỷ giá ${fmtMoney(it.giaTri_rate)}), quy đổi ${fmtVND(itemValue(g, it))}`;
    return fmtVND(itemValue(g, it));
  };
  const ownerNote = it => (it.dungTen && it.dungTen !== 'Người kê khai') ? `Thuộc sở hữu/sử dụng của: ${it.dungTen}. ` : '';
  const area = v => v ? v + ' m²' : '';
  const addr = it => [it.diaChi, it.diaChiCu ? '(địa chỉ trên Giấy chứng nhận: ' + it.diaChiCu + ')' : ''].filter(Boolean).join(' ');
  const tail = (g, it, ttLabel) => {
    B.push(P('- Thông tin khác (nếu có): ' + dots(it.thongTinKhac)));
    B.push(P('+ Nguồn hình thành: ' + dots(it.nguon)));
    B.push(P(`+ ${ttLabel}: ` + dots(it.tinhTrang)));
    B.push(P('+ Ghi chú: ' + ownerNote(it) + dots(it.ghiChu)));
  };
  const list = k => decl.ts[k] || [];
  const items = (g, nameFn, bodyFn, ttLabel) => {
    const arr = list(g.key);
    if (!arr.length) { B.push(P(KHONG)); return; }
    arr.forEach((it, i) => { if (nameFn) H(nameFn(i)); bodyFn(it); tail(g, it, ttLabel); });
  };
  H('1. Quyền sử dụng đất:');
  H('1.1. Đất ở:');
  items(GROUP.datO, i => `1.1.${i + 1}. Thửa thứ ${ordName(i)}:`, it => {
    line('- Địa chỉ', addr(it), 0, { empty: '' }); line('- Diện tích', area(it.dienTich), 0, { empty: '' });
    line('- Giá trị', valStr(GROUP.datO, it)); line('- Giấy chứng nhận quyền sử dụng', it.gcn, 0, { empty: '' });
  }, 'Tình trạng quản lý, sử dụng');
  H('1.2. Các loại đất khác:');
  items(GROUP.datKhac, i => `1.2.${i + 1}. Thửa thứ ${ordName(i)}:`, it => {
    ml(`- Loại đất: ${dots(it.loaiDat)}${S3}Địa chỉ: ${addr(it)}`); line('- Diện tích', area(it.dienTich), 0, { empty: '' });
    line('- Giá trị', valStr(GROUP.datKhac, it)); line('- Giấy chứng nhận quyền sử dụng', it.gcn, 0, { empty: '' });
  }, 'Tình trạng quản lý, sử dụng');
  H('2. Nhà ở, công trình xây dựng:');
  H('2.1. Nhà ở:');
  items(GROUP.nhaO, i => `2.1.${i + 1}. Nhà thứ ${ordName(i)}:`, it => {
    line('- Địa chỉ', addr(it), 0, { empty: '' }); line('- Loại nhà', it.loaiNha, 0, { empty: '' }); line('- Diện tích sử dụng', area(it.dienTich), 0, { empty: '' });
    line('- Giá trị', valStr(GROUP.nhaO, it)); line('- Giấy chứng nhận quyền sở hữu', it.gcn, 0, { empty: '' });
  }, 'Tình trạng quản lý, sử dụng, sở hữu');
  H('2.2. Công trình xây dựng khác:');
  items(GROUP.congTrinh, i => `2.2.${i + 1}. Công trình thứ ${ordName(i)}:`, it => {
    ml(`- Tên công trình: ${dots(it.ten)}${S3}Địa chỉ: ${addr(it)}`); line('- Diện tích', area(it.dienTich), 0, { empty: '' });
    line('- Giá trị', valStr(GROUP.congTrinh, it)); line('- Giấy chứng nhận quyền sở hữu', it.gcn, 0, { empty: '' });
  }, 'Tình trạng quản lý, sử dụng, sở hữu');
  H('3. Tài sản khác gắn liền với đất:');
  H('3.1. Cây lâu năm:');
  items(GROUP.cayLauNam, null, it => ml(`- Loại cây: ${dots(it.loaiCay)}${S3}Số lượng: ${dots(it.soLuong)}${S3}Giá trị: ${valStr(GROUP.cayLauNam, it)}`), 'Tình trạng quản lý, sử dụng, sở hữu');
  H('3.2. Rừng sản xuất:');
  items(GROUP.rung, null, it => ml(`- Loại rừng: ${dots(it.loaiRung)}${S3}Diện tích: ${area(it.dienTich)}${S3}Giá trị: ${valStr(GROUP.rung, it)}`), 'Tình trạng quản lý, sử dụng, sở hữu');
  H('3.3. Vật kiến trúc khác gắn liền với đất:');
  items(GROUP.vatKienTruc, null, it => ml(`- Tên gọi: ${dots(it.tenGoi)}${S3}Số lượng: ${dots(it.soLuong)}${S3}Đơn vị: ${dots(it.donVi)}${S3}Giá trị: ${valStr(GROUP.vatKienTruc, it)}`), 'Tình trạng quản lý, sử dụng, sở hữu');

  H('4. Vàng, kim cương, bạch kim và các kim loại quý, đá quý khác.');
  const klq = list('kimLoaiQuy').filter(it => settings.keKhaiDuoiNguong || it.giaTri_unk || itemValue(GROUP.kimLoaiQuy, it) >= NGUONG || klqGroupOver(decl, it));
  if (!klq.length) B.push(P(KHONG));
  klq.forEach((it, i) => {
    H(`4.${i + 1}. Tài sản thứ ${ordName(i)}:`);
    ml(`- Tên tài sản: ${dots(it.ten)}${S3}Số lượng, đơn vị tính: ${dots(it.soLuong)}${S3}Tổng giá trị: ${valStr(GROUP.kimLoaiQuy, it)}`);
    tail(GROUP.kimLoaiQuy, it, 'Tình trạng quản lý, sử dụng, sở hữu');
  });

  // 5. Tiền — giữ đủ các mục 5.1–5.4 như mẫu
  const tien = groupTotal(decl, MONEY_KEYS);
  const showTien = tien >= NGUONG || settings.keKhaiDuoiNguong;
  B.push(P('5. Tiền (tiền Việt Nam, ngoại tệ): ghi tổng số tiền tại thời điểm kê khai bao gồm tiền mặt, tiền cho vay, tiền trả trước, tiền gửi cá nhân, tổ chức trong nước, tổ chức nước ngoài tại Việt Nam: ' + (showTien ? fmtVND(tien) : KHONG)));
  const T = k => showTien ? list(k) : [];
  const sumOf = k => T(k).reduce((s2, it) => s2 + itemValue(GROUP[k], it), 0);
  const fxNote = it => (it.giaTri_cur && it.giaTri_cur !== 'VND') ? ` (${fmtMoney(it.giaTri_fx)} ${it.giaTri_cur}, tỷ giá ${fmtMoney(it.giaTri_rate)})` : '';
  const join = a => a.filter(Boolean).join('; ');
  const tm = T('tienMat'), cv = T('tienChoVay'), tt = T('tienTraTruoc');
  ml(`5.1. Tiền mặt: ${tm.length ? fmtVND(sumOf('tienMat')) + tm.map(fxNote).join('') : KHONG}${S3}Tình trạng quản lý, sử dụng: ${join(tm.map(it => ownerNote(it) + (it.tinhTrang || '')))}`);
  ml(`5.2. Tiền cho vay: ${cv.length ? fmtVND(sumOf('tienChoVay')) : KHONG}${S3}Tài liệu minh chứng (nếu có): ${join(cv.map(it => [it.benVay ? 'cho ' + it.benVay + ' vay ' + fmtMoney(itemValue(GROUP.tienChoVay, it)) + fxNote(it) : '', it.minhChung].filter(Boolean).join(', ')))}`);
  ml(`5.3. Tiền trả trước: ${tt.length ? fmtVND(sumOf('tienTraTruoc')) : KHONG}${S3}Tài liệu minh chứng (nếu có): ${join(tt.map(it => [it.noiDung, it.minhChung].filter(Boolean).join(', ')))}`);
  H('5.4. Tiền gửi cá nhân hoặc tổ chức trong nước, tổ chức nước ngoài tại Việt Nam');
  const tk = T('taiKhoan'), stk = T('soTietKiem'), kh = T('tienGuiKhac');
  const own2 = it => it.dungTen && it.dungTen !== 'Người kê khai' ? ' (' + it.dungTen + ')' : '';
  if (!tk.length) ml(`- Số tài khoản thanh toán: ${KHONG}`);
  tk.forEach(it => ml(`- Số tài khoản thanh toán: ${dots(it.soTK)}${S3}Tại đơn vị, tổ chức: ${dots(it.toChuc)}${S3}Số dư tại thời điểm kê khai: ${fmtVND(itemValue(GROUP.taiKhoan, it))}${fxNote(it)}${own2(it)}`));
  if (!stk.length) ml(`- Số tài khoản/số sổ tiết kiệm: ${KHONG}`);
  stk.forEach(it => ml(`- Số tài khoản/số sổ tiết kiệm: ${dots(it.soTK)}${S3}Tại đơn vị, tổ chức: ${dots(it.toChuc)}${S3}Số tiền: ${fmtVND(itemValue(GROUP.soTietKiem, it))}${fxNote(it)}${own2(it)}`));
  if (!kh.length) ml(`- Các loại tiền gửi khác: ${KHONG}`);
  kh.forEach(it => ml(`- Các loại tiền gửi khác: ${dots(it.moTa)}${S3}Tổng số tiền: ${fmtVND(itemValue(GROUP.tienGuiKhac, it))}${fxNote(it)}${S3}Tài liệu minh chứng (nếu có): ${dots(it.minhChung)}`));

  // 6. Cổ phiếu... — giữ đủ 6.1–6.4
  const showCk = groupTotal(decl, SEC_KEYS) >= NGUONG || settings.keKhaiDuoiNguong;
  const C = k => showCk ? list(k) : [];
  H('6. Cổ phiếu, trái phiếu, vốn góp, các loại giấy tờ có giá khác:');
  H('6.1. Cổ phiếu:'); if (!C('coPhieu').length) B.push(P(KHONG));
  C('coPhieu').forEach(x => ml(`- Tên cổ phiếu: ${dots(x.ten)}${S3}Số lượng: ${dots(x.soLuong)}${S3}Giá trị: ${fmtVND(itemValue(GROUP.coPhieu, x))}`));
  H('6.2. Trái phiếu:'); if (!C('traiPhieu').length) B.push(P(KHONG));
  C('traiPhieu').forEach(x => ml(`- Tên trái phiếu: ${dots(x.ten)}${S3}Số lượng: ${dots(x.soLuong)}${S3}Giá trị: ${fmtVND(itemValue(GROUP.traiPhieu, x))}`));
  H('6.3. Vốn góp:'); if (!C('vonGop').length) B.push(P(KHONG));
  C('vonGop').forEach(x => { ml(`- Hình thức, loại vốn góp: ${dots(x.hinhThuc)}${S3}Giá trị: ${fmtVND(itemValue(GROUP.vonGop, x))}`); B.push(P('- Tài liệu minh chứng (nếu có): ' + dots(x.minhChung))); });
  H('6.4. Các loại giấy tờ có giá khác:'); if (!C('giayToCoGia').length) B.push(P(KHONG));
  C('giayToCoGia').forEach(x => { ml(`- Tên giấy tờ có giá: ${dots(x.ten)}${S3}Giá trị: ${fmtVND(itemValue(GROUP.giayToCoGia, x))}`); B.push(P('- Tài liệu minh chứng (nếu có): ' + dots(x.minhChung))); });

  // 7. Tài sản khác
  H('7. Tài sản khác:');
  const over = k => list(k).filter(it => settings.keKhaiDuoiNguong || itemValue(GROUP[k], it) >= NGUONG || it.giaTri_unk);
  H('7.1. Tài sản theo quy định của pháp luật phải đăng ký sử dụng và được cấp giấy đăng ký (tàu bay, tàu thủy, thuyền, máy ủi, máy xúc, ô tô, mô tô, xe gắn máy…)');
  const d71 = over('tsDangKy'); if (!d71.length) B.push(P(KHONG));
  d71.forEach(x => { ml(`- Tên tài sản: ${dots(x.ten)}${S3}Số đăng ký: ${dots(x.soDangKy)}`); ml(`Giá trị: ${valStr(GROUP.tsDangKy, x)}${S3}Thông tin khác (nếu có): ${ownerNote(x)}${dots(x.thongTinKhac)}`); });
  B.push(P([R('7.2. Tài sản khác như tài sản số, tài sản đấu giá '), R('(biển số xe, sim điện thoại,...)', { i: true }), R(', quyền sở hữu trí tuệ, đồ mỹ nghệ, đồ thờ cúng, bàn ghế, cây cảnh, tranh, ảnh, cổ vật, …:')]));
  const d72 = over('tsKhac'); if (!d72.length) B.push(P(KHONG));
  d72.forEach(x => { ml(`- Loại tài sản: ${dots(x.loai)}${S3}Số lượng, giá trị: ${[x.soLuong, valStr(GROUP.tsKhac, x)].filter(Boolean).join(', ')}`); ml(`- Thông tin khác (nếu có): ${ownerNote(x)}${dots(x.thongTinKhac)}${S3}Tài liệu minh chứng (nếu có): ${dots(x.minhChung)}`); });
  H('8. Tài sản ở nước ngoài:');
  const nn = list('tsNuocNgoai'); if (!nn.length) B.push(P(KHONG));
  nn.forEach(x => B.push(P(`- ${dots(x.loai)} tại ${dots(x.quocGia)}: ${dots(x.moTa)}; Giá trị: ${valStr(GROUP.tsNuocNgoai, x)}`)));
  H('9. Tài khoản ở nước ngoài:');
  const tkn = list('tkNuocNgoai'); if (!tkn.length) B.push(P(KHONG));
  tkn.forEach(x => { ml(`- Tên chủ tài khoản: ${dots(x.chuTK)}${S3}Số tài khoản: ${dots(x.soTK)}`); B.push(P(`- Tên ngân hàng, chi nhánh ngân hàng, tổ chức nơi mở tài khoản: ${dots(x.nganHang)}`)); });

  // 10. Thu nhập
  H('10. Tổng thu nhập giữa hai lần kê khai, gồm thu nhập bằng tiền; bằng tài sản hoặc hiện vật có giá trị (ước tính hoặc giá niêm yết):');
  if (lanDau) B.push(P('Không phải kê khai (kê khai lần đầu)'));
  else {
    const t = decl.thuNhap; const inc = incomeTotals(decl);
    B.push(P(`- Thu nhập của người kê khai: ${fmtVND(inc.ban)}, gồm:`));
    B.push(P(`+ Thu nhập từ lương, phụ cấp, trợ cấp: ${fmtVND(num(t.ban.luong))}`));
    B.push(P(`+ Thu nhập từ kinh doanh hoặc từ nguồn khác (nếu có): ${num(t.ban.khac) ? fmtVND(num(t.ban.khac)) + (t.ban.khacGhiChu ? ' (' + t.ban.khacGhiChu + ')' : '') : KHONG}`));
    if (decl.coVoChong) {
      B.push(P(`- Thu nhập của vợ/chồng người kê khai: ${fmtVND(inc.vc)}, gồm:`));
      B.push(P(`+ Thu nhập từ lương, phụ cấp, trợ cấp, tiền công: ${num(t.voChong.luong) ? fmtVND(num(t.voChong.luong)) : KHONG}`));
      B.push(P(`+ Thu nhập từ kinh doanh hoặc từ nguồn khác (nếu có): ${num(t.voChong.khac) ? fmtVND(num(t.voChong.khac)) + (t.voChong.khacGhiChu ? ' (' + t.voChong.khacGhiChu + ')' : '') : KHONG}`));
    } else B.push(P(`- Thu nhập của vợ/chồng người kê khai: ${KHONG}`));
    B.push(P(`- Thu nhập của con chưa thành niên: ${num(t.con) ? fmtVND(num(t.con)) + (t.conGhiChu ? ' (' + t.conGhiChu + ')' : '') : KHONG}`));
    B.push(P(`- Các khoản thu nhập chung: ${num(t.chung) ? fmtVND(num(t.chung)) + (t.chungGhiChu ? ' (' + t.chungGhiChu + ')' : '') : KHONG}`));
    B.push(P(`- Tổng thu nhập giữa hai lần kê khai: ${fmtVND(inc.tong)}`));
