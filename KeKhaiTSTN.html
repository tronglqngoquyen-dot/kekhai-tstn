<html lang="vi">
<head>
<meta charset="utf-8">

<title>Kê khai TSTN — Kê khai tài sản, thu nhập theo NĐ 164/2026/NĐ-CP</title>
<meta name="description" content="Phần mềm miễn phí, chạy offline: lập, tự rà soát và xuất bản kê khai tài sản, thu nhập đúng mẫu Nghị định 164/2026/NĐ-CP. Dữ liệu lưu trên máy người dùng.">

<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--mute:#5d6778;--line:#dfe3ea;--pri:#9b1c1c;--pri2:#c0392b;--pri-soft:#fdecea;--ok:#1e7d4f;--ok-soft:#e5f5ec;--warn:#a15c00;--warn-soft:#fff4e0;--info:#1f5fa8;--info-soft:#e8f0fb;--r:10px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(90deg,#7f1414,#a52a2a);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:9.5px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.85}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:rgba(255,255,255,.12);border:0;color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri);font-weight:600}
.top .sp{flex:1}
.top .tb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.top .tb:hover{background:rgba(255,255,255,.12)}
.saved{font-size:12px;opacity:.9;white-space:nowrap}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 50px)}
.side{background:#fff;border-right:1px solid var(--line);padding:12px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
.side h4{margin:14px 6px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:13.8px}
.nav a:hover{background:#f2f4f7}.nav a.on{background:var(--pri-soft);color:var(--pri);font-weight:600}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;display:inline-grid;place-items:center;font-weight:700}
.b-err{background:#fde2e1;color:#b42318}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-ok{background:var(--ok-soft);color:var(--ok)}
.main{padding:20px 26px 80px;max-width:1080px;width:100%}
.hs-box{background:#f8f9fb;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.hs-box select{width:100%;margin:4px 0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin:0 0 16px}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.sec{display:inline-block;background:var(--pri);color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700;margin-right:6px}
.desc{color:var(--mute);font-size:13px;margin:-4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:#344054;font-weight:500}
label.f .h{font-weight:400;color:var(--mute);font-size:12px}
input[type=text],input[type=date],input[type=password],input[type=number],select,textarea{border:1px solid #cfd5df;border-radius:8px;padding:7px 10px;background:#fff;width:100%;font-weight:400}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #f3b4ae;border-color:var(--pri2)}
.money-read{font-size:12px;color:var(--ok);font-weight:500;min-height:16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfd5df;background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{background:#f6f7f9}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:#861818}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}.btn.dang{color:#b42318;border-color:#f3c0bc}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#fcfcfd}
.item-h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid transparent}
.item.open .item-h{border-bottom-color:var(--line)}
.item-h .t{flex:1;font-weight:600}.item-h .v{color:var(--ok);font-weight:600;white-space:nowrap}
.item-b{padding:12px;display:none}.item.open .item-b{display:block}
.empty{color:var(--mute);font-style:italic;padding:6px 2px}
.note{border-radius:9px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}
.note.info{background:var(--info-soft);color:#173f6e}.note.warn{background:var(--warn-soft);color:#6b3d00}.note.ok{background:var(--ok-soft);color:#14532d}.note.err{background:#fde2e1;color:#7a1d16}
.find{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.find:hover{background:#fafafa}
.find .lv{flex:none;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;height:fit-content}
.lv.loi{background:#fde2e1;color:#b42318}.lv.canh_bao{background:var(--warn-soft);color:var(--warn)}.lv.goi_y{background:var(--info-soft);color:var(--info)}
.find .s{font-weight:600;font-size:13px}.find .m{font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--mute)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{background:#f8f9fb;font-weight:600;font-size:12.5px;color:#344054}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.pt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pt label{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:13px;background:#fff}
.pt label.on{border-color:var(--pri);background:var(--pri-soft)}
.pt input{display:none}.pt b{display:block;font-size:14px;margin-bottom:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.5);z-index:100;display:grid;place-items:center;padding:20px}
.modal .box{background:#fff;border-radius:12px;max-width:920px;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal .mb{padding:16px 18px;overflow:auto}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal.sm .box{max-width:460px}
.doc{font-family:"Times New Roman",Times,serif;color:#000;background:#fff;line-height:1.3}
.doc p{margin:0}.doc table{border-collapse:collapse}.doc table.bd td{border:1px solid #000;padding:3px 5px}.doc table.nb td{vertical-align:top}
.doc .hr{border-top:1px solid #000;margin:2px auto 0}
.paper{background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);padding:2cm 2cm 2cm 3cm;max-width:21cm;margin:0 auto}
.foot{color:var(--mute);font-size:12px;text-align:center;padding:24px 0 8px}
.banner{background:#fff7d6;border-bottom:1px solid #f0d77a;padding:8px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.welcome{max-width:760px;margin:40px auto}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice .card{cursor:pointer;transition:.15s}.choice .card:hover{border-color:var(--pri);transform:translateY(-1px)}
.stat-ok{color:var(--ok);font-weight:700}.stat-err{color:#b42318;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:9px;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:14px}
.mut{color:var(--mute)}.small{font-size:12.5px}.r{text-align:right}
.calc td input{min-width:80px}
.stepper{display:flex;justify-content:space-between;margin-top:18px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto}.grid,.grid.g3,.pt,.kpis,.choice{grid-template-columns:1fr}.tabs{display:none}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .paper{box-shadow:none;padding:0;max-width:none}
  @page{size:A4;margin:2cm 2cm 2cm 3cm}
}
#printArea{display:none}

</style>

// Đọc số kiểu Việt Nam: "1.234.567" (dấu chấm phân nghìn), "4,98" hoặc "4.98" (thập phân)
const num = v => {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/\s/g, '').replace(/[^\d\-.,]/g, '');
  if (!s) return 0;
  const hasDot = s.includes('.'), hasCom = s.includes(',');
  if (hasDot && hasCom) { s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, ''); }
  else if (hasCom) { s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.'); }
  else if (hasDot) { if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); }
  const n = Number(s); return isFinite(n) ? n : 0;
};
const fmtMoney = n => { n = Math.round(Number(n) || 0); return n.toLocaleString('vi-VN').replace(/,/g, '.') ; };

const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

// Đọc số thành chữ (tiếng Việt) — hỗ trợ người dùng kiểm tra số tiền
function docSo(n) {
  n = Math.round(Math.abs(Number(n) || 0));
  if (n === 0) return 'không đồng';
  const cs = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const doc3 = (x, full) => {
    const tr = Math.floor(x / 100), ch = Math.floor((x % 100) / 10), dv = x % 10; let s = [];
    if (full || tr) s.push(cs[tr] + ' trăm');
    if (ch === 0 && dv) { if (full || tr) s.push('lẻ'); }
    else if (ch === 1) s.push('mười');
    else if (ch > 1) s.push(cs[ch] + ' mươi');
    if (dv) { if (dv === 1 && ch > 1) s.push('mốt'); else if (dv === 5 && ch > 0) s.push('lăm'); else if (dv === 4 && ch > 1) s.push('tư'); else s.push(cs[dv]); }
    return s.join(' ');
  };
  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const parts = []; let i = 0;
  while (n > 0) { parts.push(n % 1000); n = Math.floor(n / 1000); i++; }
  let out = [];
  for (let j = parts.length - 1; j >= 0; j--) {
    if (parts[j] === 0) continue;
    out.push(doc3(parts[j], j < parts.length - 1) + units[j]);
  }
  let s = out.join(' ').replace(/\s+/g, ' ').trim();
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

}

function monthsBetween(tu, den) {
  // số tháng (có lẻ theo ngày) giữa 2 ngày, tính cả ngày đầu và ngày cuối
  const a = new Date(tu + 'T00:00:00'), b = new Date(den + 'T00:00:00');
  if (isNaN(a) || isNaN(b) || b < a) return 0;
  let m = 0, cur = new Date(a);
  while (cur <= b) {
    const y = cur.getFullYear(), mo = cur.getMonth();
    const dim = new Date(y, mo + 1, 0).getDate();
    const endOfMonth = new Date(y, mo, dim);
    const last = endOfMonth < b ? endOfMonth : b;
    const days = Math.round((last - cur) / 86400000) + 1;
    m += days / dim;
    cur = new Date(y, mo + 1, 1);
  }
  return m;
}
function calcSalary(c, tu, den, lcsTable) {
  lcsTable = lcsTable || LUONG_CO_SO_MAC_DINH;
  const base = num(c.heSoLuong) + num(c.heSoPCCV) + num(c.heSoTNVK);
  const pct = (num(c.pctUuDai) + num(c.pctThamNien)) / 100;
  const hs = base * (1 + pct) + num(c.heSoKhuVuc) + num(c.heSoKhac);
  const rows = []; let total = 0;
  if (!tu || !den || hs <= 0) return { rows, total: num(c.thuong), hs };
  lcsTable.forEach(p => {
    const s = tu > p.tu ? tu : p.tu, e = den < p.den ? den : p.den;
    if (s > e) return;
    const m = monthsBetween(s, e);
    const monthly = hs * p.muc + num(c.khoanThangKhac);
    const amount = Math.round(monthly * m);
    rows.push({ tu: s, den: e, muc: p.muc, cancu: p.cancu, thang: m, monthly: Math.round(monthly), amount });
    total += amount;
  });
  total += num(c.thuong);
  return { rows, total, hs };
}

function incomePeriod(decl, prevDecl) {
  if (decl.phuongThuc === 'lan_dau') return null;
  const prev = prevDecl ? (prevDecl.ngayKeKhai || prevDecl.ngayChot) : decl.ngayKeKhaiTruoc;
  const tu = prev ? addDays(prev, 1) : '';
  const den = decl.ngayKeKhai || decl.ngayChot || '';
  return { tu, den, prev };
}

function describeItem(g, it) {
  const main = it.diaChi || it.ten || it.tenGoi || it.loai || it.loaiCay || it.loaiRung || it.loaiDat || it.soTK || it.hinhThuc || it.moTa || it.chuNo || it.benVay || it.noiDung || '';
  return `${g.title}${main ? ': ' + main : ''}`;
}
function compareDecls(cur, prev) {
  const tang = [], giam = [];
  if (!prev) return { tang, giam };
  const push = (arr, key, moTa, giaTri) => arr.push({ key, moTa, giaTri: Math.abs(Math.round(giaTri)) });
  // Nhóm tính theo từng mục (BĐS, kim loại quý, tài sản khác, nợ, nước ngoài)
  GROUPS.forEach(g => {
    if (MONEY_KEYS.includes(g.key) || SEC_KEYS.includes(g.key)) return;
    const pm = Object.fromEntries((prev.ts[g.key] || []).map(it => [it.id, it]));
    const cm = Object.fromEntries((cur.ts[g.key] || []).map(it => [it.id, it]));
    Object.values(cm).forEach(it => {
      const v = itemValue(g, it), p = pm[it.id];
      if (!p) push(g.liability ? giam : tang, g.key + ':' + it.id, (g.liability ? 'Phát sinh khoản nợ mới — ' : 'Tài sản mới — ') + describeItem(g, it), v);
      else {
        const pv = itemValue(g, p);
        if (v !== pv) push((v > pv) !== !!g.liability ? tang : giam, g.key + ':' + it.id, (g.liability ? 'Thay đổi khoản nợ — ' : 'Thay đổi giá trị — ') + describeItem(g, it) + ` (từ ${fmtMoney(pv)} thành ${fmtMoney(v)})`, v - pv);
      }
    });
    Object.values(pm).forEach(p => {
      if (!cm[p.id]) push(g.liability ? tang : giam, g.key + ':' + p.id, (g.liability ? 'Đã trả hết khoản nợ — ' : 'Không còn tài sản — ') + describeItem(g, p), itemValue(g, p));
    });
  });
  // Tiền và giấy tờ có giá: so tổng nhóm
  [[MONEY_KEYS, 'Tiền (tiền mặt, cho vay, trả trước, tiền gửi)', 'tien'], [SEC_KEYS, 'Cổ phiếu, trái phiếu, vốn góp, giấy tờ có giá', 'ck']].forEach(([keys, name, key]) => {
    const a = groupTotal(cur, keys), b = groupTotal(prev, keys);
    if (a !== b) push(a > b ? tang : giam, key, `${name}: từ ${fmtMoney(b)} thành ${fmtMoney(a)} đồng`, a - b);
  });
  return { tang, giam };
}

function applyBienDongSuggest(decl, prev) {
  const { tang, giam } = compareDecls(decl, prev);
  const merge = (oldArr, sug) => {
    const keep = oldArr.filter(x => !x.auto);
    const byKey = Object.fromEntries(oldArr.filter(x => x.auto).map(x => [x.key, x]));
    return [...sug.map(s => ({ id: (byKey[s.key] || {}).id || uid(), auto: true, key: s.key, moTa: s.moTa, giaTri: s.giaTri, giaiTrinh: (byKey[s.key] || {}).giaiTrinh || '', minhChung: (byKey[s.key] || {}).minhChung || '' })), ...keep];
  };
  decl.bienDong.tang = merge(decl.bienDong.tang, tang);
  decl.bienDong.giam = merge(decl.bienDong.giam, giam);
  return decl;
}

// Tạo kỳ mới từ kỳ trước — giữ nguyên id tài sản để so sánh biến động
function rollForward(prev, opts = {}) {
  const d = clone(prev);
  d.id = uid(); d.createdAt = d.updatedAt = new Date().toISOString();
  d.phuongThuc = opts.phuongThuc || 'hang_nam';
  d.nam = opts.nam || (Number(prev.nam) + 1);
  d.ngayChot = opts.ngayChot || ''; d.ngayKeKhai = '';
  d.ngayKeKhaiTruoc = prev.ngayKeKhai || prev.ngayChot || '';
  d.prevId = prev.id;
  d.thuNhap.ban.luong = d.thuNhap.ban.khac = d.thuNhap.voChong.luong = d.thuNhap.voChong.khac = d.thuNhap.con = d.thuNhap.chung = '';
  d.thuNhap.ban.khacGhiChu = d.thuNhap.voChong.khacGhiChu = d.thuNhap.conGhiChu = d.thuNhap.chungGhiChu = '';
  d.thuNhap.calc.thuong = ''; if (d.thuNhap.calcVoChong) d.thuNhap.calcVoChong.thuong = '';
  d.bienDong = { tang: [], giam: [] };
  d.thayDoi = { thongTinChung: '', taiSan: '' };
  d.review = { status: 'nhap', comments: [] };
  d.chiTieuUocTinh = '';
  return d;
}

// Đảm bảo dữ liệu cũ/nhập từ file có đủ trường
function normalizeDecl(d) {
  const base = newDecl();
  const out = Object.assign(base, d);
  out.nguoi = Object.assign(emptyPerson(), d.nguoi || {});
  out.voChong = Object.assign(emptySpouse(), d.voChong || {});
  out.con = (d.con || []).map(c => Object.assign(emptyChild(), c));
  out.ts = out.ts || {}; GROUPS.forEach(g => { out.ts[g.key] = (out.ts[g.key] || []).map(it => Object.assign(newItem(g.key), it)); });
  out.thuNhap = Object.assign(newDecl().thuNhap, d.thuNhap || {});
  out.thuNhap.calc = Object.assign(emptyIncomeCalc(), out.thuNhap.calc || {});
  out.thuNhap.calcVoChong = Object.assign(emptyIncomeCalc(), out.thuNhap.calcVoChong || {});
  out.bienDong = Object.assign({ tang: [], giam: [] }, d.bienDong || {});
  out.thayDoi = Object.assign({ thongTinChung: '', taiSan: '' }, d.thayDoi || {});
  out.review = Object.assign({ status: 'nhap', comments: [] }, d.review || {});
  return out;
}

// ---------------------------------------------------------------------
// BỘ RÀ SOÁT — trả về danh sách {level: 'loi'|'canh_bao'|'goi_y', sec, msg}
// ---------------------------------------------------------------------
const OLD_ADMIN = /\b(huyện|quận|thị xã)\b/i;
function ageAt(birthISO, atISO) {
  if (!birthISO || !atISO) return null;
  const b = new Date(birthISO + 'T00:00:00'), a = new Date(atISO + 'T00:00:00');
  let age = a.getFullYear() - b.getFullYear();
  if (a.getMonth() < b.getMonth() || (a.getMonth() === b.getMonth() && a.getDate() < b.getDate())) age--;
  return age;
}

function review(decl, prev, opts = {}) {
  const R = []; const add = (level, sec, msg, nav) => R.push({ level, sec, msg, nav: nav || sec });
  const lanDau = decl.phuongThuc === 'lan_dau';
  const at = decl.ngayChot || decl.ngayKeKhai || todayISO();

  // --- Thông tin kỳ kê khai
  if (blank(decl.ngayChot)) add('loi', 'Kỳ kê khai', 'Chưa ghi ngày chốt thông tin, dữ liệu về tài sản, thu nhập (chú thích 2 của mẫu).', 'ky');
  if (decl.ngayKeKhai && decl.ngayChot && decl.ngayKeKhai < decl.ngayChot) add('loi', 'Kỳ kê khai', 'Ngày hoàn thành kê khai đang sớm hơn ngày chốt thông tin.', 'ky');
  if (blank(decl.tenCoQuanDauTrang)) add('canh_bao', 'Kỳ kê khai', 'Chưa ghi tên cơ quan, đơn vị ở góc trên bên trái bản kê khai.', 'ky');
  if (decl.phuongThuc === 'hang_nam' && decl.ngayKeKhai) {
    const y = Number(decl.ngayKeKhai.slice(0, 4)), md = decl.ngayKeKhai.slice(5);
    if (md > '12-31' || y !== Number(decl.nam)) add('canh_bao', 'Kỳ kê khai', `Kê khai hằng năm phải hoàn thành trước ngày 31/12 của năm ${decl.nam}; kiểm tra lại năm kê khai/ngày hoàn thành.`, 'ky');
  }
  if (opts.hanNop && decl.ngayKeKhai && decl.ngayKeKhai > opts.hanNop) add('canh_bao', 'Kỳ kê khai', `Ngày hoàn thành (${fmtDate(decl.ngayKeKhai)}) muộn hơn hạn nộp đã cài đặt (${fmtDate(opts.hanNop)}).`, 'ky');

  // --- I.1 Người kê khai
  const p = decl.nguoi;
  [['hoTen', 'Họ và tên'], ['ngaySinh', 'Ngày, tháng, năm sinh'], ['chucVu', 'Chức vụ/chức danh'], ['coQuan', 'Cơ quan, đơn vị công tác'], ['soDinhDanh', 'Số thẻ căn cước/CCCD/Số định danh cá nhân'], ['noiThuongTru', 'Nơi thường trú'], ['noiOHienNay', 'Nơi ở hiện nay'], ['queQuan', 'Quê quán']].forEach(([k, l]) => {
    if (blank(p[k])) add('loi', 'I.1 Người kê khai', `Chưa ghi "${l}".`, 'nguoi');
  });
  const checkId = (v, who, nav) => {
    if (blank(v)) return;
    const s = String(v).replace(/\s/g, '');
    if (!/^\d{12}$/.test(s)) add('canh_bao', who, `Số định danh/căn cước "${v}" không phải 12 chữ số — kiểm tra lại (CMND 9 số cũ không còn dùng).`, nav);
  };
  checkId(p.soDinhDanh, 'I.1 Người kê khai', 'nguoi');
  if (!blank(p.soDinhDanh) && (blank(p.ngayCap) || blank(p.noiCap))) add('loi', 'I.1 Người kê khai', 'Thiếu ngày cấp hoặc nơi cấp thẻ căn cước/CCCD (chú thích 3).', 'nguoi');
  if (p.heSoPhuCap === '' && /trưởng|phó|giám đốc|hiệu trưởng|chủ tịch|bí thư/i.test(p.chucVu || '')) add('canh_bao', 'I.1 Người kê khai', 'Có chức vụ lãnh đạo nhưng chưa ghi hệ số phụ cấp chức vụ.', 'nguoi');
  [['noiThuongTru', 'Nơi thường trú'], ['noiOHienNay', 'Nơi ở hiện nay']].forEach(([k, l]) => { if (OLD_ADMIN.test(p[k] || '')) add('canh_bao', 'I.1 Người kê khai', `${l} còn ghi cấp huyện/quận/thị xã — từ 01/7/2025 đã bỏ cấp huyện, nên ghi theo đơn vị hành chính mới (xã/phường/đặc khu, tỉnh/thành phố).`, 'nguoi'); });

  // --- I.2 Vợ/chồng
  if (decl.coVoChong) {
    const v = decl.voChong;
    [['hoTen', 'Họ và tên'], ['ngaySinh', 'Ngày sinh'], ['ngheNghiep', 'Chức vụ/nghề nghiệp, công việc đang làm'], ['noiLamViec', 'Cơ quan, đơn vị công tác, nơi làm việc'], ['soDinhDanh', 'Số định danh/căn cước'], ['noiThuongTru', 'Nơi thường trú']].forEach(([k, l]) => { if (blank(v[k])) add('loi', 'I.2 Vợ/chồng', `Chưa ghi "${l}" của vợ/chồng.`, 'vochong'); });
    checkId(v.soDinhDanh, 'I.2 Vợ/chồng', 'vochong');
    if (!blank(v.soDinhDanh) && (blank(v.ngayCap) || blank(v.noiCap))) add('loi', 'I.2 Vợ/chồng', 'Thiếu ngày cấp hoặc nơi cấp căn cước của vợ/chồng.', 'vochong');
  }
  // --- I.3 Con chưa thành niên
  decl.con.forEach((c, i) => {
    const who = `I.3 Con thứ ${ordName(i)}`;
    if (blank(c.hoTen)) add('loi', who, 'Chưa ghi họ tên con.', 'con');
    if (blank(c.soDinhDanh)) add('loi', who, 'Chưa ghi số định danh cá nhân của con (trẻ em đã được cấp số định danh từ khi đăng ký khai sinh).', 'con');
    const age = ageAt(c.ngaySinh, at);
    if (age !== null && age >= 18) add('canh_bao', who, `${c.hoTen || 'Người con'} đã đủ ${age} tuổi tại ngày chốt — không còn là con chưa thành niên, không kê khai tại mục này (ghi vào Mục IV nếu có thay đổi so với kỳ trước).`, 'con');
    if (blank(c.ngaySinh)) add('goi_y', who, 'Nên ghi ngày sinh để ứng dụng kiểm tra tuổi chưa thành niên.', 'con');
  });

  // --- II. Tài sản
  GROUPS.forEach(g => {
    const items = decl.ts[g.key] || [];
    const secName = `II.${g.sec} ${g.title}`;
    items.forEach((it, i) => {
      const who = `${secName} — ${g.item} thứ ${ordName(i)}`;
      const v = itemValue(g, it);
      const gf = g.fields.find(f => f.k === 'giaTri');
      if (gf && !g.novalue) {
        if (it.giaTri_unk) { if (blank(it.giaTri_unkReason)) add('loi', who, 'Đã chọn "không xác định được giá trị" nhưng chưa ghi rõ lý do (chú thích 10).', g.key); }
        else if (v <= 0) add('loi', who, 'Chưa ghi giá trị. Nếu không xác định được, đánh dấu "Không xác định được giá trị" và ghi lý do.', g.key);
        if (gf.t === 'fx' && it.giaTri_cur && it.giaTri_cur !== 'VND' && (num(it.giaTri_fx) <= 0 || num(it.giaTri_rate) <= 0)) add('loi', who, `Tài sản bằng ${it.giaTri_cur}: phải ghi số lượng ngoại tệ và tỷ giá liên ngân hàng tại thời điểm sở hữu để quy đổi ra đồng.`, g.key);
      }
      if (g.fields.some(f => f.k === 'diaChi')) {
        if (blank(it.diaChi)) add('loi', who, 'Chưa ghi địa chỉ.', g.key);
        else if (OLD_ADMIN.test(it.diaChi)) add('canh_bao', who, 'Địa chỉ còn cấp huyện/quận/thị xã — ghi theo đơn vị hành chính sau sáp nhập; địa chỉ cũ trên Giấy chứng nhận ghi ở ô "Địa chỉ cũ".', g.key);
      }
      if (g.fields.some(f => f.k === 'dienTich') && num(it.dienTich) <= 0) add('loi', who, 'Chưa ghi diện tích (m²).', g.key);
      if (g.fields.some(f => f.k === 'gcn') && blank(it.gcn)) add('loi', who, 'Chưa ghi Giấy chứng nhận. Nếu chưa có thì ghi "chưa được cấp Giấy chứng nhận".', g.key);
      if (g.fields.some(f => f.k === 'nguon') && blank(it.nguon)) add('loi', who, 'Chưa ghi nguồn hình thành tài sản (chú thích 12).', g.key);
      if (g.fields.some(f => f.k === 'tinhTrang') && blank(it.tinhTrang) && g.fields.some(f => f.k === 'nguon')) add('canh_bao', who, 'Chưa ghi tình trạng quản lý, sử dụng, sở hữu.', g.key);
      if (/Đứng tên hộ|Người khác đứng tên hộ/.test(it.dungTen || '') && !/\d{9,12}/.test((it.tinhTrang || '') + (it.ghiChu || ''))) add('loi', who, 'Tài sản nhờ người khác đứng tên/đứng tên hộ: phải ghi rõ họ tên và số định danh/căn cước của người đó trong "Tình trạng".', g.key);
      if (g.threshold === 'perType' && !it.giaTri_unk && v > 0 && v < NGUONG) add('goi_y', who, `Giá trị ${fmtMoney(v)} đồng dưới ngưỡng 150 triệu — không bắt buộc kê khai (trừ khi gộp cùng loại/cùng bộ vượt ngưỡng).`, g.key);
      if (g.threshold === 'perItem' && v > 0 && v < NGUONG) add('goi_y', who, `Khoản nợ ${fmtMoney(v)} đồng dưới 150 triệu — không bắt buộc kê khai.`, g.key);
      if (g.key === 'tkNuocNgoai' && (blank(it.soTK) || blank(it.nganHang))) add('loi', who, 'Thiếu số tài khoản hoặc tên ngân hàng/tổ chức nơi mở tài khoản.', g.key);
      if (g.key === 'tsNuocNgoai' && blank(it.quocGia)) add('loi', who, 'Phải nêu rõ tài sản đang ở nước nào (chú thích 31).', g.key);
      if (['taiKhoan', 'soTietKiem'].includes(g.key) && (blank(it.soTK) || blank(it.toChuc))) add('loi', who, 'Thiếu số tài khoản/số sổ hoặc tên tổ chức nhận tiền gửi.', g.key);
    });
  });
  // Ngưỡng theo nhóm
  const tien = groupTotal(decl, MONEY_KEYS);
  if (tien > 0 && tien < NGUONG) add('goi_y', 'II.5 Tiền', `Tổng tiền ${fmtMoney(tien)} đồng dưới ngưỡng 150 triệu — không bắt buộc kê khai; khi xuất, mục 5 sẽ ghi "Không có" trừ khi bật "Vẫn kê khai dù dưới ngưỡng".`, 'tienMat');
  const ck = groupTotal(decl, SEC_KEYS);
  if (ck > 0 && ck < NGUONG) add('goi_y', 'II.6 Cổ phiếu, trái phiếu...', `Tổng giá trị ${fmtMoney(ck)} đồng dưới ngưỡng 150 triệu — không bắt buộc kê khai.`, 'coPhieu');
  // Kim loại quý: gộp theo loại (tên) vượt ngưỡng
  const klq = {}; (decl.ts.kimLoaiQuy || []).forEach(it => { const k = (it.ten || '').trim().toLowerCase().split(/\s+/)[0] || '?'; klq[k] = (klq[k] || 0) + itemValue(GROUP.kimLoaiQuy, it); });
  Object.entries(klq).forEach(([k, v]) => { if (v >= NGUONG && (decl.ts.kimLoaiQuy.filter(it => ((it.ten || '').trim().toLowerCase().split(/\s+/)[0] || '?') === k).length > 1)) add('goi_y', 'II.4 Kim loại quý, đá quý', `Các tài sản loại "${k}" cộng lại ${fmtMoney(v)} đồng (≥150 triệu) — phải kê khai đầy đủ tất cả.`, 'kimLoaiQuy'); });
  // Tiền: phân biệt tiền sở hữu thực tế
  (decl.ts.tienMat || []).forEach((it, i) => { if (itemValue(GROUP.tienMat, it) >= NGUONG && blank(it.tinhTrang)) add('canh_bao', 'II.5.1 Tiền mặt', 'Nên ghi rõ số tiền thuộc sở hữu thực tế và các khoản giữ hộ, vay mượn (chú thích 21).', 'tienMat'); });
  if (!decl.coVoChong && GROUPS.some(g => (decl.ts[g.key] || []).some(it => /Vợ\/chồng|Chung vợ chồng/.test(it.dungTen || '')))) add('loi', 'I.2 Vợ/chồng', 'Có tài sản ghi thuộc vợ/chồng nhưng chưa khai thông tin vợ/chồng.', 'vochong');
  if (!decl.con.length && GROUPS.some(g => (decl.ts[g.key] || []).some(it => /Con chưa thành niên/.test(it.dungTen || '')))) add('loi', 'I.3 Con chưa thành niên', 'Có tài sản ghi thuộc con chưa thành niên nhưng chưa khai thông tin con.', 'con');

  // --- 10. Thu nhập
  const inc = incomeTotals(decl);
  if (!lanDau) {
    const per = incomePeriod(decl, prev);
    if (!per || !per.tu) add('loi', 'II.10 Tổng thu nhập', 'Chưa xác định được kỳ tính thu nhập: cần ngày kê khai của lần liền trước (thu nhập tính từ ngày kế tiếp sau ngày kê khai lần trước đến ngày kê khai lần này — chú thích 33).', 'thunhap');
    if (inc.ban <= 0) add('loi', 'II.10 Tổng thu nhập', 'Chưa kê khai thu nhập của người kê khai giữa hai lần kê khai.', 'thunhap');
    if (decl.coVoChong && inc.vc <= 0) add('canh_bao', 'II.10 Tổng thu nhập', 'Chưa kê khai thu nhập của vợ/chồng (nếu không có thu nhập, ghi 0 và ghi chú "Không có thu nhập" ở mục nguồn khác).', 'thunhap');
    if (per && per.tu && per.den) {
      const est = calcSalary(decl.thuNhap.calc, per.tu, per.den, opts.lcs);
      if (est.total > 0 && num(decl.thuNhap.ban.luong) > 0) {
        const r = num(decl.thuNhap.ban.luong) / est.total;
        if (r < 0.8 || r > 1.3) add('canh_bao', 'II.10 Tổng thu nhập', `Thu nhập từ lương, phụ cấp đã ghi (${fmtMoney(decl.thuNhap.ban.luong)}) chênh nhiều so với ước tính theo hệ số (${fmtMoney(est.total)}). Kiểm tra lại các khoản phụ cấp, thưởng hoặc khấu trừ.`, 'thunhap');
      }
    }
  }
  // --- III. Biến động
  if (!lanDau) {
    if (!prev && !decl.ngayKeKhaiTruoc) add('canh_bao', 'III. Biến động', 'Không có dữ liệu kỳ trước trong ứng dụng: phải tự đối chiếu với bản kê khai liền trước để kê khai đầy đủ tài sản tăng/giảm.', 'biendong');
    if (prev) {
      const sug = compareDecls(decl, prev);
      const has = new Set([...decl.bienDong.tang, ...decl.bienDong.giam].map(x => x.key));
      const miss = [...sug.tang, ...sug.giam].filter(s => !has.has(s.key));
      if (miss.length) add('loi', 'III. Biến động', `Có ${miss.length} biến động so với kỳ trước chưa đưa vào Mục III. Bấm "Cập nhật gợi ý biến động".`, 'biendong');
    }
    decl.bienDong.tang.forEach((x, i) => { if (blank(x.giaiTrinh)) add('loi', 'III.1 Tài sản, thu nhập tăng', `Mục tăng thứ ${ordName(i)} (${x.moTa}) chưa giải trình nguồn gốc tài sản tăng thêm.`, 'biendong'); });
    decl.bienDong.giam.forEach((x, i) => { if (blank(x.giaiTrinh)) add('loi', 'III.2 Tài sản, thu nhập giảm', `Mục giảm thứ ${ordName(i)} (${x.moTa}) chưa ghi nguyên nhân giảm.`, 'biendong'); });
    // Đối soát dòng tiền
    if (prev) {
      const a = netWorth(decl).net, b = netWorth(prev).net, delta = a - b;
      const chi = num(decl.chiTieuUocTinh);
      const gap = delta - (inc.tong - chi);
      if (delta > 0 && gap > 0) add('canh_bao', 'Đối soát dòng tiền', `Tài sản ròng tăng ${fmtMoney(delta)} đồng, trong khi tổng thu nhập trong kỳ ${fmtMoney(inc.tong)}${chi ? ' trừ chi tiêu ước tính ' + fmtMoney(chi) : ''} — còn chênh ${fmtMoney(gap)} đồng chưa được bù bởi thu nhập. Giải trình rõ nguồn (vay, bán tài sản, được cho/tặng/thừa kế...) để tránh bị đánh giá giải trình không trung thực.`, 'biendong');
      const totalMove = [...decl.bienDong.tang, ...decl.bienDong.giam].reduce((s, x) => s + num(x.giaTri), 0);
      if (Math.abs(delta) >= NGUONG_BO_SUNG || inc.tong >= NGUONG_BO_SUNG) add('goi_y', 'Nghĩa vụ kê khai bổ sung', `Biến động tài sản/thu nhập trong năm từ 1 tỷ đồng trở lên — nếu người kê khai không thuộc diện kê khai hằng năm thì phải kê khai bổ sung (khoản 2 Điều 36 Luật PCTN sửa đổi 2025).`, 'biendong');
      void totalMove;
    }
  }
  // Mục IV
  if (prev && !lanDau) {
    const changedPerson = ['chucVu', 'coQuan', 'noiThuongTru', 'noiOHienNay', 'heSoPhuCap'].filter(k => (decl.nguoi[k] || '') !== (prev.nguoi[k] || ''));
    if ((changedPerson.length || decl.coVoChong !== prev.coVoChong || decl.con.length !== prev.con.length) && blank(decl.thayDoi.thongTinChung)) add('canh_bao', 'IV. Thay đổi thông tin chung', 'Thông tin chung (chức vụ, nơi ở, hôn nhân, con...) có thay đổi so với kỳ trước — nên ghi nội dung thay đổi và lý do vào Mục IV.1.', 'thaydoi');
  }
  return R;
}

// =====================================================================
// MÔ HÌNH VĂN BẢN (dùng chung cho xem trước HTML và xuất DOCX)
// block: {t:'p', runs:[{x, b, i, u}], align, indent, before, after, keep}
//        {t:'table', rows:[[cell...]], widths:[%], border}
//        {t:'pagebreak'}
// =====================================================================
const P = (text, o = {}) => ({ t: 'p', runs: Array.isArray(text) ? text : [{ x: text, b: o.b, i: o.i }], align: o.align || 'both', indent: o.indent ?? 0, firstLine: o.firstLine ?? 0, before: o.before ?? 2, after: o.after ?? 2, size: o.size });
const R = (x, o = {}) => Object.assign({ x }, o);
const dots = v => blank(v) ? '' : String(v);
const KHONG = 'Không có';

function buildDeclDoc(decl, prev, settings = {}) {
  const B = []; const lanDau = decl.phuongThuc === 'lan_dau';
  const line = (label, val, ind = 0.5, o = {}) => B.push(P([R(label + ': '), R(blank(val) ? (o.empty ?? KHONG) : String(val))], { indent: ind }));
  // Đầu trang
  const coLines = (decl.tenCoQuanDauTrang || 'TÊN CƠ QUAN, ĐƠN VỊ').toUpperCase().split(/\n/).map(x => x.trim()).filter(Boolean);
  const dang = decl.quocHieu === 'dang';
  const estW = (t, sz, bold) => t.length * sz * (bold ? 0.0192 : 0.0175); // ước lượng bề rộng chữ (cm)
  const leftCell = coLines.map((t, i) => P([R(t, { b: i === coLines.length - 1 || coLines.length === 1 })], { align: 'center', before: 0, after: 0, size: 12.5 }));
  const last = coLines[coLines.length - 1] || '';
  leftCell.push({ t: 'hr', w: Math.max(1.5, estW(last, 12.5, true) / 3) });
  const rightCell = dang
    ? [P([R('ĐẢNG CỘNG SẢN VIỆT NAM', { b: true })], { align: 'center', before: 0, after: 0, size: 13 }), { t: 'hr', w: estW('ĐẢNG CỘNG SẢN VIỆT NAM', 13, true) }]
    : [P([R('CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM', { b: true })], { align: 'center', before: 0, after: 0, size: 12.5 }), P([R('Độc lập - Tự do - Hạnh phúc', { b: true })], { align: 'center', before: 0, after: 0, size: 13 }), { t: 'hr', w: estW('Độc lập - Tự do - Hạnh phúc', 13, true) }];
  B.push({ t: 'table', border: false, widths: [40, 60], rows: [[leftCell, rightCell]] });
  B.push(P([R('BẢN KÊ KHAI TÀI SẢN, THU NHẬP', { b: true })], { align: 'center', before: 14, after: 0, size: 14 }));
  B.push(P([R(PHUONG_THUC[decl.phuongThuc] + (decl.phuongThuc === 'hang_nam' ? ' NĂM ' + decl.nam : ''), { b: true })], { align: 'center', before: 0, after: 0 }));
  B.push(P([R(`(Ngày chốt thông tin, dữ liệu về tài sản, thu nhập: ${fmtDate(decl.ngayChot) || '..../..../........'})`, { i: true })], { align: 'center', before: 0, after: 10 }));

  // I. THÔNG TIN CHUNG
  B.push(P([R('I. THÔNG TIN CHUNG', { b: true })]));
  B.push(P([R('1. Người kê khai tài sản, thu nhập', { b: true })]));
  const p = decl.nguoi;
  B.push(P([R('- Họ và tên: ' + dots(p.hoTen)), R('          Ngày, tháng, năm sinh: ' + fmtDate(p.ngaySinh))], { indent: 0.5 }));
  line('- Quê quán', p.queQuan); line('- Nơi thường trú', p.noiThuongTru); line('- Nơi ở hiện nay', p.noiOHienNay);
  B.push(P([R('- Chức vụ/chức danh: ' + dots(p.chucVu)), R('          Hệ số phụ cấp chức vụ: ' + (blank(p.heSoPhuCap) ? 'Không' : p.heSoPhuCap))], { indent: 0.5 }));
  line('- Cơ quan, đơn vị công tác', p.coQuan);
  B.push(P(`- Số thẻ căn cước/Số CCCD/Số định danh cá nhân: ${dots(p.soDinhDanh)}; ngày cấp: ${fmtDate(p.ngayCap)}; nơi cấp: ${dots(p.noiCap)}`, { indent: 0.5 }));
  line('- Số điện thoại', p.soDienThoai);

  B.push(P([R('2. Vợ hoặc chồng của người kê khai tài sản, thu nhập', { b: true })]));
  if (!decl.coVoChong) B.push(P(KHONG, { indent: 0.5 }));
  else {
    const v = decl.voChong;
    B.push(P([R('- Họ và tên: ' + dots(v.hoTen)), R('          Ngày, tháng, năm sinh: ' + fmtDate(v.ngaySinh))], { indent: 0.5 }));
    line('- Quê quán', v.queQuan); line('- Nơi thường trú', v.noiThuongTru); line('- Nơi ở hiện nay', v.noiOHienNay);
    B.push(P([R('- Chức vụ/chức danh/nghề nghiệp, công việc đang làm: ' + dots(v.ngheNghiep)), R('          Hệ số phụ cấp chức vụ (nếu có): ' + (blank(v.heSoPhuCap) ? 'Không' : v.heSoPhuCap))], { indent: 0.5 }));
    line('- Cơ quan, đơn vị công tác, nơi làm việc', v.noiLamViec);
    B.push(P(`- Số thẻ căn cước/Số CCCD/Số định danh cá nhân: ${dots(v.soDinhDanh)}; ngày cấp: ${fmtDate(v.ngayCap)}; nơi cấp: ${dots(v.noiCap)}`, { indent: 0.5 }));
    line('- Số điện thoại', v.soDienThoai);
  }
  B.push(P([R('3. Con chưa thành niên (con đẻ, con nuôi theo quy định của pháp luật)', { b: true })]));
  if (!decl.con.length) B.push(P(KHONG, { indent: 0.5 }));
  decl.con.forEach((c, i) => {
    B.push(P([R(`3.${i + 1}. Con thứ ${ordName(i)}:`, { i: true })], { indent: 0.25 }));
    B.push(P([R('- Họ và tên: ' + dots(c.hoTen)), R('          Ngày, tháng, năm sinh: ' + fmtDate(c.ngaySinh))], { indent: 0.5 }));
    line('- Nơi thường trú', c.noiThuongTru); line('- Nơi ở hiện nay', c.noiOHienNay);
    B.push(P(`- Số định danh cá nhân/Số thẻ căn cước: ${dots(c.soDinhDanh)}; ngày cấp: ${fmtDate(c.ngayCap)}; nơi cấp: ${dots(c.noiCap)}`, { indent: 0.5 }));
  });

  // II. THÔNG TIN MÔ TẢ VỀ TÀI SẢN
  B.push(P([R('II. THÔNG TIN MÔ TẢ VỀ TÀI SẢN', { b: true })], { before: 8 }));
  const valStr = (g, it) => {
    if (it.giaTri_unk) return 'Không xác định được giá trị' + (it.giaTri_unkReason ? ' (lý do: ' + it.giaTri_unkReason + ')' : '');
    const f = g.fields.find(x => x.k === 'giaTri');
    if (f && f.t === 'fx' && it.giaTri_cur && it.giaTri_cur !== 'VND') return `${fmtMoney(it.giaTri_fx)} ${it.giaTri_cur} (tỷ giá ${fmtMoney(it.giaTri_rate)}), quy đổi ${fmtVND(itemValue(g, it))}`;
    return fmtVND(itemValue(g, it));
  };
  const ownerNote = it => (it.dungTen && it.dungTen !== 'Người kê khai') ? `Thuộc sở hữu/sử dụng của: ${it.dungTen}. ` : '';
  const tail = (g, it) => {
    B.push(P('- Thông tin khác (nếu có): ' + dots(it.thongTinKhac), { indent: 0.5 }));
    B.push(P('+ Nguồn hình thành: ' + (blank(it.nguon) ? '' : it.nguon), { indent: 0.75 }));
    B.push(P('+ Tình trạng quản lý, sử dụng' + (['datO', 'datKhac'].includes(g.key) ? '' : ', sở hữu') + ': ' + dots(it.tinhTrang), { indent: 0.75 }));
    B.push(P('+ Ghi chú: ' + ownerNote(it) + dots(it.ghiChu), { indent: 0.75 }));
  };
  const head = (txt, ind = 0) => B.push(P([R(txt, { b: true })], { indent: ind }));
  const sub = (txt, ind = 0.25) => B.push(P([R(txt, { b: true, i: true })], { indent: ind }));
  const list = k => decl.ts[k] || [];
  const realEstate = (g, labelFn) => {
    const items = list(g.key);
    if (!items.length) { B.push(P(KHONG, { indent: 0.5 })); return; }
    items.forEach((it, i) => { B.push(P([R(`${g.sec}.${i + 1}. ${g.item} thứ ${ordName(i)}:`, { i: true })], { indent: 0.5 })); labelFn(it); tail(g, it); });
  };
  head('1. Quyền sử dụng đất:');
  sub('1.1. Đất ở:');
  realEstate(GROUP.datO, it => {
    line('- Địa chỉ', [it.diaChi, it.diaChiCu ? '(địa chỉ trên Giấy chứng nhận: ' + it.diaChiCu + ')' : ''].filter(Boolean).join(' '), 0.5, { empty: '' });
    line('- Diện tích', it.dienTich ? it.dienTich + ' m²' : '', 0.5, { empty: '' });
    line('- Giá trị', valStr(GROUP.datO, it)); line('- Giấy chứng nhận quyền sử dụng', it.gcn, 0.5, { empty: '' });
  });
  sub('1.2. Các loại đất khác:');
  realEstate(GROUP.datKhac, it => {
    line('- Loại đất', it.loaiDat, 0.5, { empty: '' });
    line('- Địa chỉ', [it.diaChi, it.diaChiCu ? '(địa chỉ trên Giấy chứng nhận: ' + it.diaChiCu + ')' : ''].filter(Boolean).join(' '), 0.5, { empty: '' });
    line('- Diện tích', it.dienTich ? it.dienTich + ' m²' : '', 0.5, { empty: '' });
    line('- Giá trị', valStr(GROUP.datKhac, it)); line('- Giấy chứng nhận quyền sử dụng', it.gcn, 0.5, { empty: '' });
  });
  head('2. Nhà ở, công trình xây dựng:');
  sub('2.1. Nhà ở:');
  realEstate(GROUP.nhaO, it => {
    line('- Loại nhà', it.loaiNha, 0.5, { empty: '' });
    line('- Địa chỉ', [it.diaChi, it.diaChiCu ? '(địa chỉ trên Giấy chứng nhận: ' + it.diaChiCu + ')' : ''].filter(Boolean).join(' '), 0.5, { empty: '' });
    line('- Diện tích sử dụng', it.dienTich ? it.dienTich + ' m²' : '', 0.5, { empty: '' });
    line('- Giá trị', valStr(GROUP.nhaO, it)); line('- Giấy chứng nhận quyền sở hữu', it.gcn, 0.5, { empty: '' });
  });
  sub('2.2. Công trình xây dựng khác:');
  realEstate(GROUP.congTrinh, it => {
    line('- Tên công trình', it.ten, 0.5, { empty: '' });
    line('- Địa chỉ', [it.diaChi, it.diaChiCu ? '(địa chỉ trên Giấy chứng nhận: ' + it.diaChiCu + ')' : ''].filter(Boolean).join(' '), 0.5, { empty: '' });
    line('- Diện tích', it.dienTich ? it.dienTich + ' m²' : '', 0.5, { empty: '' });
    line('- Giá trị', valStr(GROUP.congTrinh, it)); line('- Giấy chứng nhận quyền sở hữu', it.gcn, 0.5, { empty: '' });
  });
  head('3. Tài sản khác gắn liền với đất:');
  const simple3 = (g, title, fn) => {
    sub(title); const items = list(g.key);
    if (!items.length) { B.push(P(KHONG, { indent: 0.5 })); return; }
    items.forEach(it => { fn(it); tail(g, it); });
  };
  simple3(GROUP.cayLauNam, '3.1. Cây lâu năm:', it => B.push(P(`- Loại cây: ${dots(it.loaiCay)}; Số lượng: ${dots(it.soLuong)}; Giá trị: ${valStr(GROUP.cayLauNam, it)}`, { indent: 0.5 })));
  simple3(GROUP.rung, '3.2. Rừng sản xuất:', it => B.push(P(`- Loại rừng: ${dots(it.loaiRung)}; Diện tích: ${it.dienTich ? it.dienTich + ' m²' : ''}; Giá trị: ${valStr(GROUP.rung, it)}`, { indent: 0.5 })));
  simple3(GROUP.vatKienTruc, '3.3. Vật kiến trúc khác gắn liền với đất:', it => B.push(P(`- Tên gọi: ${dots(it.tenGoi)}; Số lượng: ${dots(it.soLuong)}; Đơn vị: ${dots(it.donVi)}; Giá trị: ${valStr(GROUP.vatKienTruc, it)}`, { indent: 0.5 })));

  head('4. Vàng, kim cương, bạch kim và các kim loại quý, đá quý khác:');
  const klq = list('kimLoaiQuy').filter(it => settings.keKhaiDuoiNguong || it.giaTri_unk || itemValue(GROUP.kimLoaiQuy, it) >= NGUONG || klqGroupOver(decl, it));
  if (!klq.length) B.push(P(KHONG, { indent: 0.5 }));
  klq.forEach((it, i) => {
    B.push(P([R(`4.${i + 1}. Tài sản thứ ${ordName(i)}:`, { i: true })], { indent: 0.5 }));
    B.push(P(`- Tên tài sản: ${dots(it.ten)}; Số lượng, đơn vị tính: ${dots(it.soLuong)}; Tổng giá trị: ${valStr(GROUP.kimLoaiQuy, it)}`, { indent: 0.5 }));
    tail(GROUP.kimLoaiQuy, it);
  });

  // 5. Tiền
  const tien = groupTotal(decl, MONEY_KEYS);
  const showTien = tien >= NGUONG || settings.keKhaiDuoiNguong;
  B.push(P([R('5. Tiền (tiền Việt Nam, ngoại tệ): ', { b: true }), R('ghi tổng số tiền tại thời điểm kê khai bao gồm tiền mặt, tiền cho vay, tiền trả trước, tiền gửi cá nhân, tổ chức trong nước, tổ chức nước ngoài tại Việt Nam: '), R(showTien ? fmtVND(tien) : KHONG, { b: true })]));
  if (showTien) {
    const sumOf = k => list(k).reduce((s, it) => s + itemValue(GROUP[k], it), 0);
    const fxNote = (g, it) => (it.giaTri_cur && it.giaTri_cur !== 'VND') ? ` (${fmtMoney(it.giaTri_fx)} ${it.giaTri_cur}, tỷ giá ${fmtMoney(it.giaTri_rate)})` : '';
    const tm = list('tienMat');
    B.push(P(`5.1. Tiền mặt: ${tm.length ? fmtVND(sumOf('tienMat')) + tm.map(it => fxNote(GROUP.tienMat, it)).join('') : KHONG}. Tình trạng quản lý, sử dụng: ${tm.map(it => [ownerNote(it), it.tinhTrang].filter(Boolean).join('')).filter(Boolean).join('; ')}`, { indent: 0.25 }));
    const cv = list('tienChoVay');
    B.push(P(`5.2. Tiền cho vay: ${cv.length ? fmtVND(sumOf('tienChoVay')) : KHONG}. Tài liệu minh chứng (nếu có): ${cv.map(it => [it.benVay ? 'cho ' + it.benVay + ' vay ' + fmtMoney(itemValue(GROUP.tienChoVay, it)) + fxNote(GROUP.tienChoVay, it) : '', it.minhChung].filter(Boolean).join(', ')).filter(Boolean).join('; ')}`, { indent: 0.25 }));
    const tt = list('tienTraTruoc');
    B.push(P(`5.3. Tiền trả trước: ${tt.length ? fmtVND(sumOf('tienTraTruoc')) : KHONG}. Tài liệu minh chứng (nếu có): ${tt.map(it => [it.noiDung, it.minhChung].filter(Boolean).join(', ')).filter(Boolean).join('; ')}`, { indent: 0.25 }));
    B.push(P('5.4. Tiền gửi cá nhân hoặc tổ chức trong nước, tổ chức nước ngoài tại Việt Nam', { indent: 0.25 }));
    const tk = list('taiKhoan'), stk = list('soTietKiem'), kh = list('tienGuiKhac');
    if (!tk.length && !stk.length && !kh.length) B.push(P(KHONG, { indent: 0.5 }));
    tk.forEach(it => B.push(P(`- Số tài khoản thanh toán: ${dots(it.soTK)}. Tại đơn vị, tổ chức: ${dots(it.toChuc)}. Số dư tại thời điểm kê khai: ${fmtVND(itemValue(GROUP.taiKhoan, it))}${fxNote(GROUP.taiKhoan, it)}${it.dungTen && it.dungTen !== 'Người kê khai' ? ' (' + it.dungTen + ')' : ''}`, { indent: 0.5 })));
    stk.forEach(it => B.push(P(`- Số tài khoản/số sổ tiết kiệm: ${dots(it.soTK)}. Tại đơn vị, tổ chức: ${dots(it.toChuc)}. Số tiền: ${fmtVND(itemValue(GROUP.soTietKiem, it))}${fxNote(GROUP.soTietKiem, it)}${it.dungTen && it.dungTen !== 'Người kê khai' ? ' (' + it.dungTen + ')' : ''}`, { indent: 0.5 })));
    kh.forEach(it => B.push(P(`- Các loại tiền gửi khác: ${dots(it.moTa)}. Tổng số tiền: ${fmtVND(itemValue(GROUP.tienGuiKhac, it))}${fxNote(GROUP.tienGuiKhac, it)}. Tài liệu minh chứng (nếu có): ${dots(it.minhChung)}`, { indent: 0.5 })));
  }
  // 6. Chứng khoán
  const ckT = groupTotal(decl, SEC_KEYS);
  const showCk = ckT >= NGUONG || settings.keKhaiDuoiNguong;
  head('6. Cổ phiếu, trái phiếu, vốn góp, các loại giấy tờ có giá khác:');
  if (!showCk) B.push(P(KHONG, { indent: 0.5 }));
  else {
    const sec6 = (k, title, fn) => { B.push(P(title, { indent: 0.25 })); const it = list(k); if (!it.length) B.push(P(KHONG, { indent: 0.5 })); it.forEach(x => B.push(P(fn(x), { indent: 0.5 }))); };
    sec6('coPhieu', '6.1. Cổ phiếu:', x => `- Tên cổ phiếu: ${dots(x.ten)}; Số lượng: ${dots(x.soLuong)}; Giá trị: ${fmtVND(itemValue(GROUP.coPhieu, x))}`);
    sec6('traiPhieu', '6.2. Trái phiếu:', x => `- Tên trái phiếu: ${dots(x.ten)}; Số lượng: ${dots(x.soLuong)}; Giá trị: ${fmtVND(itemValue(GROUP.traiPhieu, x))}`);
    sec6('vonGop', '6.3. Vốn góp:', x => `- Hình thức, loại vốn góp: ${dots(x.hinhThuc)}; Giá trị: ${fmtVND(itemValue(GROUP.vonGop, x))}; Tài liệu minh chứng (nếu có): ${dots(x.minhChung)}`);
    sec6('giayToCoGia', '6.4. Các loại giấy tờ có giá khác:', x => `- Tên giấy tờ có giá: ${dots(x.ten)}; Giá trị: ${fmtVND(itemValue(GROUP.giayToCoGia, x))}; Tài liệu minh chứng (nếu có): ${dots(x.minhChung)}`);
  }
  // 7. Tài sản khác
  head('7. Tài sản khác:');
  const over = (k) => list(k).filter(it => settings.keKhaiDuoiNguong || itemValue(GROUP[k], it) >= NGUONG || it.giaTri_unk);
  B.push(P('7.1. Tài sản theo quy định của pháp luật phải đăng ký sử dụng và được cấp giấy đăng ký (tàu bay, tàu thủy, thuyền, máy ủi, máy xúc, ô tô, mô tô, xe gắn máy...):', { indent: 0.25 }));
  const d71 = over('tsDangKy'); if (!d71.length) B.push(P(KHONG, { indent: 0.5 }));
  d71.forEach(x => B.push(P(`- Tên tài sản: ${dots(x.ten)}; Số đăng ký: ${dots(x.soDangKy)}; Giá trị: ${valStr(GROUP.tsDangKy, x)}; Thông tin khác (nếu có): ${ownerNote(x)}${dots(x.thongTinKhac)}`, { indent: 0.5 })));
  B.push(P('7.2. Tài sản khác như tài sản số, tài sản đấu giá (biển số xe, sim điện thoại...), quyền sở hữu trí tuệ, đồ mỹ nghệ, đồ thờ cúng, bàn ghế, cây cảnh, tranh, ảnh, cổ vật...:', { indent: 0.25 }));
  const d72 = over('tsKhac'); if (!d72.length) B.push(P(KHONG, { indent: 0.5 }));
  d72.forEach(x => B.push(P(`- Loại tài sản: ${dots(x.loai)}; Số lượng, giá trị: ${dots(x.soLuong)}${x.soLuong ? ', ' : ''}${valStr(GROUP.tsKhac, x)}; Thông tin khác (nếu có): ${ownerNote(x)}${dots(x.thongTinKhac)}; Tài liệu minh chứng (nếu có): ${dots(x.minhChung)}`, { indent: 0.5 })));
  // 8, 9

const b64 = { enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }, dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };

function fld(path, label, val, o = {}) {
  const t = o.t || 'text'; const h = o.hint ? `<span class="h">${esc(o.hint)}</span>` : '';
  const cls = o.full ? 'f full' : 'f';
  if (t === 'area') return `<label class="${cls}">${esc(label)}${h}<textarea data-b="${path}" rows="${o.rows || 2}">${esc(val)}</textarea></label>`;
  if (t === 'select') return `<label class="${cls}">${esc(label)}${h}<select data-b="${path}">${o.opts.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>`;
  if (t === 'date') return `<label class="${cls}">${esc(label)}${h}<input type="date" data-b="${path}" value="${esc(val)}"></label>`;
  if (t === 'money') return `<label class="${cls}">${esc(label)}${h}<input type="text" inputmode="numeric" data-b="${path}" data-money value="${val ? esc(K.fmtMoney(K.num(val))) : ''}" placeholder="0"><span class="money-read">${val && K.num(val) ? esc(K.docSo(K.num(val))) : ''}</span></label>`;
  if (t === 'num') return `<label class="${cls}">${esc(label)}${h}<input type="text" inputmode="decimal" data-b="${path}" value="${esc(val)}"></label>`;
  return `<label class="${cls}">${esc(label)}${h}<input type="text" data-b="${path}" value="${esc(val)}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}></label>`;
}
function fxField(path, f, it) {
  const cur = it[f.k + '_cur'] || 'VND';
  const curs = ['VND', 'USD', 'EUR', 'JPY', 'CNY', 'KRW', 'AUD', 'GBP', 'SGD', 'THB', 'Khác'];
  const vnd = K.itemValue({ fields: [f] }, it);
  return `<div class="full" style="display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:start">
    <label class="f">Loại tiền<select data-b="${path}.${f.k}_cur" data-rerender>${curs.map(c => `<option ${c === cur ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
    ${cur === 'VND' ? fld(`${path}.${f.k}`, f.l, it[f.k], { t: 'money', hint: f.hint }) :
      `<label class="f">Số lượng ngoại tệ (${esc(cur)})<input type="text" inputmode="decimal" data-b="${path}.${f.k}_fx" data-fx value="${esc(it[f.k + '_fx'])}"></label>
       <label class="f">Tỷ giá liên ngân hàng tại thời điểm sở hữu (đồng/1 ${esc(cur)})<input type="text" inputmode="decimal" data-b="${path}.${f.k}_rate" data-fx value="${esc(it[f.k + '_rate'])}"><span class="money-read" data-fxout>Quy đổi: ${K.fmtVND(vnd)}</span></label>`}
  </div>`;
}
function itemFields(g, it) {
  const path = `ts.${g.key}.#${it.id}`;
  let html = '<div class="grid">';
  g.fields.forEach(f => {
    if (f.t === 'fx') { html += fxField(path, f, it); return; }
    if (f.k === 'giaTri' && f.unknown) {
      html += `<div>${it.giaTri_unk ? `<label class="f">Giá trị<input type="text" value="Không xác định được giá trị" disabled></label>` : fld(`${path}.giaTri`, f.l, it.giaTri, { t: 'money', hint: f.hint })}
        <label class="chk" style="margin-top:4px"><input type="checkbox" data-b="${path}.giaTri_unk" data-rerender ${it.giaTri_unk ? 'checked' : ''}> Không xác định được giá trị</label>
        ${it.giaTri_unk ? fld(`${path}.giaTri_unkReason`, 'Lý do không xác định được giá trị', it.giaTri_unkReason, { t: 'text' }) : ''}</div>`;
      return;
    }
    const full = f.t === 'area' || ['diaChi', 'diaChiCu', 'gcn', 'moTa', 'nganHang', 'loai', 'hinhThuc'].includes(f.k);
    html += fld(`${path}.${f.k}`, f.l, it[f.k], { t: f.t, opts: f.opts, hint: f.hint, full });
  });
  return html + '</div>';
}
function itemTitle(g, it, i) {

// ------------------------------------------------------------------ EVENTS
function bindGlobal() {
  document.body.addEventListener('input', onInput);
  document.body.addEventListener('change', onChange);
  document.body.addEventListener('click', onClick);
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.dm !== undefined) return dmInput(e);
  if (!el.dataset.b || el.dataset.b === 'quocHieu') return;
  const d = curDecl(); if (!d) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.money !== undefined) {
    const n = K.num(v); const read = el.parentElement.querySelector('.money-read'); if (read) read.textContent = n ? K.docSo(n) : '';
    v = n ? String(n) : '';
  }
  setPath(d, el.dataset.b, v);
  if (el.dataset.fx !== undefined) { const box = el.closest('.full'); const path = el.dataset.b.replace(/\.giaTri_(fx|rate)$/, ''); const it = getPath(d, path); const g = K.GROUP[path.split('.')[1]]; const o = box && box.querySelector('[data-fxout]'); if (o) o.textContent = 'Quy đổi: ' + K.fmtVND(K.itemValue(g, it)); }
  if (el.dataset.b === 'nguoi.hoTen') { const h = curHoSo(); if (h && (h.label === 'Hồ sơ mới' || h.autoLabel)) { h.label = v || 'Hồ sơ mới'; h.autoLabel = true; const o = $('#selHS option:checked'); if (o) o.textContent = h.label; } }
  touch();
}
function onChange(e) {
  const el = e.target;
  if (el.id === 'selHS') { const h = db.hoso.find(x => x.id === el.value); db.cur.hosoId = h.id; db.cur.declId = h.decls.length ? h.decls[h.decls.length - 1].id : null; ui.page = 'ky'; persist(); render(); return; }
  if (el.id === 'selKy') { db.cur.declId = el.value; persist(); render(); return; }
  if (el.dataset.s) { db.settings[el.dataset.s] = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? +el.value : (isNaN(+el.value) ? el.value : +el.value)); persist(); return; }
  if (el.dataset.dm !== undefined) return dmChange(e);
  if (el.dataset.b === 'quocHieu') { curDecl().quocHieu = el.value.startsWith('Cơ quan của Đảng') ? 'dang' : 'nha_nuoc'; touch(); return; }
  if (el.dataset.b && el.dataset.money !== undefined) { el.value = el.value ? K.fmtMoney(K.num(el.value)) : ''; }
  if (el.dataset.rerender !== undefined) { if (el.type === 'radio') setPath(curDecl(), el.dataset.b, el.value); touch(); const y = window.scrollY; render(); window.scrollTo(0, y); }
  else if (el.dataset.b && ['thunhap', 'biendong', 'tien', 'ck'].includes(ui.page) && !el.closest('.item-b textarea')) { clearTimeout(window._rrT); window._rrT = setTimeout(() => { if (document.activeElement && document.activeElement.matches('input,textarea,select') && document.activeElement !== el) { const p = document.activeElement.dataset.b; const y = window.scrollY; render(); window.scrollTo(0, y); if (p) { const n = document.querySelector(`[data-b="${p}"]`); if (n) n.focus(); } } else { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 180); }
  if (el.dataset.b && el.closest('.item')) { /* cập nhật tiêu đề mục */ const it = el.closest('.item'); const d = curDecl(); const m = el.dataset.b.match(/^ts\.(\w+)\.#(\w+)/); if (m) { const g = K.GROUP[m[1]]; const idx = d.ts[m[1]].findIndex(x => x.id === m[2]); const obj = d.ts[m[1]][idx]; $('.item-h .t', it).textContent = itemTitle(g, obj, idx); const vv = $('.item-h .v', it); if (vv) vv.textContent = obj.giaTri_unk ? 'Không xác định' : K.fmtVND(K.itemValue(g, obj)); } }
}
async function onClick(e) {
  const el = e.target.closest('[data-act],[data-mode]'); if (!el) return;
  if (el.dataset.mode && !el.dataset.act) { ui.mode = el.dataset.mode; renderShell(); return; }
  const act = el.dataset.act; const d = curDecl();
  const rr = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  switch (act) {
    case 'mode': ui.mode = el.dataset.mode; renderShell(); break;
    case 'goto': { const nav = el.dataset.nav; const pid = NAV_OF[nav] || nav; if (ui.mode !== 'kekhai') { ui.mode = 'kekhai'; } ui.page = pid; render(); window.scrollTo(0, 0); if (nav !== pid) { const g = document.getElementById('g-' + nav); if (g) g.scrollIntoView({ behavior: 'smooth' }); } break; }
    case 'add': { const it = K.newItem(el.dataset.g); d.ts[el.dataset.g].push(it); ui.openItems[it.id] = true; touch(); rr(); break; }
    case 'dup': { e.stopPropagation(); const arr = d.ts[el.dataset.g]; const src = arr.find(x => x.id === el.dataset.id); const it = Object.assign(K.clone(src), { id: K.uid() }); arr.splice(arr.indexOf(src) + 1, 0, it); ui.openItems[it.id] = true; touch(); rr(); break; }
    case 'del': { e.stopPropagation(); if (!await confirmBox('Xoá tài sản', 'Xoá mục này khỏi bản kê khai? Nếu tài sản đã bán/tặng cho trong kỳ, sau khi xoá hãy ghi nguyên nhân giảm ở Mục III.', 'Xoá', true)) return; d.ts[el.dataset.g] = d.ts[el.dataset.g].filter(x => x.id !== el.dataset.id); touch(); rr(); break; }
    case 'toggle': { if (e.target.closest('button')) return; ui.openItems[el.dataset.id] = !ui.openItems[el.dataset.id]; rr(); break; }
    case 'addCon': d.con.push(K.emptyChild()); touch(); rr(); break;
    case 'delCon': if (await confirmBox('Xoá', 'Xoá thông tin người con này?', 'Xoá', true)) { d.con = d.con.filter(x => x.id !== el.dataset.id); touch(); rr(); } break;
    case 'fillSalary': { const per = K.incomePeriod(d, curPrev()); if (!per || !per.tu || !per.den) { toast('Chưa đủ ngày để xác định kỳ thu nhập'); return; } const who = el.dataset.who; const r = K.calcSalary(who === 'ban' ? d.thuNhap.calc : d.thuNhap.calcVoChong, per.tu, per.den, db.settings.lcs); if (!r.total) { toast('Nhập hệ số lương trước'); return; } d.thuNhap[who].luong = String(r.total); touch(); rr(); toast('Đã điền ' + K.fmtVND(r.total) + ' — hãy đối chiếu với thực nhận'); break; }
    case 'suggestBD': K.applyBienDongSuggest(d, curPrev()); touch(); rr(); toast('Đã cập nhật gợi ý biến động'); break;
    case 'addBD': d.bienDong[el.dataset.kind].push({ id: K.uid(), auto: false, moTa: '', giaTri: '', giaiTrinh: '', minhChung: '' }); touch(); rr(); break;
    case 'delBD': d.bienDong[el.dataset.kind] = d.bienDong[el.dataset.kind].filter(x => x.id !== el.dataset.id); touch(); rr(); break;
    case 'newHS': return newHoSoFlow(!!el.dataset.ho);
    case 'newKy': return newKyFlow();
    case 'hsMenu': return hsMenu();
    case 'preview': return previewDecl(d);
    case 'docx': return exportDocx(d);
    case 'print': return printDecl(d);
    case 'sendFile': return sendFileFlow();
    case 'json': { const blob = new Blob([JSON.stringify(K.exportStructured(curHoSo(), d, curPrev()), null, 2)], { type: 'application/json' }); saveBlob(blob, `KeKhai_${safeName(d.nguoi.hoTen)}_${d.nam}.json`); break; }
    case 'saveAll': return backupAll();
    case 'openFile': return openFileFlow();
    case 'settings': return settingsModal();
    case 'about': return aboutModal();
    default: if (act.startsWith('dm')) return dmClick(e, el, act);
  }
}

function exportOpts(d) { return { fontSize: +db.settings.fontSize || 13, footer: `Người kê khai ký: .................................`, title: 'Bản kê khai tài sản, thu nhập — ' + (d.nguoi.hoTen || ''), creator: d.nguoi.hoTen }; }
function declBlocks(d) { return K.buildDeclDoc(d, prevOf(curHoSo(), d), { keKhaiDuoiNguong: db.settings.keKhaiDuoiNguong }); }
async function exportDocx(d, blocks, name) {
  const R = K.review(d, curPrev(), { lcs: db.settings.lcs }); const nErr = R.filter(x => x.level === 'loi').length;
  if (nErr && !blocks) { const ok = await confirmBox('Còn lỗi chưa sửa', `Bản kê khai còn <b>${nErr} lỗi</b>. Vẫn xuất file Word để xem/chỉnh tiếp?`, 'Vẫn xuất'); if (!ok) return; }
  const bytes = K.buildDocx(blocks || declBlocks(d), exportOpts(d));
  await saveBlob(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }), name || `BanKeKhai_${safeName(d.nguoi.hoTen)}_${d.nam}.docx`);
}
function previewDecl(d, blocks) {
  modal('Xem trước bản kê khai', `<div class="paper">${K.blocksToHtml(blocks || declBlocks(d), +db.settings.fontSize || 13)}</div>`, [{ label: 'Đóng' }, { label: '🖨 In', onClick: () => { printDecl(d, blocks); return false; } }, { label: '⬇ Xuất Word', cls: 'pri', onClick: () => { exportDocx(d, blocks); return false; } }]);
}
function printDecl(d, blocks) { $('#printArea').innerHTML = `<div class="paper">${K.blocksToHtml(blocks || declBlocks(d), +db.settings.fontSize || 13)}</div>`; setTimeout(() => window.print(), 50); }
async function sendFileFlow() {
  const h = curHoSo(); const d = curDecl();
  const pw = await askPassword('Lưu file gửi đầu mối', 'File .tstn chứa toàn bộ hồ sơ của bạn (kể cả các kỳ trước để đầu mối đối chiếu biến động). Đặt mật khẩu để mã hoá; chỉ báo mật khẩu cho người tiếp nhận <b>qua kênh riêng</b> (gọi điện, gặp trực tiếp). Để trống nếu không mã hoá (không khuyến nghị).', true);
  if (pw === null) return;
  const text = await K.encryptJSON({ type: 'hoso', sentDeclId: d.id, sentAt: new Date().toISOString(), hoso: h }, pw);
  await saveBlob(new Blob([text], { type: 'application/json' }), `KeKhai_${safeName(d.nguoi.hoTen)}_${d.nam}.tstn`);
}
async function backupAll() {
  if (!db.hoso.length && !db.dauMoi.items.length) { toast('Chưa có dữ liệu để sao lưu'); return; }
  const pw = await askPassword('Sao lưu toàn bộ dữ liệu', 'Lưu tất cả hồ sơ và dữ liệu đầu mối trên máy này ra một file .tstn. Nên đặt mật khẩu (tối thiểu 6 ký tự) và cất file ở nơi an toàn (USB, Drive cá nhân). Ghi nhớ mật khẩu — mất mật khẩu sẽ không mở được file.', true);
  if (pw === null) return;
  const text = await K.encryptJSON({ type: 'backup', at: new Date().toISOString(), db }, pw);
  const ok = await saveBlob(new Blob([text], { type: 'application/json' }), `SaoLuu_KeKhaiTSTN_${K.todayISO()}.tstn`, 'backup');
  if (ok) { db.settings.lastBackup = new Date().toISOString(); persist(); toast('Đã sao lưu'); }
}
async function openFileFlow() {
  const [f] = await pickFiles('.tstn,.json'); if (!f) return;
  const r = await openTstnText(await readText(f), f.name); if (!r) return;
  const data = r.data;
  if (data.type === 'backup') {
    const ok = await confirmBox('Khôi phục bản sao lưu', `File sao lưu ngày ${new Date(data.at).toLocaleString('vi-VN')} có ${data.db.hoso.length} hồ sơ. <b>Gộp</b> vào dữ liệu hiện có (hồ sơ trùng sẽ được thay bằng bản trong file)?`, 'Gộp dữ liệu');
    if (!ok) return;
    data.db.hoso.forEach(h => { db.hoso = db.hoso.filter(x => x.id !== h.id); db.hoso.push(h); });
    if (data.db.dauMoi && data.db.dauMoi.items) data.db.dauMoi.items.forEach(it => { db.dauMoi.items = db.dauMoi.items.filter(x => x.id !== it.id); db.dauMoi.items.push(it); });
    fixDB(); if (!curDecl() && db.hoso.length) db.cur = { hosoId: db.hoso[0].id, declId: db.hoso[0].decls.slice(-1)[0].id };
    await persist(); renderShell(); toast('Đã khôi phục'); return;
  }
  const hoso = data.type === 'hoso' ? data.hoso : (data.decls ? data : null);
  if (!hoso) { toast('File không chứa hồ sơ kê khai'); return; }
  if (ui.mode === 'daumoi') { dmAddFromData(data, f.name); return; }
  const exist = db.hoso.find(x => x.id === hoso.id);
  if (exist && !await confirmBox('Hồ sơ đã có trên máy', `Hồ sơ "${esc(hoso.label)}" đã có. Thay bằng dữ liệu trong file (có thể kèm góp ý của đầu mối)?`, 'Thay thế')) return;
  db.hoso = db.hoso.filter(x => x.id !== hoso.id); db.hoso.push(hoso); fixDB();
  const h = db.hoso.find(x => x.id === hoso.id);
  db.cur = { hosoId: h.id, declId: data.sentDeclId && h.decls.some(x => x.id === data.sentDeclId) ? data.sentDeclId : h.decls.slice(-1)[0].id };
  ui.mode = 'kekhai'; const hasCmt = (curDecl().review.comments || []).length; ui.page = hasCmt ? 'xuat' : 'ky';
  await persist(); renderShell(); toast(hasCmt ? 'Đã mở hồ sơ — có góp ý từ đầu mối' : 'Đã mở hồ sơ');
}
function checkBackupReminder() {
  if (!db.hoso.length) return;
  const last = db.settings.lastBackup ? new Date(db.settings.lastBackup) : null;
  if (!last || (Date.now() - last) > 14 * 86400000) setTimeout(() => { setSaved((last ? 'Lần sao lưu cuối: ' + last.toLocaleDateString('vi-VN') : 'Chưa sao lưu ra file') + ' — nên bấm 💾 Sao lưu'); }, 1500);
}

function dmItem(id) { return db.dauMoi.items.find(x => x.id === id); }
function dmDecl(it) { if (!it.hoso) return null; return it.hoso.decls.find(x => x.id === it.declId) || it.hoso.decls.slice(-1)[0]; }

async function dmReturn(it) {

  if (pw === null) return;
  const text = await K.encryptJSON({ type: 'hoso', sentDeclId: d.id, sentAt: new Date().toISOString(), hoso: it.hoso }, pw);
  await saveBlob(new Blob([text], { type: 'application/json' }), `KeKhai_${safeName(it.hoTen)}_${d.nam}_gopy.tstn`);
  it.status = 'Cần bổ sung'; persist(); renderDauMoiSide();
}

// ------------------------------------------------------------------ UPDATE CHECK
async function checkUpdate() {
  if (!navigator.onLine || !K.APP.updateUrl || location.protocol === 'http:' && /localhost|127\./.test(location.host)) return;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(K.APP.updateUrl + '?t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' }); if (!r.ok) return;
    const v = await r.json(); const newer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) > (y[i] || 0)) return true; if ((x[i] || 0) < (y[i] || 0)) return false; } return false; };
    if (v.version && newer(v.version, K.APP.version)) {
      const isPWA = location.protocol.startsWith('http');
      $('#updBanner').innerHTML = `<div class="banner">🔔 Có phiên bản mới <b>${esc(v.version)}</b>${v.notes ? ': ' + esc(v.notes) : ''}. ${isPWA ? '<button class="btn sm pri" onclick="location.reload()">Tải lại để cập nhật</button>' : `<a class="btn sm pri" href="${esc(v.download || K.APP.homeUrl)}" target="_blank" rel="noopener">Tải bản mới</a> <span class="small mut">Dữ liệu của bạn được giữ nguyên.</span>`}</div>`;
    }
  } catch { /* offline */ }
}

  if (st === 'locked') {
    document.body.innerHTML = `<div class="welcome"><div class="card"><h2>🔒 ${esc(K.APP.name)}</h2><p>Dữ liệu trên máy này đã được mã hoá. Nhập mật khẩu để mở.</p><input type="password" id="unl" placeholder="Mật khẩu"><div class="row" style="margin-top:10px"><button class="btn pri" id="unlBtn">Mở khoá</button></div><p class="small mut" style="margin-top:12px">${esc(K.APP.copyright)}</p></div></div>`;
    const go = async () => { try { db = await K.decryptJSON(localStorage.getItem(DB_ENC_KEY), $('#unl').value); sessionPw = $('#unl').value; fixDB(); start(); } catch { toast('Sai mật khẩu'); } };
    $('#unlBtn').onclick = go; $('#unl').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#unl').focus();
    return;
  }
  start();
}
function start() {
  if (!db.cur.hosoId && db.hoso.length) db.cur = { hosoId: db.hoso[0].id, declId: db.hoso[0].decls.slice(-1)[0]?.id };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (!K.cryptoOK()) setTimeout(() => toast('Trình duyệt không hỗ trợ mã hoá — nên dùng Chrome/Edge bản mới'), 1000);
  renderShell(); setSaved(db.hoso.length ? 'Dữ liệu đã lưu trên máy' : ''); checkBackupReminder();
  setTimeout(checkUpdate, 2500);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.KKUI = { get db() { return db; }, render, persist };
document.addEventListener('DOMContentLoaded', boot);
})();

</script>
